<script>
window._configClubPromise = fetch('/api/config').then(r=>r.json()).catch(()=>({onesignalAppId:null, iconoDeporte:'⚽'}));
window._iconoDeporteActual = '⚽';
window._configClubPromise.then(cfg => {
  window._iconoDeporteActual = cfg.iconoDeporte || '⚽';
  document.querySelectorAll('.ic-deporte').forEach(el => el.textContent = window._iconoDeporteActual);
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/OneSignalSDKWorker.js').catch(e => console.error('No se pudo registrar el Service Worker:', e));
}
</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    try {
      const cfg = await window._configClubPromise;
      if (cfg.onesignalAppId) await OneSignal.init({ appId: cfg.onesignalAppId });
    } catch (e) {
      console.error('No se pudo inicializar OneSignal:', e);
    }
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-0:#0E1712;
    --pitch-1:#14231A;
    --pitch-2:#1C2E20;
    --pitch-3:#28402F;
    --line:#33502F;
    --chalk:#E9EEE3;
    --chalk-dim:#9FB09A;
    --gold:#FFD23F;
    --gold-dim:#8C7A2A;
    --red:#E85D4C;
    --green-ok:#6FCF97;
    --radius:14px;
  }
  [data-theme="light"]{
    --pitch-0:#F7F9F5; --pitch-1:#FFFFFF; --pitch-2:#EEF2EA; --pitch-3:#E0E8DA;
    --line:#C9D6C2; --chalk:#16241A; --chalk-dim:#5A6B54; --gold:#C9971F; --gold-dim:#8C7A2A;
    --red:#C0392B; --green-ok:#2E9E5B;
  }
  [data-theme="light"] body{ background: var(--pitch-0); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1A2C1F 0%, var(--pitch-1) 55%),
      var(--pitch-1);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  #appRoot{
    display:none;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}

  header.top{
    flex-shrink:0;
    background:linear-gradient(180deg, var(--pitch-1) 70%, transparent);
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{
    display:flex;align-items:baseline;gap:10px;
  }
  header.top .brand .mark{color:var(--gold);font-size:22px;}
  header.top h1{font-size:22px;margin:0;font-weight:600;color:var(--chalk);}
  header.top .sub{font-size:12px;color:var(--chalk-dim);margin-top:2px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;}
  .centerline{height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px, transparent 10px 18px);margin-top:12px;border-radius:2px;}

  main{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:18px 16px calc(24px + env(safe-area-inset-bottom));
    max-width:640px;margin:0 auto;
    width:100%;
    box-sizing:border-box;
  }
  .screen{display:none;animation:fade .25s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .card{
    background:var(--pitch-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .card-title{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-title h3{margin:0;font-size:18px;color:var(--chalk);}
  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 8px;border-radius:20px;
    text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;
  }
  .badge.cerrado{background:rgba(232,93,76,.15);color:var(--red);border:1px solid rgba(232,93,76,.3);}
  .badge.confirmando{background:rgba(111,207,151,.15);color:var(--green-ok);border:1px solid rgba(111,207,151,.3);}
  .badge.en_juego{background:rgba(255,210,63,.15);color:var(--gold);border:1px solid rgba(255,210,63,.3);}
  .badge.finalizado{background:rgba(159,176,154,.15);color:var(--chalk-dim);border:1px solid var(--line);}
  .badge.cancelado{background:rgba(232,93,76,.15);color:var(--red);border:1px solid rgba(232,93,76,.3);}
  .badge.admin{background:rgba(255,210,63,.15);color:var(--gold);border:1px solid rgba(255,210,63,.3);}
  .badge.controlador{background:rgba(159,176,154,.15);color:var(--chalk-dim);border:1px solid var(--line);}
  .meta{color:var(--chalk-dim);font-size:14px;margin-top:6px;line-height:1.6;}
  .meta b{color:var(--chalk);font-weight:600;}

  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .tabbar-scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
  .tabbar-scroll::-webkit-scrollbar{display:none;}
  .tabbar-scroll button{flex-shrink:0;}
  button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    border:1px solid var(--line);background:var(--pitch-3);color:var(--chalk);
    padding:10px 14px;border-radius:10px;cursor:pointer;transition:.15s;
  }
  button:active{transform:scale(.97);}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  button.primary{background:var(--gold);color:var(--pitch-0);border-color:var(--gold);}
  button.danger{background:transparent;color:var(--red);border-color:rgba(232,93,76,.4);}
  button.ghost{background:transparent;}
  button.block{width:100%;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.sm{padding:7px 10px;font-size:13px;}

  input,select{
    width:100%;font-family:'Inter',sans-serif;font-size:15px;
    background:var(--pitch-0);border:1px solid var(--line);color:var(--chalk);

  label:first-child{margin-top:0;}

    position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;
    width:56px;height:56px;border-radius:50%;
    background:var(--gold);color:var(--pitch-0);border:none;
    font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.4);

  nav.tabs{
    flex-shrink:0;
    display:flex;background:var(--pitch-2);border-top:1px solid var(--line);

  .empty{text-align:center;padding:48px 16px;color:var(--chalk-dim);}
  .empty .ic{font-size:40px;display:block;margin-bottom:10px;}

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
    background:var(--pitch-3);border:1px solid var(--line);color:var(--chalk);
    padding:12px 18px;border-radius:12px;font-size:14px;z-index:100;
    opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{border-color:rgba(232,93,76,.5);color:#FFB4A8;}

  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .login-card{width:100%;max-width:340px;text-align:center;}
  .login-card .mark{font-size:52px;margin-bottom:6px;}
  .login-card h1{font-size:26px;margin:0 0 4px;}
  .login-card p{color:var(--chalk-dim);font-size:14px;margin:0 0 22px;}

  .search-wrap{position:relative;margin-bottom:14px;}
  .search-wrap input{padding-left:38px;}
  .search-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--chalk-dim);}

  .overlay{
    position:fixed;inset:0;background:rgba(6,10,7,.7);backdrop-filter:blur(3px);
    z-index:50;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .sheet{
    width:100%;max-width:520px;background:var(--pitch-2);border:1px solid var(--line);
    border-radius:20px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:min(85vh, 85dvh);overflow-y:auto;-webkit-overflow-scrolling:touch;
    animation:pop .18s ease;
  }
  @media (min-width:900px){
    .sheet.ancho{max-width:1100px;}
    .finanzas-grid-morosos{grid-template-columns:repeat(3,1fr) !important;}
  }
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .sheet-head h2{margin:0;font-size:20px;}
  .sheet-close{background:none;border:none;color:var(--chalk-dim);font-size:22px;padding:4px 8px;}

  .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row span{font-size:15px;}
  .switch{position:relative;width:46px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .track{position:absolute;inset:0;background:var(--pitch-0);border:1px solid var(--line);border-radius:20px;transition:.2s;cursor:pointer;}
  .switch .track:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:2px;background:var(--chalk-dim);border-radius:50%;transition:.2s;}
  .switch input:checked + .track{background:rgba(255,210,63,.2);border-color:var(--gold);}
  .switch input:checked + .track:before{transform:translateX(20px);background:var(--gold);}

  .field-line{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:12px;}
  .field-line:last-child{border-bottom:none;}
  .field-line .fl-label{font-size:14px;color:var(--chalk-dim);}
  .field-line .fl-value{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--chalk);}
  .field-line button{flex-shrink:0;}

  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .stat-card{background:var(--pitch-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;}
  .stat-card .num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--gold);line-height:1.1;}
  .stat-card .lbl{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
  .bar-row{margin-bottom:12px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-row .bar-label{display:flex;justify-content:space-between;font-size:13px;color:var(--chalk-dim);margin-bottom:5px;}
  .bar-track{background:var(--pitch-0);border-radius:8px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;transition:width .3s;}
  .card.debt{border-color:rgba(232,93,76,.5);background:linear-gradient(180deg, rgba(232,93,76,.10), var(--pitch-2) 60%);}
  .badge.debt{background:rgba(232,93,76,.2);color:#FFB4A8;border:1px solid rgba(232,93,76,.5);}
  .alert-card{background:rgba(232,93,76,.12);border:1px solid rgba(232,93,76,.35);border-radius:var(--radius);padding:14px;margin-bottom:12px;color:#FFB4A8;font-size:14px;line-height:1.5;}

  .club-logo{display:block;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .login-card .club-logo{width:96px;height:96px;margin:0 auto 6px;}
  header.top .brand .club-logo{width:30px;height:30px;}
</style>
</head>

<script>
/* ============================================================
   SISTEMA DE TEMAS -- mismo sistema que la app del jugador.
   ============================================================ */
(function aplicarTemaGuardadoAlInicio(){
  const t = safeStorageGet('temaApp') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  if(t === 'club'){
    const colores = safeStorageGet('temaClubColores');
    if(colores){
      try {
        const c = JSON.parse(colores);
        document.documentElement.style.setProperty('--gold', c.principal);
        document.documentElement.style.setProperty('--green-ok', c.secundario);
      } catch(e){}
    }
  }
})();

function extraerColoresDelLogoAdmin(){
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const size = 64;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0,0,size,size).data;
        const buckets = {};
        for(let i=0;i<data.length;i+=4){
          const r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];
          if(a<200) continue;
          const max=Math.max(r,g,b), min=Math.min(r,g,b);
          const sat = max===0?0:(max-min)/max;
          const lum = (r+g+b)/3;
          if(sat<0.25 || lum>235 || lum<25) continue;
          const key = [Math.round(r/24)*24, Math.round(g/24)*24, Math.round(b/24)*24].join(',');
          buckets[key] = (buckets[key]||0)+1;
        }
        const ordenado = Object.entries(buckets).sort((a,b)=>b[1]-a[1]);
        if(ordenado.length===0){ resolve(null); return; }
        const [r,g,b] = ordenado[0][0].split(',').map(Number);
        let r2=r,g2=g,b2=b;
        for(const [k] of ordenado.slice(1)){
          const [rr,gg,bb] = k.split(',').map(Number);
          if(Math.abs(rr-r)+Math.abs(gg-g)+Math.abs(bb-b) > 60){ r2=rr;g2=gg;b2=bb; break; }
        }
        resolve({ principal: `rgb(${r},${g},${b})`, secundario: `rgb(${r2},${g2},${b2})` });
      } catch(e){ resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = '/api/logo';
  });
}

async function cambiarTemaAdmin(tema){
  document.documentElement.setAttribute('data-theme', tema);
  safeStorageSet('temaApp', tema);
  document.documentElement.style.removeProperty('--gold');
  document.documentElement.style.removeProperty('--green-ok');
  if(tema === 'club'){
    let colores = null;
    try { colores = JSON.parse(safeStorageGet('temaClubColores') || 'null'); } catch(e){}
    if(!colores){
      colores = await extraerColoresDelLogoAdmin();
      if(colores) safeStorageSet('temaClubColores', JSON.stringify(colores));
    }
    if(colores){
      document.documentElement.style.setProperty('--gold', colores.principal);
      document.documentElement.style.setProperty('--green-ok', colores.secundario);
    } else {
      toast('No se pudo leer el logo todavía, usa el tema oscuro o claro por ahora', true);
    }
  }
  cerrarSheet();
}

function abrirSelectorTemaAdmin(){
  const actual = safeStorageGet('temaApp') || 'dark';
  const html = `
    <div class="sheet-head"><h2>Estilo del panel</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <div class="field-line" style="cursor:pointer" onclick="cambiarTemaAdmin('dark')">
      <div><div class="fl-value">🌙 Oscuro</div><div class="fl-label">El de siempre</div></div>
      ${actual==='dark' ? '<span class="badge confirmando">Activo</span>' : ''}
    </div>
    <div class="field-line" style="cursor:pointer" onclick="cambiarTemaAdmin('light')">
      <div><div class="fl-value">☀️ Claro</div><div class="fl-label">Fondo blanco</div></div>
      ${actual==='light' ? '<span class="badge confirmando">Activo</span>' : ''}
    </div>
    <div class="field-line" style="cursor:pointer" onclick="cambiarTemaAdmin('club')">
      <div><div class="fl-value">🎨 Del club</div><div class="fl-label">Colores tomados del logo del club</div></div>
      ${actual==='club' ? '<span class="badge confirmando">Activo</span>' : ''}
    </div>
  `;
  abrirSheet(html);
}
</script>
<script>
const API_URL = '/api/admin';
function safeStorageGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function safeStorageSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
let CLAVE = safeStorageGet('clave_admin_app');
let currentTab = 'partidos';
let tiposCache = null;

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(()=>{ t.className='toast'; }, 2600);
}

async function api(accion, extra){
  const body = Object.assign({ clave: CLAVE, accion }, extra || {});
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!data.success){ toast(data.error || 'Error', true); return null; }
    return data.data !== undefined ? data.data : true;
  }catch(e){
    toast('No se pudo conectar. Revisa tu internet.', true);
    return null;
  }
}

function cambiarTab(tab){
  currentTab = tab;
  const TABS_EN_MAS = ['parametros','eventos','grupos'];
  document.querySelectorAll('nav.tabs button[data-tab]').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('btnTabMas').classList.toggle('active', TABS_EN_MAS.includes(tab));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('fabCrear').style.display = (tab==='partidos' || tab==='jugadores' || tab==='eventos') ? 'flex' : 'none';
  document.getElementById('fabCrear').onclick = tab==='jugadores' ? abrirCrearJugadorManual : (tab==='eventos' ? abrirCrearEvento : abrirCrearPartido);
  document.getElementById('fabCrear').title = tab==='jugadores' ? 'Agregar jugador' : (tab==='eventos' ? 'Crear evento' : 'Crear partido');
  const subs = {dashboard:'PANEL DE PAGOS', partidos:'PARTIDOS ACTIVOS', jugadores:'JUGADORES', parametros:'PARÁMETROS DEL CLUB', eventos:'EVENTOS', grupos:'GRUPOS Y ENTRENADORES'};
  document.getElementById('screenSub').textContent = subs[tab];
  if(tab==='dashboard') cargarDashboard();
  if(tab==='partidos') cargarPartidos();
  if(tab==='jugadores') cargarJugadores();
  if(tab==='parametros') cambiarSubtabParametros('generales');
  if(tab==='eventos') cargarEventos();
  if(tab==='grupos') cargarGrupos();
}

function fechaCorta(f){
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const d = new Date(f);
  return dias[d.getUTCDay()]+' '+String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();
}

async function guardarEstadisticasPartido(partidoId){
  const btn = document.getElementById('btnGuardarEstadisticas');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    const valoresEquipo = [...document.querySelectorAll('.est-equipo')].map(el => ({
      tipoEstadisticaId: parseInt(el.dataset.tipo), valor: parseFloat(el.value) || 0,
    }));
    const valoresJugador = [...document.querySelectorAll('.est-jugador')].map(el => ({
      tipoEstadisticaId: parseInt(el.dataset.tipo), jugadorId: parseInt(el.dataset.jugador), valor: parseFloat(el.value) || 0,
    }));

    let fotoEquipoBase64 = null, fotoPlanillaBase64 = null;
    const fileEquipo = document.getElementById('estFotoEquipo');
    if(fileEquipo.files && fileEquipo.files[0]){
      btn.textContent = 'Procesando foto del equipo...';
      fotoEquipoBase64 = await fileToBase64Admin(fileEquipo.files[0]);
    }
    const filePlanilla = document.getElementById('estFotoPlanilla');
    if(filePlanilla.files && filePlanilla.files[0]){
      btn.textContent = 'Procesando foto de la planilla...';
      fotoPlanillaBase64 = await fileToBase64Admin(filePlanilla.files[0]);
    }
    btn.textContent = 'Guardando...';

    const jugadorDestacadoVal = document.getElementById('estJugadorDestacado').value;
    const body = {
      partidoId,
      marcadorPropio: document.getElementById('estMarcadorPropio').value ? parseInt(document.getElementById('estMarcadorPropio').value) : null,
      marcadorRival: document.getElementById('estMarcadorRival').value ? parseInt(document.getElementById('estMarcadorRival').value) : null,
      rivalNombre: document.getElementById('estRivalNombre').value.trim(),
      notas: document.getElementById('estNotas').value.trim(),
      jugadorDestacadoId: jugadorDestacadoVal ? parseInt(jugadorDestacadoVal) : null,
      fotoEquipoBase64, fotoPlanillaBase64, valoresJugador, valoresEquipo,
    };
    const res = await api('guardar_estadisticas_partido_admin', body);
    if(res===null){ btn.disabled = false; btn.textContent = 'Guardar estadísticas'; return; }
    toast('Estadísticas guardadas');
    cerrarSheet();
  } catch(e) {
    toast('No se pudo guardar. Intenta de nuevo.', true);
    btn.disabled = false;
    btn.textContent = 'Guardar estadísticas';
  }
}

let pagoAdminState = { jugadorId: null, nombreJugador: '', pagoId: null, montoDisponible: 0 };

function fileToBase64Admin(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      // Las fotos directas de camara pueden pesar varios MB -- se
      // redimensionan y re-comprimen para que quepan comodamente en el
      // limite de tamaño de las funciones de Vercel.
      // Comprimido especificamente para comprobantes/recibos/facturas
      // (documentos de texto, no fotos generales) -- se puede bajar mas
      // el tamaño sin perder legibilidad de los montos y numeros.
      const maxDim = 1280;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.65).split(',')[1]);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function analizarComprobanteAdmin(){
  const input = document.getElementById('comprobanteAdminFile');
  if(!input.files || !input.files[0]){ toast('Primero elige una foto', true); return; }
  document.getElementById('comprobanteAdminLoading').style.display = 'block';
  let base64;
  try{ base64 = await fileToBase64Admin(input.files[0]); }
  catch(e){ toast('No se pudo leer la foto, intenta de nuevo', true); document.getElementById('comprobanteAdminLoading').style.display='none'; return; }
  const res = await api('analizar_comprobante_admin_app', { imagenBase64: base64 });
  document.getElementById('comprobanteAdminLoading').style.display = 'none';
  if(res===null) return;
  if(res.duplicado){
    toast('Este comprobante ya había sido usado antes', true);
    return;
  }
  mostrarConfirmarComprobanteAdmin(res);
}

async function confirmarYRegistrarPagoAdmin(){

  const d = await api('ver_pendientes_categorizado_app', { jugadorId: pagoAdminState.jugadorId });
  if(d===null) return;
  mostrarDistribucionAdmin(d);
}

function mostrarDistribucionAdmin(p){
  const filas = [];
  if(p.deuda_mensualidad > 0){
    const etiqueta = p.meses_atraso > 0 ? p.meses_atraso+' mes(es) atrasado(s)' : 'mes actual';
    filas.push({tipo:'mensualidad', label:'Mensualidad ('+etiqueta+')', monto:p.deuda_mensualidad});
  }
  if((p.invitados_pendientes||[]).length > 0){
    filas.push({tipo:'invitado', label:'🎟️ Invitados pendientes ('+p.invitados_pendientes.length+')', monto:p.total_invitados});
  }
  if((p.multas_propias||[]).length > 0){
    filas.push({tipo:'multas_propias', label:'⚠️ Multas propias ('+p.multas_propias.length+')', monto:p.total_multas_propias});
  }
  if((p.multas_invitados||[]).length > 0){
    filas.push({tipo:'multas_invitados', label:'⚠️ Multas por invitados ('+p.multas_invitados.length+')', monto:p.total_multas_invitados});
  }
  (p.partidos_especiales||[]).forEach(pe=>{
    filas.push({tipo:'partido_especial', label:'Partido especial: '+esc(pe.alias||''), monto:pe.monto, partidoId:pe.partido_id, conceptoMonto:pe.monto});
  });

  const html = `
    <div class="sheet-head"><h2>¿A qué lo aplicamos?</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <p style="color:var(--chalk-dim);font-size:13px;margin-top:-4px"><b>Paso 3 de 3.</b> Para: <b>${esc(pagoAdminState.nombreJugador)}</b></p>
    <div class="card" style="text-align:center">
      <div class="fl-label">DISPONIBLE PARA APLICAR</div>
      <div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--gold);font-weight:700">$${pagoAdminState.montoDisponible.toFixed(2)}</div>
    </div>
    <p style="color:var(--chalk-dim);font-size:14px;line-height:1.6">👉 Toca el concepto al que quieres aplicar este pago. Si sobra algo, te preguntamos qué hacer con el resto.</p>
    ${filas.length===0 ? '<div class="ok-card">✓ Este jugador no tiene deudas pendientes. El monto se guardará como saldo a favor.</div>' : filas.map((f)=>`
      <div class="field-line">
        <div>
          <div class="fl-value">${f.label}</div>
          <div class="fl-label">Debe: $${f.monto}</div>
        </div>
        <button class="sm primary" onclick='aplicarPagoConceptoAdmin(${JSON.stringify(f).replace(/'/g,"&#39;")})'>Aplicar aquí</button>
      </div>
    `).join('')}
    ${filas.length===0 ? `<button class="primary block" style="margin-top:12px" onclick="guardarComoSaldoFavorAdmin(${pagoAdminState.montoDisponible})">Guardar como saldo a favor</button>` : ''}
  `;
  abrirSheet(html);
}

async function aplicarPagoConceptoAdmin(f){
  const montoAAplicar = Math.min(pagoAdminState.montoDisponible, Number(f.monto));
  const sobranteFrontend = pagoAdminState.montoDisponible - montoAAplicar;
  const body = {
    jugadorId: pagoAdminState.jugadorId,
    pagoId: pagoAdminState.pagoId,
    monto: montoAAplicar,
    tipoConcepto: f.tipo,
    partidoId: f.partidoId,
    conceptoMonto: f.conceptoMonto,
  };
  const res = await api('aplicar_pago_comprobante_admin_app', body);
  if(res===null) return;
  res.restante = sobranteFrontend + Number(res.restante || 0);
  mostrarResultadoPagoAdmin(res);
}

function mostrarResultadoPagoAdmin(res){
  const restante = Number(res.restante || 0);
  let html = `
    <div class="sheet-head"><h2>Resultado</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <div class="ok-card">✓ ${esc(res.mensaje)}</div>
  `;
  if(restante > 0.009){
    html += `
      <p style="color:var(--chalk-dim);font-size:14px;line-height:1.6">Todavía quedan <b>$${restante.toFixed(2)}</b> de este pago sin usar. ¿Qué quieres hacer?</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
        <button class="block primary" onclick="continuarConRestanteAdmin(${restante})">Aplicarlo a otra deuda ahora</button>
        <button class="block" onclick="guardarComoSaldoFavorAdmin(${restante})">Guardarlo como saldo a favor</button>
      </div>
    `;
  } else {
    html += `
      <p style="color:var(--chalk-dim);font-size:14px;text-align:center;margin-top:8px">El pago quedó aplicado por completo.</p>
      <button class="primary block" style="margin-top:12px" onclick="cerrarSheet(); cargarJugadores();">Listo</button>
    `;
  }
  abrirSheet(html);
}

async function continuarConRestanteAdmin(restante){
  pagoAdminState.montoDisponible = restante;
  await abrirDistribuirPagoAdmin();
}

async function guardarComoSaldoFavorAdmin(restante){
  const res = await api('guardar_restante_saldo_favor_admin_app', { jugadorId: pagoAdminState.jugadorId, pagoId: pagoAdminState.pagoId, monto: restante });
  if(res===null) return;
  toast('Guardado como saldo a favor');
  cerrarSheet();
  cargarJugadores();
}

const FUNCIONALIDADES_PERMISOS = [
  {clave:'mi_cuenta', nombre:'Mi Cuenta', icono:'💳'},
  {clave:'partidos', nombre:'Partidos', icono:'⚽'},
];
const ROLES_PERMISOS = [
  {clave:'jugador', nombre:'Jugador', disponible:true},

  {clave:'entrenador', nombre:'Entrenador', disponible:false},

async function cargarPermisosPantallas(){
  const list = document.getElementById('parametrosList');
  list.innerHTML = '<div class="spinner"></div>';
  const data = await api('listar_permisos_pantallas_admin');
  if(data===null) return;
  const mapa = {};
  data.forEach(p => { mapa[p.funcionalidad+'|'+p.rol] = p.habilitado; });

  list.innerHTML = `
    <p style="color:var(--chalk-dim);font-size:13px;margin-top:0">Controla qué pantallas ve cada rol. "Entrenador" todavía no existe como app — aparece listo para cuando lo construyamos.</p>

      <div class="card">
        <div class="card-title"><h3>${f.icono} ${esc(f.nombre)}</h3></div>
        ${ROLES_PERMISOS.map(r=>{
          const habilitado = mapa[f.clave+'|'+r.clave] !== undefined ? mapa[f.clave+'|'+r.clave] : true;
          return `
            <label style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);${!r.disponible?'opacity:.5':''}">

              <input type="checkbox" ${habilitado?'checked':''} ${!r.disponible?'disabled':''} style="width:20px;height:20px" onchange="togglePermisoPantallaAccion('${f.clave}','${r.clave}', this.checked)">
            </label>
          `;
        }).join('')}
      </div>
    `).join('')}
  `;
}

async function togglePermisoPantallaAccion(funcionalidad, rol, habilitado){

  if(res===null){ cargarPermisosPantallas(); return; }
  toast('Actualizado');
}

async function cargarExentosPendientes(){
  const list = document.getElementById('parametrosList');
  list.innerHTML = '<div class="spinner"></div>';
  const pendientes = await api('listar_exentos_pendientes_app');
  if(pendientes===null) return;
  const aprobados = await api('listar_exentos_aprobados_app');
  if(aprobados===null) return;

  let html = '<h3 style="margin-bottom:10px">Pendientes de aprobar</h3>';
  html += pendientes.length===0 ? '<p style="color:var(--chalk-dim);font-size:14px">No hay solicitudes pendientes.</p>' : pendientes.map(e=>`
    <div class="card">
      <div class="card-title"><h3>${esc(e.nombres)} ${esc(e.apellidos)}</h3></div>

      <div class="row-actions">
        <button class="sm primary" onclick="revisarExento(${e.id}, true)">✓ Aprobar</button>
        <button class="sm danger" onclick="revisarExento(${e.id}, false)">✕ Rechazar</button>
      </div>
    </div>
  `).join('');

  html += '<h3 style="margin:20px 0 10px">Aprobados (puedes revocar)</h3>';
  html += aprobados.length===0 ? '<p style="color:var(--chalk-dim);font-size:14px">No hay exentos aprobados todavía.</p>' : aprobados.map(e=>`

      </div>
      <button class="sm danger" onclick="revocarExentoAdmin(${e.id})">Revocar</button>
    </div>
  `).join('');

  list.innerHTML = html;

async function revocarExentoAdmin(exentoId){
  if(!confirm('¿Revocar la exención de esta persona? Ya no podrá agregarse sin pagar en futuros partidos.')) return;

function procesarImagenParaLogo(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      // Mismo criterio que ya validamos con los iconos del jugador/admin:
      // lienzo cuadrado, fondo blanco, la imagen ocupa ~88% (deja el
      // margen minimo necesario para verse bien como icono "maskable"
      // en Android sin recortarse ni dejar bordes oscuros).
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      const factor = 0.88;
      const escala = Math.min(size*factor/img.width, size*factor/img.height);
      const w = img.width*escala, h = img.height*escala;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      const dataUrl = canvas.toDataURL('image/png');
      resolve(dataUrl.split(',')[1]); // solo el base64, sin el prefijo data:image/png;base64,
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function esInstaladaComoAppAdmin(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function esIOSAdmin(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

async function actualizarEstadoPushAdmin(){
  const textoEl = document.getElementById('adminPushEstadoTexto');
  const btnEl = document.getElementById('adminPushBtn');
  if(!textoEl) return;

  if(esIOSAdmin() && !esInstaladaComoAppAdmin()){
    textoEl.innerHTML = '📲 En iPhone, primero instala esta página a tu pantalla de inicio (Safari → Compartir → Agregar a inicio) para poder recibir notificaciones.';
    btnEl.style.display = 'none';
    return;
  }
  if(!('Notification' in window)){
    textoEl.textContent = 'Tu navegador no soporta notificaciones push.';
    btnEl.style.display = 'none';
    return;
  }
  if(Notification.permission === 'denied'){
    textoEl.textContent = '🚫 Bloqueaste las notificaciones. Actívalas desde la configuración del navegador para este sitio.';
    btnEl.style.display = 'none';
    return;
  }
  if(Notification.permission !== 'granted'){
    textoEl.textContent = 'Actívalas para enterarte al instante cuando un jugador haga un pago o registre un invitado exento por aprobar.';
    btnEl.style.display = 'block';
    btnEl.textContent = 'Activar notificaciones';
    return;
  }
  if(window.OneSignalDeferred){
    OneSignalDeferred.push(async function(OneSignal){
      let optedIn = false;
      try{ optedIn = OneSignal.User.PushSubscription.optedIn === true; }catch(e){}
      if(optedIn){
        textoEl.textContent = '✓ Las notificaciones están activadas.';
        btnEl.style.display = 'none';
      } else {
        textoEl.textContent = '⚠️ El navegador lo permite, pero falta completar la suscripción.';
        btnEl.style.display = 'block';
        btnEl.textContent = 'Reactivar notificaciones';
      }
    });
  }
}

async function activarNotificacionesAdmin(){
  if(typeof Notification === 'undefined'){ toast('Tu navegador no soporta notificaciones', true); return; }
  const permiso = await Notification.requestPermission();
  if(permiso === 'granted'){
    if(!window.OneSignalDeferred){ toast('No se pudo cargar el sistema', true); return; }
    OneSignalDeferred.push(async function(OneSignal){
      try{
        await OneSignal.User.addTag('es_admin', 'true');
        const yaSuscrito = OneSignal.User.PushSubscription.optedIn === true;
        if(!yaSuscrito){
          await OneSignal.User.PushSubscription.optIn();
        }
        toast('¡Notificaciones activadas!');
        actualizarEstadoPushAdmin();
      }catch(e){
        toast('Error: ' + (e.message || 'fallo interno'), true);
        actualizarEstadoPushAdmin();
      }
    });
  } else {
    toast('Permiso denegado por el navegador', true);
    actualizarEstadoPushAdmin();
  }
}

        ? `<span class="badge confirmando">Pagó</span>`

function renderCheckInList(partidoId, data){

  return data.map((item,i)=>`
    <div class="field-line">
      <div>

async function toggleAsistencia(partidoId, tipo, id){
  const item = checkInCache.data.find(x => x.tipo===tipo && x.id===id);
  const nuevoPresente = item ? !item.presente : true;
  const res = await api('toggle_asistencia_app', {partidoId, tipo, id, presente: nuevoPresente});
  if(res===null) return;
  const dataActualizada = await api('ver_checkin_partido', {partidoId});
  if(dataActualizada===null) return;
  checkInCache = { partidoId, data: dataActualizada };
  const cont = document.getElementById('listaCheckIn');
  if(cont) cont.innerHTML = renderCheckInList(partidoId, dataActualizada);
  toast(nuevoPresente ? 'Marcado presente' : 'Marcado ausente');
}

function renderMultasPorJugador(jugadores){

let eventoActualId = null;
let eventoActualFechas = [];
let eventoActualData = null;
let eventoSubtabActual = 'resumen';
let eventoMovFiltroFecha = '';
let eventoMovFiltroTipo = '';

function selectorFechas(idAttr, incluirTodas){
  let opts = incluirTodas ? '<option value="">Todas las fechas</option>' : '<option value="">General (sin fecha específica)</option>';
  opts += eventoActualFechas.map(f=>`<option value="${f.id}">${esc(f.descripcion || fechaCorta(f.fecha))} — ${fechaCorta(f.fecha)}</option>`).join('');
  return `<select id="${idAttr}">${opts}</select>`;
}

function nombreFecha(fechaId){
  if(!fechaId) return 'General';
  const f = eventoActualFechas.find(x=>x.id===fechaId);
  return f ? (f.descripcion || fechaCorta(f.fecha)) : 'General';
}

async function cargarEventos(){
  const list = document.getElementById('eventosList');
  list.innerHTML = '<div class="spinner"></div>';
  const data = await api('listar_eventos_app');
  if(data===null) return;
  if(data.length===0){
    list.innerHTML = '<div class="empty"><span class="ic">🎒</span>Todavía no hay eventos. Toca ＋ para crear el primero.</div>';
    return;
  }
  list.innerHTML = data.map(e=>`
    <div class="card">
      <div class="card-title">
        <h3>${esc(e.nombre)}</h3>
        <span class="badge ${e.estado==='activo' ? 'confirmando' : (e.estado==='finalizado' ? 'finalizado' : 'cancelado')}">${esc(e.estado)}</span>
      </div>
      <div class="meta">
        📍 ${esc(e.lugar||'—')} ${e.totalFechas>0 ? '· 📅 '+e.totalFechas+' fecha(s)' : ''}<br>
        📅 ${e.fecha_inicio ? fechaCorta(e.fecha_inicio) : '—'} ${e.fecha_fin ? '→ '+fechaCorta(e.fecha_fin) : ''}<br>
        💰 Ingresos: $${e.totalIngresos} · 💸 Gastos: $${e.totalGastos} · 📊 Proyectado: $${e.totalProyectado}
      </div>
      <div class="row-actions">
        <button class="sm primary" onclick="abrirDetalleEvento(${e.id})">Ver detalle</button>
      </div>
    </div>
  `).join('') + `<button class="block" style="margin-top:10px" onclick="verInformeConsolidadoEventos()">📊 Informe consolidado de todos los eventos</button>`;
}

function abrirCrearEvento(){

    <label>Nombre</label>
    <input id="evNombre" placeholder="Ej: Torneo Machala 2026">
    <label>Descripción</label>
    <input id="evDescripcion" placeholder="Opcional">

async function guardarNuevoEvento(){
  const nombre = document.getElementById('evNombre').value.trim();
  const descripcion = document.getElementById('evDescripcion').value.trim();
  const lugar = document.getElementById('evLugar').value.trim();
  const fechaInicio = document.getElementById('evFechaInicio').value;

// ============================================================
// DETALLE DE EVENTO -- ahora es su propio mini-modulo dentro de
// la pantalla de Eventos (no una hoja emergente gigante), con
// sub-pestanas propias para que cada seccion se mantenga manejable
// aunque haya muchos movimientos/jugadores/rubros.
// ============================================================

async function abrirDetalleEvento(eventoId){
  eventoActualId = eventoId;
  eventoSubtabActual = 'resumen';
  eventoMovFiltroFecha = '';
  eventoMovFiltroTipo = '';
  await recargarDetalleEvento();
}

async function recargarDetalleEvento(){
  const data = await api('ver_detalle_evento_app', {eventoId: eventoActualId});
  if(data===null) return;
  eventoActualFechas = data.fechas;
  eventoActualData = data;
  mostrarDetalleEvento();
}

function mostrarDetalleEvento(){
  const data = eventoActualData;
  const e = data.evento;
  const list = document.getElementById('eventosList');

  const subtabs = [
    {key:'resumen', label:'📊 Resumen'},
    {key:'fechas', label:'📅 Fechas'},
    {key:'presupuesto', label:'💰 Presupuesto'},
    {key:'cuotas', label:'👥 Cuotas'},
    {key:'movimientos', label:'🧾 Movimientos'},
  ];

  list.innerHTML = `
    <button class="sm" style="margin-bottom:10px" onclick="cargarEventos()">← Volver a eventos</button>
    <div class="card">
      <div class="card-title">
        <h3>${esc(e.nombre)}</h3>
        <span class="badge ${e.estado==='activo' ? 'confirmando' : (e.estado==='finalizado' ? 'finalizado' : 'cancelado')}">${esc(e.estado)}</span>
      </div>
      <div class="meta">📍 ${esc(e.lugar||'—')} ${e.fecha_inicio ? '· 📅 '+fechaCorta(e.fecha_inicio) : ''} ${e.fecha_fin ? '→ '+fechaCorta(e.fecha_fin) : ''}</div>
      <button class="sm" style="margin-top:8px" onclick='abrirEditarEvento(${e.id}, ${JSON.stringify(e).replace(/"/g,"&quot;")})'>Editar evento</button>
    </div>

    <div class="row-actions tabbar-scroll" id="eventoSubtabBar" style="margin:14px 0">
      ${subtabs.map(s=>`<button class="sm ${eventoSubtabActual===s.key?'primary':''}" onclick="cambiarSubtabEvento('${s.key}')">${s.label}</button>`).join('')}
    </div>

    <div id="eventoSubtabContent"></div>
  `;
  renderSubtabEventoActual();
}

function cambiarSubtabEvento(sub){
  eventoSubtabActual = sub;
  document.querySelectorAll('#eventoSubtabBar button').forEach((btn,i)=>{
    const keys = ['resumen','fechas','presupuesto','cuotas','movimientos'];
    btn.classList.toggle('primary', keys[i]===sub);
  });
  renderSubtabEventoActual();
}

function renderSubtabEventoActual(){
  const cont = document.getElementById('eventoSubtabContent');
  if(eventoSubtabActual==='resumen') cont.innerHTML = renderSubtabResumen();
  if(eventoSubtabActual==='fechas') cont.innerHTML = renderSubtabFechas();
  if(eventoSubtabActual==='presupuesto') cont.innerHTML = renderSubtabPresupuesto();
  if(eventoSubtabActual==='cuotas'){ cont.innerHTML = renderSubtabCuotas(); renderListaCuotasFiltrada(); }
  if(eventoSubtabActual==='movimientos') renderSubtabMovimientos();
}

function renderSubtabResumen(){
  const data = eventoActualData;
  const ingresos = data.movimientos.filter(m=>m.tipo==='ingreso').reduce((s,m)=>s+Number(m.monto),0);
  const gastos = data.movimientos.filter(m=>m.tipo==='gasto').reduce((s,m)=>s+Number(m.monto),0);
  const totalCuotas = data.cuotas.reduce((s,c)=>s+Number(c.montoCuota),0);
  const totalCuotasPagado = data.cuotas.reduce((s,c)=>s+Number(c.montoPagado),0);
  const totalProyectado = data.presupuesto.reduce((s,p)=>s+Number(p.montoProyectado),0);
  const totalRealPresupuesto = data.presupuesto.reduce((s,p)=>s+Number(p.montoReal),0);
  const proximasFechas = [...data.fechas].filter(f=>new Date(f.fecha) >= new Date(new Date().toDateString())).slice(0,3);

  return `
    <div class="card">
      <div class="card-title"><h3>Balance general</h3></div>
      <div class="field-line"><div class="fl-label">Ingresos totales</div><div class="fl-value" style="color:var(--green-ok)">+$${ingresos.toFixed(2)}</div></div>
      <div class="field-line"><div class="fl-label">Gastos totales</div><div class="fl-value" style="color:var(--red)">-$${gastos.toFixed(2)}</div></div>
      <div class="field-line"><div class="fl-label">Saldo neto</div><div class="fl-value" style="color:var(--gold)">$${(ingresos-gastos).toFixed(2)}</div></div>
    </div>
    <div class="card">
      <div class="card-title"><h3>Cuotas de jugadores</h3></div>
      <div class="field-line"><div class="fl-label">Jugadores inscritos</div><div class="fl-value">${data.cuotas.length}</div></div>
      <div class="field-line"><div class="fl-label">Total esperado</div><div class="fl-value">$${totalCuotas.toFixed(2)}</div></div>
      <div class="field-line"><div class="fl-label">Total pagado</div><div class="fl-value" style="color:var(--green-ok)">$${totalCuotasPagado.toFixed(2)}</div></div>
      <div class="field-line"><div class="fl-label">Pendiente</div><div class="fl-value" style="color:var(--red)">$${(totalCuotas-totalCuotasPagado).toFixed(2)}</div></div>
    </div>
    <div class="card">
      <div class="card-title"><h3>Presupuesto</h3></div>
      <div class="field-line"><div class="fl-label">Proyectado</div><div class="fl-value">$${totalProyectado.toFixed(2)}</div></div>
      <div class="field-line"><div class="fl-label">Real (gastado)</div><div class="fl-value">$${totalRealPresupuesto.toFixed(2)}</div></div>
    </div>
    ${proximasFechas.length>0 ? `
    <div class="card">
      <div class="card-title"><h3>Próximas fechas</h3></div>
      ${proximasFechas.map(f=>`<div class="field-line"><div class="fl-value">${esc(f.descripcion || fechaCorta(f.fecha))}</div><div class="fl-label">${fechaCorta(f.fecha)} · 📍 ${esc(f.lugar||'—')}</div></div>`).join('')}
    </div>` : ''}
  `;
}

function renderSubtabFechas(){
  const data = eventoActualData;
  return `
    <div class="card">
      ${data.fechas.length===0 ? '<p style="color:var(--chalk-dim);font-size:13px">Este evento tiene una sola sede/fecha (usa "General" en presupuesto, cuotas y movimientos). Agrega fechas solo si necesitas separar gastos o cuotas por cada una.</p>' : data.fechas.map(f=>`
        <div class="field-line">
          <div>
            <div class="fl-value">${esc(f.descripcion || fechaCorta(f.fecha))}</div>
            <div class="fl-label">${fechaCorta(f.fecha)} · 📍 ${esc(f.lugar||'—')}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="sm" onclick='abrirEditarEventoFecha(${JSON.stringify(f).replace(/"/g,"&quot;")})'>Editar</button>
            <button class="sm danger" onclick="eliminarEventoFecha(${f.id})">✕</button>
          </div>
        </div>

async function guardarMovimientoEvento(){
  const tipoMovimientoId = parseInt(document.getElementById('movTipoId').value);
  const eventoFechaIdVal = document.getElementById('movFechaId').value;
  const eventoFechaId = eventoFechaIdVal ? parseInt(eventoFechaIdVal) : null;
  const monto = parseFloat(document.getElementById('movMonto').value);
  const fecha = document.getElementById('movFecha').value;
  const jugadorIdVal = document.getElementById('movJugadorId').value;
  const jugadorId = jugadorIdVal ? parseInt(jugadorIdVal) : null;
  const descripcion = document.getElementById('movDescripcion').value.trim();
  if(!monto){ toast('Escribe un monto válido', true); return; }

  const btn = document.getElementById('btnGuardarMovimiento');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    let comprobanteBase64 = null;
    const fileInput = document.getElementById('movComprobanteFile');
    if(fileInput.files && fileInput.files[0]){
      btn.textContent = 'Procesando foto...';
      comprobanteBase64 = await fileToBase64Admin(fileInput.files[0]);
      btn.textContent = 'Guardando...';
    }

    const res = await api('registrar_movimiento_evento_app', {eventoId: eventoActualId, eventoFechaId, tipoMovimientoId, monto, fecha, jugadorId, descripcion, comprobanteBase64});
    if(res===null){ btn.disabled = false; btn.textContent = 'Guardar'; return; }
    toast('Movimiento registrado');
    cerrarSheet();
    await recargarDetalleEvento();

async function guardarEditarMovimiento(movimientoId){
  const tipoMovimientoId = parseInt(document.getElementById('movEditTipoId').value);
  const eventoFechaIdVal = document.getElementById('movEditFechaId').value;
  const eventoFechaId = eventoFechaIdVal ? parseInt(eventoFechaIdVal) : null;
  const monto = parseFloat(document.getElementById('movEditMonto').value);
  const fecha = document.getElementById('movEditFecha').value;
  const jugadorIdVal = document.getElementById('movEditJugadorId').value;
  const jugadorId = jugadorIdVal ? parseInt(jugadorIdVal) : null;
  const descripcion = document.getElementById('movEditDescripcion').value.trim();
  if(!monto){ toast('Escribe un monto válido', true); return; }

  const btn = document.getElementById('btnGuardarEditarMovimiento');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    let comprobanteBase64 = null;
    const fileInput = document.getElementById('movEditComprobanteFile');
    if(fileInput.files && fileInput.files[0]){
      btn.textContent = 'Procesando foto...';
      comprobanteBase64 = await fileToBase64Admin(fileInput.files[0]);
      btn.textContent = 'Guardando...';
    }

    const res = await api('editar_movimiento_evento_app', {movimientoId, eventoFechaId, tipoMovimientoId, monto, fecha, jugadorId, descripcion, comprobanteBase64});
    if(res===null){ btn.disabled = false; btn.textContent = 'Guardar cambios'; return; }
    toast('Movimiento actualizado');
    cerrarSheet();
    await recargarDetalleEvento();
  } catch(e) {
    toast('No se pudo guardar (error al procesar la foto o al conectar). Intenta de nuevo.', true);
    btn.disabled = false;
    btn.textContent = 'Guardar cambios';
  }
}

    <div class="sheet-head"><h2>Asignar entrenador</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <select id="grupoAsignarEntrenadorId">
      ${entrenadores.map(e=>`<option value="${e.id}">${esc(e.nombres)} ${esc(e.apellidos)} (${e.rol})</option>`).join('')}
    </select>
    <button class="primary block" style="margin-top:16px" onclick="guardarAsignarEntrenadorGrupo()">Asignar</button>
  `;
  abrirSheet(html);
}

async function guardarAsignarEntrenadorGrupo(){
  const entrenadorId = parseInt(document.getElementById('grupoAsignarEntrenadorId').value);
  const res = await api('asignar_entrenador_grupo_admin', {entrenadorId, grupoId: grupoDetalleActual.id});
  if(res===null) return;
  toast('Entrenador asignado');
  abrirDetalleGrupo(grupoDetalleActual.id, grupoDetalleActual.nombre);
}

async function quitarEntrenadorDeGrupo(entrenadorId){
  const res = await api('quitar_entrenador_grupo_admin', {entrenadorId, grupoId: grupoDetalleActual.id});
  if(res===null) return;
  toast('Entrenador quitado del grupo');
  abrirDetalleGrupo(grupoDetalleActual.id, grupoDetalleActual.nombre);
}

/* ---------- Entrenadores ---------- */
async function cargarListaEntrenadores(){
  const cont = document.getElementById('grupoSubtabContent');
  cont.innerHTML = '<div class="spinner"></div>';
  const data = await api('listar_entrenadores_admin');
  if(data===null) return;
  cont.innerHTML = `
    ${data.length===0 ? '<div class="empty"><span class="ic">🧑‍🏫</span>Sin entrenadores todavía.</div>' : data.map(e=>`
      <div class="card">
        <div class="card-title">
          <h3>${esc(e.nombres)} ${esc(e.apellidos)}</h3>
          <span class="badge ${e.activo?'confirmando':'cancelado'}">${e.rol}</span>
        </div>
        <div class="meta">${esc(e.cedula)} · ${esc(e.telefono||'Sin teléfono')}<br>Grupos: ${esc(e.gruposNombres||'Ninguno')} ${!e.tieneClave ? '<span class="badge cancelado">Sin activar</span>' : ''}</div>
        <div class="row-actions" style="margin-top:8px">
          <button class="sm" onclick='abrirEditarEntrenador(${JSON.stringify(e).replace(/"/g,"&quot;")})'>Editar</button>
          <button class="sm" onclick="resetearClaveEntrenadorAccion(${e.id}, ${JSON.stringify(e.nombres).replace(/"/g,'&quot;')})">🔒 Resetear clave</button>

}

function abrirCrearEntrenador(){

    <label>Nombres</label>
    <input id="entNombres" placeholder="Nombres">
    <label>Apellidos</label>
    <input id="entApellidos" placeholder="Apellidos">
    <label>Cédula</label>
    <input id="entCedula" placeholder="Obligatoria" inputmode="numeric">
    <label>Teléfono</label>
    <input id="entTelefono" placeholder="Opcional" type="tel">
    <label>Rol</label>

      <option value="entrenador">Entrenador (ve solo sus grupos)</option>

async function guardarCrearEntrenador(){
  const nombres = document.getElementById('entNombres').value.trim();
  const apellidos = document.getElementById('entApellidos').value.trim();
  const cedula = document.getElementById('entCedula').value.trim();
  const telefono = document.getElementById('entTelefono').value.trim();
  const rol = document.getElementById('entRol').value;
  if(!nombres || !apellidos){ toast('Completa nombres y apellidos', true); return; }

  if(res===null) return;

function abrirEditarEntrenador(e){
  const html = `
    <div class="sheet-head"><h2>Editar entrenador</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <label>Nombres</label>
    <input id="entEditNombres" value="${esc(e.nombres)}">
    <label>Apellidos</label>
    <input id="entEditApellidos" value="${esc(e.apellidos)}">

    <label>Rol</label>

async function guardarEditarEntrenador(entrenadorId){
  const nombres = document.getElementById('entEditNombres').value.trim();
  const apellidos = document.getElementById('entEditApellidos').value.trim();
  const cedula = document.getElementById('entEditCedula').value.trim();

  toast('Entrenador actualizado');
  cerrarSheet();
  cargarListaEntrenadores();
}

async function toggleEntrenadorAccion(entrenadorId, activo){
  const res = await api('toggle_entrenador_admin', {entrenadorId, activo});
  if(res===null) return;
  cargarListaEntrenadores();
}

async function resetearClaveEntrenadorAccion(entrenadorId, nombres){
  if(!confirm('¿Generar una clave temporal nueva para '+nombres+'?')) return;
  const res = await api('resetear_clave_entrenador_admin', {entrenadorId});
  if(res===null) return;
  const telefonoLimpio = (res.telefono || '').replace(/\D/g,'');
  const linkWhatsapp = telefonoLimpio ? `https://wa.me/${telefonoLimpio}?text=${encodeURIComponent(res.mensajeWhatsapp)}` : null;
  const html = `
    <div class="sheet-head"><h2>Clave temporal generada</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <div class="card" style="text-align:center">
      <div class="fl-label">CLAVE TEMPORAL (válida 24 horas, un solo uso)</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:36px;color:var(--gold);font-weight:700;letter-spacing:4px;margin:8px 0">${res.claveTemporal}</div>
    </div>
    ${linkWhatsapp ? `<button class="primary block" onclick="window.open('${linkWhatsapp}','_blank')">📤 Enviar por WhatsApp</button>` : '<p class="meta">No tiene teléfono registrado — comparte la clave manualmente.</p>'}
  `;
  abrirSheet(html);
}

async function descargarInformePagos(){
  const data = await api('listar_informe_completo_app');
  if(data===null) return;
  const ahora = new Date().toLocaleString('es-EC');
  let csv = `Informe generado el,${ahora}\n\n`;
  csv += 'Nombre,Telefono,Total pagado historico,Pagado este mes,Meses de atraso,Deuda mensualidad,Deuda invitados,Deuda multas propias,Deuda multas invitados,Deuda partidos especiales,Deuda total,Saldo a favor,Saldo,Moroso\n';
  let totHist=0, totMes=0, totMensualidad=0, totInvitados=0, totMultasP=0, totMultasI=0, totPartidos=0, totDeuda=0, totSaldoFavor=0, totSaldo=0;
  data.forEach(j => {
    csv += `"${j.nombre}","${j.telefono}",${j.totalPagadoHistorico},${j.pagadoEsteMes},${j.mesesAtraso},${j.deudaMensualidad},${j.deudaInvitados},${j.deudaMultasPropias},${j.deudaMultasInvitados},${j.deudaPartidosEspeciales},${j.deudaTotal},${j.saldoAFavor},${j.saldo},${j.moroso ? 'SI' : 'NO'}\n`;
    totHist += Number(j.totalPagadoHistorico); totMes += Number(j.pagadoEsteMes);
    totMensualidad += Number(j.deudaMensualidad); totInvitados += Number(j.deudaInvitados);
    totMultasP += Number(j.deudaMultasPropias); totMultasI += Number(j.deudaMultasInvitados);
    totPartidos += Number(j.deudaPartidosEspeciales); totDeuda += Number(j.deudaTotal);
    totSaldoFavor += Number(j.saldoAFavor); totSaldo += Number(j.saldo);
  });
  csv += `\nTOTALES,,${totHist.toFixed(2)},${totMes.toFixed(2)},,${totMensualidad.toFixed(2)},${totInvitados.toFixed(2)},${totMultasP.toFixed(2)},${totMultasI.toFixed(2)},${totPartidos.toFixed(2)},${totDeuda.toFixed(2)},${totSaldoFavor.toFixed(2)},${totSaldo.toFixed(2)},\n`;
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'informe_pagos_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Informe descargado');
}

/* ---------- DEUDA DEL JUGADOR ---------- */
let deudaCache = { jugadorId: null, pendientes: [] };

async function abrirDeudaJugador(jugadorId, nombre){
  const d = await api('ver_pendientes_categorizado_app', {jugadorId});
  if(d===null) return;
  deudaCache = { jugadorId, nombre };
  const html = `
    <div class="sheet-head"><h2>Deuda de ${esc(nombre)}</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <p style="color:var(--chalk-dim);font-size:13px">Cada concepto se paga por separado. Los invitados y multas se cubren desde el más antiguo.</p>
    <div id="listaDeudaCategorizada">${renderDeudaCategorizada(d)}</div>
  `;
  abrirSheet(html);
}

function renderDeudaCategorizada(d){
  const filas = [];
  if(d.deuda_mensualidad > 0){
    const etiqueta = d.meses_atraso > 0 ? d.meses_atraso+' mes(es)' : 'mes actual';
    filas.push({tipo:'mensualidad', label:'Mensualidad ('+etiqueta+')', monto:d.deuda_mensualidad, partidoId:null, conceptoMonto:null});
  }
  if((d.invitados_pendientes||[]).length > 0){
    filas.push({tipo:'invitado', label:'🎟️ Invitados pendientes ('+d.invitados_pendientes.length+')', monto:d.total_invitados, partidoId:null, conceptoMonto:null});
  }
  if((d.multas_propias||[]).length > 0){
    filas.push({tipo:'multas_propias', label:'⚠️ Multas propias ('+d.multas_propias.length+')', monto:d.total_multas_propias, partidoId:null, conceptoMonto:null});
  }
  if((d.multas_invitados||[]).length > 0){
    filas.push({tipo:'multas_invitados', label:'⚠️ Multas por invitados ('+d.multas_invitados.length+')', monto:d.total_multas_invitados, partidoId:null, conceptoMonto:null});
  }
  (d.partidos_especiales||[]).forEach(pe=>{
    filas.push({tipo:'partido_especial', label:'Partido especial: '+esc(pe.alias), monto:pe.monto, partidoId:pe.partido_id, conceptoMonto:pe.monto});
  });
  if(filas.length===0) return '<div class="alert-card" style="background:rgba(111,207,151,.12);border-color:rgba(111,207,151,.35);color:var(--green-ok)">✓ Sin deuda pendiente.</div>';
  return filas.map((f,i)=>`
    <div class="field-line">
      <div>
        <div class="fl-value">${f.label}</div>
        <div class="fl-label">$${f.monto}</div>
      </div>
      <button class="sm" onclick='registrarPagoCategorizado(${JSON.stringify(f).replace(/'/g,"&#39;")})'>💵 Registrar pago</button>
    </div>
  `).join('');
}

async function registrarPagoCategorizado(f){
  const montoStr = prompt('¿Cuánto se pagó en efectivo para "' + f.label + '"?', f.monto);
  if(montoStr===null) return;
  const monto = parseFloat(montoStr);
  if(!monto || monto<=0){ toast('Monto inválido', true); return; }
  const res = await api('registrar_pago_categorizado_app', {jugadorId: deudaCache.jugadorId, tipoConcepto: f.tipo, monto, partidoId: f.partidoId, conceptoMonto: f.conceptoMonto});
  if(res===null) return;
  toast(res.mensaje || 'Pago registrado');
  const d = await api('ver_pendientes_categorizado_app', {jugadorId: deudaCache.jugadorId});
  if(d===null) return;
  const cont = document.getElementById('listaDeudaCategorizada');
  if(cont) cont.innerHTML = renderDeudaCategorizada(d);
  cargarJugadores();
}
