<script>
/* ---------- PARTIDOS (solo lectura, con QR) ---------- */
async function cargarPantallaPartidosRep(cont){
  if(!MIS_JUGADORES_CARGADOS){ await cargarJugadoresRepApp(); }
  if(!JUGADOR_ACTUAL){ cont.innerHTML = '<div class="empty">Todavía no tienes ningún jugador vinculado.</div>'; return; }
  cont.innerHTML = '<div class="spinner"></div>';
  const partidos = await apiRep('ver_partidos_jugador_representante');
  if(partidos===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }
  if(partidos.length===0){
    cont.innerHTML = '<div class="empty"><span class="ic">' + window._iconoDeporteActual + '</span>No hay partidos activos por ahora.</div>';
    return;
  }
  cont.innerHTML = partidos.map(p=>`
    <div class="card">
      <div class="card-title">
        <h3>${p.disciplinaIcono ? esc(p.disciplinaIcono)+' ' : ''}${p.alias ? esc(p.alias) : 'Partido'}</h3>
        ${p.eventoNombre ? '<span style="color:var(--chalk-dim);font-size:12px;font-weight:600">🎒 '+esc(p.eventoNombre)+'</span>' : ''}
        <span class="badge ${p.estado==='finalizado' ? 'finalizado' : p.miEstado}">${p.estado==='finalizado' ? 'Finalizado' : (p.miEstado==='confirmado' ? 'Va' : (p.miEstado==='cancelado' ? 'No va' : 'Sin confirmar'))}</span>
      </div>
      <div class="meta">
        📅 <b>${fechaCorta(p.fecha)}</b> &nbsp; 🕐 <b>${p.hora ? p.hora.slice(0,5) : ''}</b><br>
        📍 ${esc(p.lugar||'')}${p.cantidadInvitados>0 ? ' · 🎟️ '+p.cantidadInvitados+' invitado(s)' : ''}
        ${p.profesores ? '<br>🧑‍🏫 '+esc(p.profesores) : ''}
      </div>
      <div class="row-actions">
        ${p.estado==='finalizado' ? '' : (p.miEstado==='confirmado' ? `
          <button class="sm primary" onclick="verQrRep(${p.id})">📲 Ver código QR</button>
          <button class="sm danger" onclick="cancelarPartidoRep(${p.id})">No va</button>
        ` : `
          <button class="sm primary" onclick="confirmarPartidoRep(${p.id})">✅ Va</button>
        `)}
        ${p.tieneEstadisticas ? `<button class="sm primary" onclick="verEstadisticasPartidoRep(${p.id})">📊 Ver estadísticas</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function confirmarPartidoRep(partidoId){
  const res = await apiRep('confirmar_partido_representante', { partidoId });
  if(res===null) return;
  toast('¡Confirmado!');
  cambiarPantalla('partidos_representante');
}

async function cancelarPartidoRep(partidoId){
  if(!confirm('¿Confirmar que no va a este partido?')) return;
  const res = await apiRep('cancelar_partido_representante', { partidoId });
  if(res===null) return;
  toast('Actualizado');
  cambiarPantalla('partidos_representante');
}

async function verEstadisticasPartidoRep(partidoId){
  const data = await apiRep('ver_detalle_partido_stats_representante', {partidoId});
  if(data===null) return;
  mostrarEstadisticasPartidoJugador(data, 'representante');
}

async function verFotoPartidoRep(partidoId, tipo){
  const res = await apiRep('ver_foto_partido_representante', {partidoId, tipo});
  if(res===null) return;
  if(!res.foto){ toast('No hay foto', true); return; }
  const html = `
    <div class="sheet-head"><h2>${tipo==='planilla'?'Planilla de control':'Foto del equipo'}</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <img src="data:image/jpeg;base64,${res.foto}" style="width:100%;border-radius:12px">
  `;
  abrirSheet(html);
}

async function verQrRep(partidoId){
  const res = await apiRep('ver_qr_jugador_representante', { partidoId });
  if(res===null) return;
  if(!res.token){ toast('Aún no tiene código para este partido', true); return; }
  const url = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=20&ecc=M&data=' + encodeURIComponent('ASISTIO-'+res.token);
  const html = `
    <div class="sheet-head"><h2>Código QR</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <div class="qr-box"><img src="${url}" alt="Código QR"></div>
    <p style="color:var(--chalk-dim);font-size:13px;text-align:center">Se muestra en la entrada de la cancha. Válido solo para este partido.</p>
  `;
  abrirSheet(html);
}

/* ---------- MI CUENTA (deuda + pago) ---------- */
let pagoStateRep = {};

async function cargarPantallaCuentaRep(cont){
  if(!MIS_JUGADORES_CARGADOS){ await cargarJugadoresRepApp(); }
  if(!JUGADOR_ACTUAL){ cont.innerHTML = '<div class="empty">Todavía no tienes ningún jugador vinculado.</div>'; return; }
  cont.innerHTML = '<div class="spinner"></div>';
  const d = await apiRep('ver_deuda_jugador_representante');
  if(d===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }
  const p = d.pendientes || {};
  let html = '';

  if(d.saldoAFavor > 0){
    html += `
      <div class="card" style="border-color:rgba(255,210,63,.5);background:linear-gradient(180deg, rgba(255,210,63,.10), var(--pitch-2) 60%)">
        <div class="fl-label">💰 SALDO A FAVOR</div>
        <div style="font-family:'Oswald',sans-serif;font-size:28px;color:var(--gold);font-weight:700;margin:4px 0">$${Number(d.saldoAFavor).toFixed(2)}</div>
        <button class="primary block sm" onclick="abrirUsarSaldoFavorRep()">Usar el saldo a favor</button>
      </div>
    `;
  }

  html += renderTarjetaMensualidad(p.meses_atraso, p.deuda_mensualidad);
  if((p.multas_propias||[]).length>0){
    html += `<div class="alert-card">⚠️ ${p.multas_propias.length} multa(s) propia(s) — $${p.total_multas_propias}</div>`;
  }
  if((p.multas_invitados||[]).length>0){
    html += `<div class="alert-card">⚠️ ${p.multas_invitados.length} multa(s) por invitados — $${p.total_multas_invitados}</div>`;
  }
  if((p.invitados_pendientes||[]).length>0){
    html += `<div class="card"><div class="card-title"><h3>🎟️ Invitados sin pagar</h3></div><p class="meta">${p.invitados_pendientes.length} invitado(s) — $${p.total_invitados}</p></div>`;
  }
  if((p.eventos_pendientes||[]).length>0){
    html += `<div class="alert-card">🎒 ${p.eventos_pendientes.length} cuota(s) de evento pendiente(s): ${p.eventos_pendientes.map(e=>esc(e.eventoNombre)+' ($'+e.pendiente.toFixed(2)+')').join(', ')}</div>`;
  }

  html += `
    <div class="card">
      <p style="color:var(--chalk-dim);font-size:14px;line-height:1.6;margin:0 0 12px">
        📸 <b>¿Ya hiciste una transferencia al club?</b><br>
        Sube el comprobante y elige a qué deuda de ${esc(JUGADOR_ACTUAL.nombres)} aplicarlo.
      </p>
      <button class="primary block" onclick="abrirSubirComprobanteRep()">📤 Subir comprobante de pago</button>
    </div>
    <button class="block" onclick="verMisUltimosPagosRep()">🧾 Ver últimos pagos</button>
  `;
  cont.innerHTML = html;
}

async function verMisUltimosPagosRep(){
  const pagos = await apiRep('ver_pagos_jugador_representante');
  if(pagos===null) return;
  const html = `
    <div class="sheet-head"><h2>Últimos pagos</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <p style="color:var(--chalk-dim);font-size:13px;margin-top:-4px">Incluye pagos generales del club y cuotas de eventos.</p>
    ${pagos.length===0 ? '<p style="color:var(--chalk-dim)">Aún no hay pagos registrados.</p>' : pagos.map(p=>`
      <div class="field-line">
        <div><div class="fl-value">${esc(p.motivo||'Pago')}</div><div class="fl-label">${p.fecha ? fechaCorta(p.fecha) : ''}</div></div>
        <div class="fl-value">$${p.monto}</div>
      </div>
    `).join('')}
  `;
  abrirSheet(html);
}

function abrirSubirComprobanteRep(){
  const html = `
    <div class="sheet-head"><h2>Subir comprobante</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <p style="color:var(--chalk-dim);font-size:14px;line-height:1.6"><b>Paso 1 de 3.</b> Toma o elige una foto clara del comprobante de ${esc(JUGADOR_ACTUAL.nombres)}.</p>
    <label>Foto del comprobante</label>
    <input type="file" id="comprobanteFileRep" accept="image/*">
    <button class="primary block" style="margin-top:16px" onclick="analizarComprobanteRep()">Analizar comprobante</button>
    <div id="comprobanteLoadingRep" style="display:none;text-align:center;margin-top:16px">
      <div class="spinner"></div>
      <p style="color:var(--chalk-dim);font-size:13px">Leyendo el comprobante...</p>
    </div>
  `;
  abrirSheet(html);
}

async function analizarComprobanteRep(){
  const input = document.getElementById('comprobanteFileRep');
  if(!input.files || !input.files[0]){ toast('Primero elige o toma una foto', true); return; }
  document.getElementById('comprobanteLoadingRep').style.display = 'block';
  let base64;
  try{ base64 = await fileToBase64(input.files[0]); }
  catch(e){ toast('No se pudo leer la foto, intenta de nuevo', true); document.getElementById('comprobanteLoadingRep').style.display='none'; return; }
  const res = await apiRep('analizar_comprobante_representante', { imagenBase64: base64 });
  document.getElementById('comprobanteLoadingRep').style.display = 'none';
  if(res===null) return;
  if(res.duplicado){ toast('Este comprobante ya había sido usado antes', true); return; }
  mostrarConfirmarComprobanteRep(res);
}

function mostrarConfirmarComprobanteRep(datos){
  const aviso = !datos.esComprobante ? `<div class="alert-card">⚠️ No pudimos leer esta foto como comprobante válido. Vuelve atrás y sube una más clara.</div>` : '';
  const html = `
    <div class="sheet-head"><h2>Confirma los datos</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    ${aviso}
    <p style="color:var(--chalk-dim);font-size:14px;line-height:1.6"><b>Paso 2 de 3.</b> Esto leímos automáticamente.</p>
    <label>Monto pagado</label>
    <input id="confMontoRep" type="number" step="0.01" value="${datos.monto || ''}" readonly style="opacity:.75">
    <label>Banco</label>
    <input id="confBancoRep" value="${esc(datos.banco || '')}" readonly style="opacity:.75">
    <label>Número de comprobante</label>
    <input id="confNumeroRep" value="${esc(datos.numeroComprobante || '')}" readonly style="opacity:.75">
    <label>Fecha de la transferencia</label>
    <input id="confFechaRep" value="${esc(datos.fechaComprobante || '')}" readonly style="opacity:.75">
    <button class="primary block" style="margin-top:18px" onclick="confirmarYRegistrarPagoRep()">Confirmar y continuar</button>
    <button class="block" style="margin-top:8px" onclick="abrirSubirComprobanteRep()">📸 Tomar otra foto</button>
  `;
  abrirSheet(html);
}

async function confirmarYRegistrarPagoRep(){
  const monto = parseFloat(document.getElementById('confMontoRep').value);
  const banco = document.getElementById('confBancoRep').value.trim();
  const numeroComprobante = document.getElementById('confNumeroRep').value.trim();
  const fecha = document.getElementById('confFechaRep').value.trim();
  if(!monto || monto<=0){ toast('Monto inválido', true); return; }
  if(!numeroComprobante){ toast('Falta el número de comprobante', true); return; }
  if(!fecha){ toast('Falta la fecha', true); return; }
  const res = await apiRep('registrar_pago_comprobante_representante', { monto, banco, numeroComprobante, fecha });
  if(res===null) return;
  pagoStateRep = { pagoId: res.pagoId, montoDisponible: Number(res.monto), origenSaldoFavor: false };
  await abrirDistribuirPagoRep();
}

async function abrirUsarSaldoFavorRep(){
  const d = await apiRep('ver_deuda_jugador_representante');
  if(d===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }
  if(!d.saldoAFavor || d.saldoAFavor<=0){ toast('No hay saldo a favor disponible', true); return; }
  pagoStateRep = { pagoId: null, montoDisponible: Number(d.saldoAFavor), origenSaldoFavor: true };
  mostrarDistribucionRep(d.pendientes);
}

async function abrirDistribuirPagoRep(){
  const d = await apiRep('ver_deuda_jugador_representante');
  if(d===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }
  mostrarDistribucionRep(d.pendientes);
}

function mostrarDistribucionRep(p){
  const filas = [];
  if(p.deuda_mensualidad > 0){
    const etiqueta = p.meses_atraso > 0 ? p.meses_atraso+' mes(es) atrasado(s)' : 'mes actual';
    filas.push({tipo:'mensualidad', label:'Mensualidad ('+etiqueta+')', monto:p.deuda_mensualidad});
  }
  if((p.invitados_pendientes||[]).length > 0){
    filas.push({tipo:'invitado', label:'🎟️ Invitados pendientes ('+p.invitados_pendientes.length+')', monto:p.total_invitados});
  }
  if((p.multas_propias||[]).length > 0){
    filas.push({tipo:'multas_propias', label:'⚠️ Multas propias ('+p.multas_propias.length+')', monto:p.total_multas_propias});
  }
  if((p.multas_invitados||[]).length > 0){
    filas.push({tipo:'multas_invitados', label:'⚠️ Multas por invitados ('+p.multas_invitados.length+')', monto:p.total_multas_invitados});
  }
  (p.partidos_especiales||[]).forEach(pe=>{
    filas.push({tipo:'partido_especial', label:'Partido especial: '+esc(pe.alias||''), monto:pe.monto, partidoId:pe.partido_id, conceptoMonto:pe.monto});
  });
  // Cuotas de eventos pendientes -- se muestran junto a lo demas, pero se
  // aplican por separado (tabla independiente), guardando de que evento es.
  (p.eventos_pendientes||[]).forEach(ev=>{
    filas.push({tipo:'evento_cuota', label:'🎒 Cuota evento: '+esc(ev.eventoNombre), monto:ev.pendiente, eventoId:ev.eventoId});
  });

  const html = `
    <div class="sheet-head"><h2>¿A qué lo aplicamos?</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <p style="color:var(--chalk-dim);font-size:13px;margin-top:-4px"><b>Paso 3 de 3.</b></p>
    <div class="card" style="text-align:center">
      <div class="fl-label">DISPONIBLE PARA APLICAR</div>
      <div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--gold);font-weight:700">$${pagoStateRep.montoDisponible.toFixed(2)}</div>
    </div>
    ${filas.length===0 ? '<div class="ok-card">✓ No hay deudas pendientes. Este monto se guardará como saldo a favor.</div>' : filas.map((f)=>`
      <div class="field-line">
        <div><div class="fl-value">${f.label}</div><div class="fl-label">Debe: $${f.monto}</div></div>
        <button class="sm primary" onclick='aplicarPagoConceptoRep(${JSON.stringify(f).replace(/'/g,"&#39;")})'>Aplicar aquí</button>
      </div>
    `).join('')}
    ${filas.length===0 ? `<button class="primary block" style="margin-top:12px" onclick="guardarComoSaldoFavorRep(${pagoStateRep.montoDisponible})">Guardar como saldo a favor</button>` : ''}
  `;
  abrirSheet(html);
}

async function aplicarPagoConceptoRep(f){
  const montoAAplicar = Math.min(pagoStateRep.montoDisponible, Number(f.monto));
  const sobrante = pagoStateRep.montoDisponible - montoAAplicar;
  let res;
  if(f.tipo === 'evento_cuota'){
    res = await apiRep('aplicar_pago_evento_representante', { pagoId: pagoStateRep.pagoId, monto: montoAAplicar, eventoId: f.eventoId });
  } else {
    res = await apiRep('aplicar_pago_representante', {
      tipoConcepto: f.tipo, monto: montoAAplicar, origenSaldoFavor: pagoStateRep.origenSaldoFavor,
      pagoId: pagoStateRep.pagoId, partidoId: f.partidoId, conceptoMonto: f.conceptoMonto,
    });
  }
  if(res===null) return;
  if(res.pagoId) pagoStateRep.pagoId = res.pagoId;
  pagoStateRep.origenSaldoFavor = false;
  res.restante = sobrante + Number(res.restante || 0);
  if(!res.mensaje) res.mensaje = 'Pago aplicado a la cuota del evento.';
  mostrarResultadoPagoRep(res);
}

function mostrarResultadoPagoRep(res){
  const restante = Number(res.restante || 0);
  let html = `
    <div class="sheet-head"><h2>Resultado</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <div class="ok-card">✓ ${esc(res.mensaje)}</div>
  `;
  if(restante > 0.009){
    html += `
      <p style="color:var(--chalk-dim);font-size:14px;line-height:1.6">Quedan <b>$${restante.toFixed(2)}</b> sin usar. ¿Qué hacemos con eso?</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
        <button class="block primary" onclick="continuarConRestanteRep(${restante})">Aplicarlo a otra deuda</button>
        <button class="block" onclick="guardarComoSaldoFavorRep(${restante})">Guardarlo como saldo a favor</button>
      </div>
    `;
  } else {
    html += `<button class="primary block" style="margin-top:8px" onclick="cerrarSheet(); cambiarPantalla('cuenta_representante');">Listo</button>`;
  }
  abrirSheet(html);
}

async function continuarConRestanteRep(restante){
  pagoStateRep.montoDisponible = restante;
  await abrirDistribuirPagoRep();
}

async function guardarComoSaldoFavorRep(restante){
  const res = await apiRep('guardar_saldo_favor_representante', { pagoId: pagoStateRep.pagoId, monto: restante });
  if(res===null) return;
  toast('Guardado como saldo a favor');
  cerrarSheet();
  cambiarPantalla('cuenta_representante');
}
</script>
<script>
/* ---------- EVENTOS ---------- */
let eventoRepActualId = null;
let eventoRepActualData = null;
let eventoRepSubtabActual = 'resumen';

async function cargarPantallaEventosRep(cont){
  if(!MIS_JUGADORES_CARGADOS){ await cargarJugadoresRepApp(); }
  if(!JUGADOR_ACTUAL){ cont.innerHTML = '<div class="empty">Todavía no tienes ningún jugador vinculado.</div>'; return; }
  cont.innerHTML = '<div class="spinner"></div>';
  const data = await apiRep('listar_eventos_jugador_representante');
  if(data===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }
  if(data.length===0){
    cont.innerHTML = '<div class="empty"><span class="ic">🎒</span>Sin eventos por ahora.</div>';
    return;
  }
  cont.innerHTML = data.map(e=>`
    <div class="card">
      <div class="card-title">
        <h3>${esc(e.nombre)}</h3>
        <span class="badge ${e.estado==='activo' ? 'confirmando' : (e.estado==='finalizado' ? 'finalizado' : 'cancelado')}">${esc(e.estado)}</span>
      </div>
      <div class="meta">📍 ${esc(e.lugar||'—')}<br>Cuota: $${e.montoCuota} · Pagado: $${e.montoPagado} ${Number(e.montoPagado)>=Number(e.montoCuota) ? '✓' : ''}</div>
      <button class="sm primary" onclick="abrirDetalleEventoRep(${e.id})">Ver detalle</button>
    </div>
  `).join('');
}

async function abrirDetalleEventoRep(eventoId){
  eventoRepActualId = eventoId;
  eventoRepSubtabActual = 'resumen';
  const data = await apiRep('ver_evento_publico_representante', {eventoId});
  if(data===null) return;
  eventoRepActualData = data;
  mostrarDetalleEventoRep();
}

function mostrarDetalleEventoRep(){
  const d = eventoRepActualData;
  const e = d.evento;
  const cont = document.getElementById('pantallasContainer');
  const subtabs = [{key:'resumen',label:'📊 Resumen'},{key:'fechas',label:'📅 Fechas'},{key:'estadisticas',label:'🏆 Estadísticas'},{key:'movimientos',label:'🧾 Movimientos'}];
  cont.innerHTML = `
    <button class="sm" style="margin-bottom:10px" onclick="cambiarPantalla('eventos_representante')">← Volver</button>
    <div class="card">
      <div class="card-title"><h3>${esc(e.nombre)}</h3><span class="badge ${e.estado==='activo'?'confirmando':(e.estado==='finalizado'?'finalizado':'cancelado')}">${esc(e.estado)}</span></div>
      <div class="meta">📍 ${esc(e.lugar||'—')}</div>
    </div>
    <div class="row-actions tabbar-scroll" id="eventoRepSubtabBar" style="margin:14px 0">
      ${subtabs.map(s=>`<button class="sm ${eventoRepSubtabActual===s.key?'primary':''}" onclick="cambiarSubtabEventoRep('${s.key}')">${s.label}</button>`).join('')}
    </div>
    <div id="eventoRepSubtabContent"></div>
  `;
  renderSubtabEventoRepActual();
}

function cambiarSubtabEventoRep(sub){
  eventoRepSubtabActual = sub;
  const keys = ['resumen','fechas','estadisticas','movimientos'];
  document.querySelectorAll('#eventoRepSubtabBar button').forEach((b,i)=>b.classList.toggle('primary', keys[i]===sub));
  renderSubtabEventoRepActual();
}

function renderSubtabEventoRepActual(){
  if(eventoRepSubtabActual==='resumen') document.getElementById('eventoRepSubtabContent').innerHTML = renderResumenEventoRep();
  if(eventoRepSubtabActual==='fechas') document.getElementById('eventoRepSubtabContent').innerHTML = renderFechasEventoRep();
  if(eventoRepSubtabActual==='estadisticas') document.getElementById('eventoRepSubtabContent').innerHTML = renderEstadisticasEventoRep();
  if(eventoRepSubtabActual==='movimientos') cargarMovimientosEventoRep();
}

function renderPartidoEventoLineaRep(p){
  return `
    <div class="field-line" style="cursor:pointer" onclick="verEstadisticasPartidoRep(${p.id})">
      <div>
        <div class="fl-value">${esc(p.alias || 'Partido')} ${p.estado==='finalizado' ? '<span class="badge finalizado">Finalizado</span>' : ''}</div>
        <div class="fl-label">${fechaCorta(p.fecha)} ${p.hora ? '· '+p.hora.slice(0,5) : ''} · 📍 ${esc(p.lugar||'—')}</div>
      </div>
      ${p.tieneEstadisticas ? '<span style="font-size:18px">📊</span>' : ''}
    </div>
  `;
}

function renderFechasEventoRep(){
  const fechas = eventoRepActualData.fechas;
  const partidos = eventoRepActualData.partidos || [];
  const generales = partidos.filter(p=>!p.eventoFechaId);
  let html = '';
  if(fechas.length===0){
    html += '<p style="color:var(--chalk-dim);font-size:13px">Este evento es de una sola fecha/sede.</p>';
  } else {
    html += fechas.map(f=>{
      const partidosDeFecha = partidos.filter(p=>p.eventoFechaId===f.id).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
      return `
        <div class="card">
          <div class="fl-value">${esc(f.descripcion || fechaCorta(f.fecha))}</div>
          <div class="fl-label" style="margin-bottom:8px">${fechaCorta(f.fecha)} · 📍 ${esc(f.lugar||'—')}</div>
          ${partidosDeFecha.length===0 ? '<p style="color:var(--chalk-dim);font-size:12px">Sin partidos vinculados.</p>' : partidosDeFecha.map(renderPartidoEventoLineaRep).join('')}
        </div>
      `;
    }).join('');
  }
  if(generales.length>0){
    html += `<div class="card"><div class="fl-value" style="margin-bottom:8px">Partidos generales del evento</div>${generales.map(renderPartidoEventoLineaRep).join('')}</div>`;
  }
  return html || '<p style="color:var(--chalk-dim);font-size:13px">Sin partidos vinculados a este evento todavía.</p>';
}

function renderEstadisticasEventoRep(){
  const d = eventoRepActualData;
  const stats = d.estadisticasEvento || [];
  const partidosConfirmados = stats.length>0 ? stats[0].partidosConfirmados : 0;
  if(stats.length===0){
    return '<p style="color:var(--chalk-dim);font-size:13px">Todavía no hay estadísticas disponibles para este evento.</p>';
  }
  return `
    <p style="color:var(--chalk-dim);font-size:13px;margin-top:0">Basado en ${partidosConfirmados} partido(s) confirmado(s) por ${esc(JUGADOR_ACTUAL.nombres)} dentro de este evento.</p>
    <div class="card">
      <div class="card-title"><h3>Totales en el evento</h3></div>
      ${stats.map(s=>`
        <div class="field-line">
          <div class="fl-label">${esc(s.nombre)}</div>
          <div class="fl-value">${s.total} <span style="color:var(--chalk-dim);font-size:12px">(prom. ${Number(s.promedio).toFixed(2)}/partido)</span></div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderResumenEventoRep(){
  const d = eventoRepActualData;
  const pendiente = d.miCuota!==null ? Math.max(d.miCuota - d.miPagado, 0) : null;
  const totalGastos = (d.gastosPorRubro||[]).reduce((s,g)=>s+Number(g.gastado),0);
  return `
    <div class="card">
      <div class="card-title"><h3>Cuota de ${esc(JUGADOR_ACTUAL.nombres)}</h3></div>
      ${d.miCuota===null ? '<p style="color:var(--chalk-dim);font-size:13px">Sin cuota asignada en este evento.</p>' : `
        <div class="field-line"><div class="fl-label">Cuota</div><div class="fl-value">$${d.miCuota.toFixed(2)}</div></div>
        <div class="field-line"><div class="fl-label">Pagado</div><div class="fl-value" style="color:var(--green-ok)">$${d.miPagado.toFixed(2)}</div></div>
        <div class="field-line"><div class="fl-label">Pendiente</div><div class="fl-value" style="color:${pendiente>0?'var(--red)':'var(--green-ok)'}">$${pendiente.toFixed(2)} ${pendiente===0?'✓':''}</div></div>
        <button class="sm" style="margin-top:8px" onclick="abrirDetalleCuotaRep()">Ver detalle de mis aportes</button>
        ${pendiente>0 ? `<button class="primary block" style="margin-top:8px" onclick="abrirPagarCuotaEventoRep()">📤 Pagar cuota del evento</button>` : ''}
      `}
    </div>
    <div class="card">
      <div class="card-title"><h3>Financiero general</h3></div>
      <div class="field-line"><div class="fl-label">Recaudado</div><div class="fl-value" style="color:var(--green-ok)">$${d.totalRecaudado.toFixed(2)}</div></div>
      <div class="field-line"><div class="fl-label">Esperado</div><div class="fl-value">$${d.totalEsperadoCuotas.toFixed(2)}</div></div>
      <div class="field-line"><div class="fl-label">Gastado</div><div class="fl-value" style="color:var(--red)">$${totalGastos.toFixed(2)}</div></div>
      <button class="sm" style="margin-top:8px" onclick="abrirDetalleFinancieroRep()">Ver detalle agrupado</button>
    </div>
  `;
}

async function abrirDetalleCuotaRep(){
  const movs = await apiRep('ver_movimientos_evento_representante', {eventoId: eventoRepActualId});
  if(movs===null) return;
  const aportes = movs.filter(m => m.jugadorId === JUGADOR_ACTUAL.id && m.tipo==='ingreso');
  const html = `
    <div class="sheet-head"><h2>Aportes de ${esc(JUGADOR_ACTUAL.nombres)}</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    ${aportes.length===0 ? '<p style="color:var(--chalk-dim);font-size:14px">Sin aportes registrados todavía.</p>' : aportes.map(m=>`
      <div class="field-line">
        <div><div class="fl-value">$${m.monto}</div><div class="fl-label">${fechaCorta(m.fecha)} ${m.descripcion ? '· '+esc(m.descripcion) : ''}</div></div>
        ${m.tieneComprobante ? `<button class="sm" onclick="verComprobanteMovimientoRep(${m.id})">📷</button>` : ''}
      </div>
    `).join('')}
  `;
  abrirSheet(html);
}

async function abrirDetalleFinancieroRep(){
  const movs = await apiRep('ver_movimientos_evento_representante', {eventoId: eventoRepActualId});
  if(movs===null) return;
  const grupos = {ingreso: {}, gasto: {}};
  movs.forEach(m => {
    if(!grupos[m.tipo][m.tipoMovimiento]) grupos[m.tipo][m.tipoMovimiento] = 0;
    grupos[m.tipo][m.tipoMovimiento] += Number(m.monto);
  });
  function renderGrupo(titulo, obj, color){
    const rubros = Object.entries(obj);
    const total = rubros.reduce((s,[,v])=>s+v,0);
    return `
      <div class="card">
        <div class="card-title"><h3>${titulo}</h3><span class="fl-value" style="color:${color}">$${total.toFixed(2)}</span></div>
        ${rubros.length===0 ? '<p style="color:var(--chalk-dim);font-size:13px">Sin movimientos.</p>' : rubros.map(([rubro,monto])=>`
          <div class="field-line"><div class="fl-label">${esc(rubro)}</div><div class="fl-value">$${monto.toFixed(2)}</div></div>
        `).join('')}
      </div>
    `;
  }
  const html = `
    <div class="sheet-head"><h2>Detalle financiero</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    ${renderGrupo('💰 Ingresos por rubro', grupos.ingreso, 'var(--green-ok)')}
    ${renderGrupo('💸 Egresos por rubro', grupos.gasto, 'var(--red)')}
  `;
  abrirSheet(html);
}

let movimientosRepCache = [];
let movFiltroSoloMios = false;
let movFiltroDesde = '';
let movFiltroHasta = '';

async function cargarMovimientosEventoRep(){
  const cont = document.getElementById('eventoRepSubtabContent');
  cont.innerHTML = '<div class="spinner"></div>';
  const movs = await apiRep('ver_movimientos_evento_representante', {eventoId: eventoRepActualId});
  if(movs===null) return;
  movimientosRepCache = movs;
  cont.innerHTML = `
    <div class="row-actions" style="margin-bottom:10px;flex-wrap:wrap">
      <input type="date" id="movRepDesde" style="flex:1;min-width:130px" onchange="aplicarFiltroMovRep()">
      <input type="date" id="movRepHasta" style="flex:1;min-width:130px" onchange="aplicarFiltroMovRep()">
    </div>
    <label style="display:flex;align-items:center;gap:8px;flex-direction:row;font-size:13px;color:var(--chalk-dim);margin-bottom:10px;text-transform:none">
      <input type="checkbox" id="movRepSoloMios" style="width:18px;height:18px" onchange="aplicarFiltroMovRep()">
      Ver solo los movimientos de ${esc(JUGADOR_ACTUAL.nombres)}
    </label>
    <div id="listaMovRepFiltrada"></div>
    <button class="block" style="margin-top:10px" onclick="descargarCsvMovimientosRep()">⬇️ Descargar CSV de este filtro</button>
  `;
  renderListaMovRepFiltrada();
}

function aplicarFiltroMovRep(){
  movFiltroSoloMios = document.getElementById('movRepSoloMios').checked;
  movFiltroDesde = document.getElementById('movRepDesde').value;
  movFiltroHasta = document.getElementById('movRepHasta').value;
  renderListaMovRepFiltrada();
}

function movimientosRepFiltrados(){
  return movimientosRepCache.filter(m => {
    if(movFiltroSoloMios && m.jugadorId !== JUGADOR_ACTUAL.id) return false;
    if(movFiltroDesde && m.fecha < movFiltroDesde) return false;
    if(movFiltroHasta && m.fecha > movFiltroHasta) return false;
    return true;
  });
}

function renderListaMovRepFiltrada(){
  const movs = movimientosRepFiltrados();
  const el = document.getElementById('listaMovRepFiltrada');
  if(movs.length===0){ el.innerHTML = '<p style="color:var(--chalk-dim);font-size:14px">Sin movimientos con este filtro.</p>'; return; }
  el.innerHTML = movs.map(m=>`
    <div class="field-line">
      <div><div class="fl-value">${esc(m.tipoMovimiento)} ${m.jugador ? '— '+esc(m.jugador) : ''}</div><div class="fl-label">${fechaCorta(m.fecha)} ${m.descripcion ? '· '+esc(m.descripcion) : ''}</div></div>
      <div style="display:flex;gap:6px;align-items:center">
        <div class="fl-value" style="color:${m.tipo==='ingreso' ? 'var(--green-ok)' : 'var(--red)'}">${m.tipo==='ingreso'?'+':'-'}$${m.monto}</div>
        ${m.tieneComprobante ? `<button class="sm" onclick="verComprobanteMovimientoRep(${m.id})">📷</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function verComprobanteMovimientoRep(movimientoId){
  const res = await apiRep('ver_comprobante_movimiento_representante', {movimientoId});
  if(res===null) return;
  if(!res.comprobante_base64){ toast('No hay foto para este movimiento', true); return; }
  const html = `
    <div class="sheet-head"><h2>Comprobante</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <img src="data:image/jpeg;base64,${res.comprobante_base64}" style="width:100%;border-radius:12px">
  `;
  abrirSheet(html);
}

function descargarCsvMovimientosRep(){
  const movs = movimientosRepFiltrados();
  if(movs.length===0){ toast('No hay movimientos para descargar con este filtro', true); return; }
  const filas = [['fecha','tipo de rubro','nombre del rubro','valor','descripcion']];
  movs.forEach(m => filas.push([m.fecha, m.tipo, m.tipoMovimiento, m.monto, m.descripcion||'']));
  const csv = filas.map(f => f.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'movimientos_' + (eventoRepActualData.evento.nombre||'evento').replace(/[^a-z0-9]+/gi,'_') + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function abrirPagarCuotaEventoRep(){
  const html = `
    <div class="sheet-head"><h2>Pagar cuota del evento</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <label>Foto del comprobante</label>
    <input type="file" id="comprobanteEventoFileRep" accept="image/*">
    <button class="primary block" style="margin-top:16px" onclick="analizarComprobanteEventoRep()">Analizar comprobante</button>
    <div id="comprobanteEventoLoadingRep" style="display:none;text-align:center;margin-top:16px"><div class="spinner"></div></div>
  `;
  abrirSheet(html);
}

async function analizarComprobanteEventoRep(){
  const input = document.getElementById('comprobanteEventoFileRep');
  if(!input.files || !input.files[0]){ toast('Elige o toma una foto', true); return; }
  document.getElementById('comprobanteEventoLoadingRep').style.display = 'block';
  let base64;
  try{ base64 = await fileToBase64(input.files[0]); }
  catch(e){ toast('No se pudo leer la foto', true); return; }
  const res = await apiRep('analizar_comprobante_representante', { imagenBase64: base64 });
  document.getElementById('comprobanteEventoLoadingRep').style.display = 'none';
  if(res===null) return;
  if(res.duplicado){ toast('Ese comprobante ya fue usado', true); return; }
  const html = `
    <div class="sheet-head"><h2>Confirma el monto</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <label>Monto pagado</label>
    <input id="confMontoEventoRep" type="number" step="0.01" value="${res.monto||''}" readonly style="opacity:.75">
    <label>Número de comprobante</label>
    <input id="confNumeroEventoRep" value="${esc(res.numeroComprobante||'')}" readonly style="opacity:.75">
    <label>Fecha</label>
    <input id="confFechaEventoRep" value="${esc(res.fechaComprobante||'')}" readonly style="opacity:.75">
    <label>Banco</label>
    <input id="confBancoEventoRep" value="${esc(res.banco||'')}" readonly style="opacity:.75">
    <button class="primary block" style="margin-top:16px" onclick="confirmarPagoEventoRep()">Aplicar a la cuota del evento</button>
  `;
  abrirSheet(html);
}

async function confirmarPagoEventoRep(){
  const monto = parseFloat(document.getElementById('confMontoEventoRep').value);
  const banco = document.getElementById('confBancoEventoRep').value.trim();
  const numeroComprobante = document.getElementById('confNumeroEventoRep').value.trim();
  const fecha = document.getElementById('confFechaEventoRep').value.trim();
  if(!monto || monto<=0){ toast('Monto inválido', true); return; }
  const reg = await apiRep('registrar_pago_comprobante_representante', { monto, banco, numeroComprobante, fecha });
  if(reg===null) return;
  const res = await apiRep('aplicar_pago_evento_representante', { pagoId: reg.pagoId, monto: reg.monto, eventoId: eventoRepActualId });
  if(res===null) return;
  toast(res.mensaje || 'Pago aplicado');
  cerrarSheet();
  abrirDetalleEventoRep(eventoRepActualId);
}

/* ---------- PERFIL (propio + del jugador representado) ---------- */
async function cargarPantallaNovedadesRep(cont){
  if(!MIS_JUGADORES_CARGADOS){ await cargarJugadoresRepApp(); }
  if(!JUGADOR_ACTUAL){ cont.innerHTML = '<div class="empty">Todavía no tienes ningún jugador vinculado.</div>'; return; }
  cont.innerHTML = '<div class="spinner"></div>';
  const data = await apiRep('listar_novedades_visibles_jugador_representante');
  if(data===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }
  const ICONOS_TIPO = {lesion:'🩹', comportamiento:'⚠️', progreso:'⭐', otro:'📋'};
  if(data.length===0){
    cont.innerHTML = '<div class="empty"><span class="ic">🔔</span>Sin novedades nuevas de '+esc(JUGADOR_ACTUAL.nombres)+'.</div>';
    return;
  }

function fechaHoraRep(f){
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const d = new Date(f);
  const hora = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return dias[d.getDay()]+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()+' · '+hora;
}

/* ---------- Historial de torneos + indicador de aporte (entrenador) ---------- */
function renderGaugeAporte(pct, nivel){
  const colores = { normal: '#f5c518', promedio: '#3b82c4', gran_aporte: '#2e9e5b' };
  const etiquetas = { normal: 'Normal', promedio: 'Promedio', gran_aporte: 'Gran aporte' };
  const color = colores[nivel] || colores.normal;
  const r = 40, cx = 50, cy = 50;
  const arcLen = Math.PI * r;
  const relleno = (Math.max(0, Math.min(100, pct)) / 100) * arcLen;
  return `
    <svg viewBox="0 0 100 62" style="width:110px;height:auto">
      <line x1="50" y1="4" x2="50" y2="12" stroke="var(--chalk-dim)" stroke-width="2"/>
      <path d="M 10,50 A ${r},${r} 0 0 1 90,50" fill="none" stroke="var(--pitch-3)" stroke-width="9" stroke-linecap="round"/>
      <path d="M 10,50 A ${r},${r} 0 0 1 90,50" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${relleno.toFixed(1)} ${arcLen.toFixed(1)}"/>
      <text x="50" y="46" text-anchor="middle" font-size="18" font-weight="700" fill="var(--chalk)">${pct}%</text>
    </svg>
    <div style="text-align:center;font-size:11px;color:${color};font-weight:600">${etiquetas[nivel] || ''}</div>
  `;
}

function renderTarjetaTorneo(t, conGauge){
  return `
    <div class="card">
      <div class="card-title"><h3>${esc(t.nombre)}</h3></div>
      <div class="meta">${t.fecha ? fechaCorta(t.fecha) : ''}</div>
      ${conGauge ? `
        <div style="display:flex;align-items:center;gap:14px;margin:8px 0">
          ${renderGaugeAporte(t.aportePct, t.nivel)}
          <div style="font-size:12px;color:var(--chalk-dim)">Tu aporte: ${t.miAporte} pts<br>Promedio del equipo: ${t.promedioEquipo} pts</div>
        </div>
      ` : ''}
      ${t.stats.length===0 ? '<p style="color:var(--chalk-dim);font-size:13px">Sin estadísticas registradas en este torneo.</p>' : `
        <div style="color:var(--chalk-dim);font-size:13px">${t.stats.map(s=>esc(s.nombre)+': '+s.total).join(' · ')}</div>
      `}
    </div>
  `;
}

  const idsRepresentados = new Set((typeof MIS_JUGADORES !== 'undefined' ? MIS_JUGADORES : []).map(j=>j.id));

  window._statsPartidoGrupos = grupos;
  window._statsPartidoNombresPorId = nombresPorId;
  window._statsPartidoIdsRepresentados = idsRepresentados;

  const mostrarSoloRepresentados = contexto==='representante';
  const accionFoto = contexto==='representante' ? 'verFotoPartidoRep' : 'verFotoPartidoJugadorAccion';
  const html = `
    <div class="sheet-head"><h2>${p.disciplinaIcono ? esc(p.disciplinaIcono)+' ' : ''}${esc(p.alias || 'Partido')}</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>

          Nosotros ${p.marcador_propio} — ${p.marcador_rival} ${esc(p.rival_nombre||'Rival')}
        </div>
      </div>
    ` : ''}
    ${p.jugadorDestacado ? `<div class="ok-card">⭐ Jugador destacado: ${esc(p.jugadorDestacado)}</div>` : ''}
    ${(p.tieneFotoEquipo || p.tieneFotoPlanilla) ? `
      <div class="row-actions" style="margin-bottom:12px">
        ${p.tieneFotoEquipo ? `<button class="sm" onclick="${accionFoto}(${p.id}, 'equipo')">📷 Foto del equipo</button>` : ''}
        ${p.tieneFotoPlanilla ? `<button class="sm" onclick="${accionFoto}(${p.id}, 'planilla')">📋 Planilla de control</button>` : ''}
      </div>
    ` : ''}
    ${equipoStats.length>0 ? `
      <div class="card">
        <div class="card-title"><h3>Estadísticas del equipo</h3></div>
        ${equipoStats.map(v=>`<div class="field-line"><div class="fl-label">${esc(v.nombre)}</div><div class="fl-value">${v.valor}</div></div>`).join('')}
      </div>
    ` : ''}
    ${mostrarSoloRepresentados ? `
      <label style="display:flex;align-items:center;gap:8px;flex-direction:row;font-size:13px;color:var(--chalk-dim);text-transform:none;margin-bottom:8px">
        <input type="checkbox" id="chkSoloRepresentados" checked onchange="rerenderStatsPorJugador()" style="width:18px;height:18px">
        Solo de representados
      </label>
    ` : ''}
    <div id="statsPorJugadorCard">${renderStatsPorJugadorHtml(mostrarSoloRepresentados)}</div>
    ${p.notas ? `<div class="card"><div class="card-title"><h3>Notas</h3></div><p style="font-size:14px;color:var(--chalk-dim);white-space:pre-wrap">${esc(p.notas)}</p></div>` : ''}

  `;
  abrirSheet(html);
}

function renderStatsPorJugadorHtml(soloRepresentados){
  const grupos = window._statsPartidoGrupos || {};
  const nombresPorId = window._statsPartidoNombresPorId || {};
  const idsRepresentados = window._statsPartidoIdsRepresentados || new Set();

  let entradas = Object.entries(grupos).filter(([k])=>k!=='__equipo__');
  if(soloRepresentados){
    entradas = entradas.filter(([jugadorId]) => idsRepresentados.has(parseInt(jugadorId)));
  }

  if(entradas.length===0){
    return soloRepresentados
      ? '<p style="color:var(--chalk-dim);font-size:13px">Ninguno de tus representados tiene estadísticas en este partido. Desmarca el filtro para ver a todos.</p>'
      : '';
  }

  return `
    <div class="card">
      <div class="card-title"><h3>Estadísticas por jugador</h3></div>
      ${entradas.map(([jugadorId, stats])=>`
        <div style="padding:8px 0;border-bottom:1px solid var(--line)">
          <div class="fl-value" style="margin-bottom:4px">${esc(nombresPorId[jugadorId]||'—')}</div>
          <div style="color:var(--chalk-dim);font-size:13px">${stats.map(s=>esc(s.nombre)+': '+s.valor).join(' · ')}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function mostrarQR(token, nombreContexto){
  const numeroCheckin = (PERFIL && PERFIL.whatsappCheckinNumero) || '';
  const waLink = `https://wa.me/${numeroCheckin}?text=ASISTIO-` + token;
  const url = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=20&ecc=M&data=' + encodeURIComponent(waLink);
  const html = `
    <div class="sheet-head"><h2>${nombreContexto ? esc(nombreContexto) : 'Tu código QR'}</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <div class="qr-box"><img id="qrImgActual" src="${url}" alt="Código QR"></div>
    <p style="color:var(--chalk-dim);font-size:13px;text-align:center">Muéstralo en la entrada de la cancha. Es válido solo para este partido y se usa una vez.</p>
    <button class="primary block" style="margin-top:12px" onclick='compartirQR(${JSON.stringify(url)}, ${JSON.stringify(waLink)}, ${JSON.stringify(nombreContexto||'')})'>📤 Compartir</button>
  `;
  abrirSheet(html);
}

async function compartirQR(imgUrl, waLink, nombreContexto){
  try{
    if(navigator.share){
      try{
        const resp = await fetch(imgUrl);
        const blob = await resp.blob();
        const file = new File([blob], 'codigo-qr.png', { type: blob.type || 'image/png' });
        if(navigator.canShare && navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file], title: 'Mi código QR', text: nombreContexto ? ('Código QR — ' + nombreContexto) : 'Mi código QR' });
          return;
        }
      }catch(e){}
      await navigator.share({ title: 'Mi código QR', text: (nombreContexto ? nombreContexto + ' — ' : '') + 'Aquí está mi código de asistencia', url: waLink });
    } else {
      await navigator.clipboard.writeText(waLink);
      toast('Link copiado — pégalo en WhatsApp para compartirlo');
    }
  }catch(e){
    if(e && e.name !== 'AbortError'){ toast('No se pudo compartir', true); }
  }
}

async function analizarComprobante(){
  const input = document.getElementById('comprobanteFile');
  if(!input.files || !input.files[0]){ toast('Primero elige o toma una foto', true); return; }
  document.getElementById('comprobanteLoading').style.display = 'block';
  let base64;
  try{ base64 = await fileToBase64(input.files[0]); }
  catch(e){ toast('No se pudo leer la foto, intenta de nuevo', true); document.getElementById('comprobanteLoading').style.display='none'; return; }
  const res = await apiJug('analizar_comprobante_jugador', { imagenBase64: base64 });
  document.getElementById('comprobanteLoading').style.display = 'none';
  if(res===null) return;
  if(res.duplicado){
    toast('Este comprobante ya había sido usado antes', true);
    return;
  }
  mostrarConfirmarComprobante(res);
}

function mostrarConfirmarComprobante(datos){
  const avisoNoDetectado = !datos.esComprobante ? `
    <div class="alert-card">⚠️ No pudimos leer esta foto como un comprobante de pago válido. Vuelve atrás y sube una foto más clara, o contacta al administrador del club si el problema sigue.</div>
  ` : '';
  const html = `
    <div class="sheet-head"><h2>Confirma los datos</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    ${avisoNoDetectado}
    <p style="color:var(--chalk-dim);font-size:14px;line-height:1.6"><b>Paso 2 de 3.</b> Esto es lo que leímos automáticamente de tu comprobante. Si algo no coincide con tu pago real, toca "Tomar otra foto" — por seguridad, estos datos no se pueden editar manualmente.</p>
    <label>Monto pagado (en dólares)</label>
    <input id="confMonto" type="number" step="0.01" inputmode="decimal" value="${datos.monto || ''}" readonly style="opacity:.75">
    <label>Banco</label>
    <input id="confBanco" value="${esc(datos.banco || '')}" readonly style="opacity:.75">
    <label>Número de comprobante</label>
    <input id="confNumero" value="${esc(datos.numeroComprobante || '')}" readonly style="opacity:.75">
    <label>Fecha de la transferencia</label>
    <input id="confFecha" value="${esc(datos.fechaComprobante || '')}" readonly style="opacity:.75">
    <button class="primary block" style="margin-top:18px" onclick="confirmarYRegistrarPago()">Confirmar y continuar</button>
    <button class="block" style="margin-top:8px" onclick="abrirSubirComprobante()">📸 Tomar otra foto</button>
  `;
  abrirSheet(html);

async function confirmarYRegistrarPago(){
  const monto = parseFloat(document.getElementById('confMonto').value);
  const banco = document.getElementById('confBanco').value.trim();
  const numeroComprobante = document.getElementById('confNumero').value.trim();
  const fecha = document.getElementById('confFecha').value.trim();
  if(!monto || monto<=0){ toast('Escribe un monto válido', true); return; }
  if(!numeroComprobante){ toast('Falta el número de comprobante', true); return; }
  if(!fecha){ toast('Falta la fecha de la transferencia', true); return; }
  const res = await apiJug('registrar_pago_comprobante_jugador', { monto, banco, numeroComprobante, fecha });
  if(res===null) return;
  pagoState = { pagoId: res.pagoId, montoDisponible: Number(res.monto), origenSaldoFavor: false, montoOriginal: Number(res.monto) };
  await abrirDistribuirPago();
}

async function abrirUsarSaldoFavor(){
  const d = await apiJug('ver_pendientes_pago_jugador');
  if(d===null) return;
  if(!d.saldoAFavor || d.saldoAFavor<=0){ toast('No tienes saldo a favor disponible', true); return; }
  pagoState = { pagoId: null, montoDisponible: Number(d.saldoAFavor), origenSaldoFavor: true };
  mostrarDistribucion(d.pendientes);

async function abrirDistribuirPago(){
  const d = await apiJug('ver_pendientes_pago_jugador');
  if(d===null) return;

}

function mostrarDistribucion(p){
  const filas = [];
  if(p.deuda_mensualidad > 0){
    const etiqueta = p.meses_atraso > 0 ? p.meses_atraso+' mes(es) atrasado(s)' : 'mes actual';
    filas.push({tipo:'mensualidad', label:'Mensualidad ('+etiqueta+')', monto:p.deuda_mensualidad});
  }
  if((p.invitados_pendientes||[]).length > 0){
    filas.push({tipo:'invitado', label:'🎟️ Invitados pendientes ('+p.invitados_pendientes.length+')', monto:p.total_invitados});
  }
  if((p.multas_propias||[]).length > 0){
    filas.push({tipo:'multas_propias', label:'⚠️ Multas propias ('+p.multas_propias.length+')', monto:p.total_multas_propias});
  }
  if((p.multas_invitados||[]).length > 0){
    filas.push({tipo:'multas_invitados', label:'⚠️ Multas por invitados ('+p.multas_invitados.length+')', monto:p.total_multas_invitados});
  }
  (p.partidos_especiales||[]).forEach(pe=>{
    filas.push({tipo:'partido_especial', label:'Partido especial: '+esc(pe.alias||''), monto:pe.monto, partidoId:pe.partido_id, conceptoMonto:pe.monto});
  });

  const html = `
    <div class="sheet-head"><h2>¿A qué lo aplicamos?</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <p style="color:var(--chalk-dim);font-size:13px;margin-top:-4px"><b>Paso 3 de 3.</b> Elige un concepto para tu pago.</p>
    <div class="card" style="text-align:center">
      <div class="fl-label">TIENES DISPONIBLE PARA PAGAR</div>
      <div style="font-family:'Oswald',sans-serif;font-size:32px;color:var(--gold);font-weight:700">$${pagoState.montoDisponible.toFixed(2)}</div>
    </div>
    <p style="color:var(--chalk-dim);font-size:14px;line-height:1.6">👉 <b>Toca el concepto</b> al que quieres aplicar este dinero. Si sobra algo después, te preguntaremos qué hacer con el resto — no se pierde nada, siempre queda guardado a tu nombre.</p>
    ${filas.length===0 ? '<div class="ok-card">✓ No tienes deudas pendientes en este momento. Este monto se guardará como saldo a favor.</div>' : filas.map((f)=>`
      <div class="field-line">
        <div>
          <div class="fl-value">${f.label}</div>
          <div class="fl-label">Debes: $${f.monto}</div>
        </div>
        <button class="sm primary" onclick='aplicarPagoConcepto(${JSON.stringify(f).replace(/'/g,"&#39;")})'>Aplicar aquí</button>
      </div>
    `).join('')}
    ${filas.length===0 ? `<button class="primary block" style="margin-top:12px" onclick="guardarComoSaldoFavor(${pagoState.montoDisponible})">Guardar como saldo a favor</button>` : ''}
  `;
  abrirSheet(html);
}

async function aplicarPagoConcepto(f){
  const montoAAplicar = Math.min(pagoState.montoDisponible, Number(f.monto));
  const sobranteFrontend = pagoState.montoDisponible - montoAAplicar;
  const body = {
    tipoConcepto: f.tipo,
    monto: montoAAplicar,
    origenSaldoFavor: pagoState.origenSaldoFavor,
    pagoId: pagoState.pagoId,
    partidoId: f.partidoId,
    conceptoMonto: f.conceptoMonto,
  };
  const res = await apiJug('aplicar_pago_jugador', body);
  if(res===null) return;
  if(res.pagoId) pagoState.pagoId = res.pagoId;
  pagoState.origenSaldoFavor = false;
  res.restante = sobranteFrontend + Number(res.restante || 0);
  mostrarResultadoPago(res);
}

function mostrarResultadoPago(res){
  const restante = Number(res.restante || 0);
  const botonCompartir = pagoState.montoOriginal > 0 ? `
    <button class="block" style="margin-top:8px" onclick="compartirComprobanteGrupo()">📤 Avisar al grupo de WhatsApp</button>
  ` : '';
  let html = `
    <div class="sheet-head"><h2>Resultado de tu pago</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <div class="ok-card">✓ ${esc(res.mensaje)}</div>
  `;
  if(restante > 0.009){
    html += `
      <p style="color:var(--chalk-dim);font-size:14px;line-height:1.6">Todavía te quedan <b>$${restante.toFixed(2)}</b> de este pago sin usar. Elige qué quieres hacer con ese dinero:</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
        <button class="block primary" onclick="continuarConRestante(${restante})">Aplicarlo a otra deuda ahora mismo</button>
        <button class="block" onclick="guardarComoSaldoFavor(${restante})">Guardarlo como saldo a favor para más adelante</button>
      </div>
      ${botonCompartir}
    `;
  } else {
    html += `
      <p style="color:var(--chalk-dim);font-size:14px;text-align:center;margin-top:8px">Tu pago quedó aplicado por completo. ¡Gracias!</p>
      ${botonCompartir}
      <button class="primary block" style="margin-top:8px" onclick="cerrarSheet(); cambiarPantalla('mi_cuenta_jugador');">Listo</button>
    `;
  }
  abrirSheet(html);
}

function compartirComprobanteGrupo(){
  const nombre = (PERFIL && PERFIL.nombres) ? PERFIL.nombres.split(' ')[0] : '';
  const texto = `✅ Hola, soy ${nombre}. Envié mi comprobante de pago por $${pagoState.montoOriginal.toFixed(2)} — ya quedó registrado y aplicado en la app del club.`;
  const url = 'https://wa.me/?text=' + encodeURIComponent(texto);
  window.open(url, '_blank');
}

async function continuarConRestante(restante){
  pagoState.montoDisponible = restante;

  const res = await apiJug('guardar_restante_saldo_favor_jugador', { pagoId: pagoState.pagoId, monto: restante });

async function verDocumento(slug, filename){
  const res = await apiJug('ver_documento_jugador', { slug });
  if(res===null) return;
  if(!res.contenido_base64){ toast('Documento no disponible', true); return; }
  try{
    const byteChars = atob(res.contenido_base64);
    const byteNumbers = new Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = res.filename || filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  }catch(e){
    toast('No se pudo abrir el documento', true);
  }
}

    <div class="card">
      <div class="card-title"><h3>Financiero general del evento</h3></div>
      <div class="field-line"><div class="fl-label">Total recaudado (todas las cuotas)</div><div class="fl-value" style="color:var(--green-ok)">$${d.totalRecaudado.toFixed(2)}</div></div>
      <div class="field-line"><div class="fl-label">Total esperado (todas las cuotas)</div><div class="fl-value">$${d.totalEsperadoCuotas.toFixed(2)}</div></div>

function renderPartidoEventoLinea(p){
  return `
    <div class="field-line" style="cursor:pointer" onclick="verEstadisticasPartidoJugador(${p.id})">
      <div>
        <div class="fl-value">${esc(p.alias || 'Partido')} ${p.estado==='finalizado' ? '<span class="badge finalizado">Finalizado</span>' : ''}</div>
        <div class="fl-label">${fechaCorta(p.fecha)} ${p.hora ? '· '+p.hora.slice(0,5) : ''} · 📍 ${esc(p.lugar||'—')}</div>
      </div>
      ${p.tieneEstadisticas ? '<span style="font-size:18px">📊</span>' : ''}
    </div>
  `;
}

function renderFechasEventoJugador(){
  const fechas = eventoJugActualData.fechas;
  const partidos = eventoJugActualData.partidos || [];
  const generales = partidos.filter(p=>!p.eventoFechaId);
  let html = '';
  if(fechas.length===0){
    html += '<p style="color:var(--chalk-dim);font-size:13px">Este evento es de una sola fecha/sede.</p>';
  } else {
    html += fechas.map(f=>{
      const partidosDeFecha = partidos.filter(p=>p.eventoFechaId===f.id).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
      return `
        <div class="card">
          <div class="fl-value">${esc(f.descripcion || fechaCorta(f.fecha))}</div>
          <div class="fl-label" style="margin-bottom:8px">${fechaCorta(f.fecha)} · 📍 ${esc(f.lugar||'—')}</div>
          ${partidosDeFecha.length===0 ? '<p style="color:var(--chalk-dim);font-size:12px">Sin partidos vinculados.</p>' : partidosDeFecha.map(renderPartidoEventoLinea).join('')}
        </div>
      `;
    }).join('');
  }
  if(generales.length>0){
    html += `<div class="card"><div class="fl-value" style="margin-bottom:8px">Partidos generales del evento</div>${generales.map(renderPartidoEventoLinea).join('')}</div>`;
  }
  return html || '<p style="color:var(--chalk-dim);font-size:13px">Sin partidos vinculados a este evento todavía.</p>';
}

function renderEstadisticasEventoJugador(){
  const d = eventoJugActualData;
  const stats = d.estadisticasEvento || [];
  const partidosConfirmados = stats.length>0 ? stats[0].partidosConfirmados : 0;
  if(stats.length===0){
    return '<p style="color:var(--chalk-dim);font-size:13px">Todavía no hay estadísticas disponibles para este evento.</p>';
  }
  return `
    <p style="color:var(--chalk-dim);font-size:13px;margin-top:0">Basado en ${partidosConfirmados} partido(s) confirmado(s) por ti dentro de este evento.</p>
    <div class="card">
      <div class="card-title"><h3>Tus totales en el evento</h3></div>
      ${stats.map(s=>`
        <div class="field-line">
          <div class="fl-label">${esc(s.nombre)}</div>
          <div class="fl-value">${s.total} <span style="color:var(--chalk-dim);font-size:12px">(prom. ${Number(s.promedio).toFixed(2)}/partido)</span></div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ---------- Planillero: captura de estadisticas en vivo ---------- */
let PARTIDO_CAPTURA_ACTUAL = null;
let ACCION_SELECCIONADA = null;
let CAPTURA_DATA = null;

const apiPlan = (accion, extra) => api(accion, extra);

async function cargarPantallaCapturaPlanillero(cont){
  const ultimoId = parseInt(safeGet('planillero_partido_actual') || '0');
  if(ultimoId){
    PARTIDO_CAPTURA_ACTUAL = ultimoId;
    await mostrarCapturaPartido(cont);
    return;
  }
  await mostrarSelectorPartidoCaptura(cont);
}

async function mostrarSelectorPartidoCaptura(cont){
  cont.innerHTML = '<div class="spinner"></div>';
  const partidos = await apiPlan('listar_partidos_activos_planillero');
  if(partidos===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }
  if(partidos.length===0){
    cont.innerHTML = '<div class="empty"><span class="ic">🔴</span>No hay partidos activos en este momento.</div>';
    return;
  }
  cont.innerHTML = `
    <p style="color:var(--chalk-dim);font-size:13px;margin-top:0">Elige el partido para el que vas a tomar estadísticas.</p>
    ${partidos.map(p=>`
      <button class="jugador-card" onclick="seleccionarPartidoCaptura(${p.id})">
        <div style="font-weight:700;font-size:16px">${p.disciplinaIcono ? esc(p.disciplinaIcono)+' ' : ''}${esc(p.alias || 'Partido')}</div>
        <div style="color:var(--chalk-dim);font-size:13px;margin-top:2px">${fechaCorta(p.fecha)} ${p.hora ? '· '+p.hora.slice(0,5) : ''} · 📍 ${esc(p.lugar||'—')}</div>
        ${p.marcador_propio!==null ? `<div style="color:var(--gold);font-size:13px;margin-top:4px">Marcador actual: ${p.marcador_propio} - ${p.marcador_rival} ${esc(p.rival_nombre||'')}</div>` : ''}
      </button>
    `).join('')}
  `;
}

async function seleccionarPartidoCaptura(partidoId){
  PARTIDO_CAPTURA_ACTUAL = partidoId;
  safeSet('planillero_partido_actual', String(partidoId));
  await cambiarPantalla('captura_estadisticas_planillero');
}

async function mostrarCapturaPartido(cont){
  cont.innerHTML = '<div class="spinner"></div>';
  const data = await apiPlan('abrir_captura_partido_planillero', {partidoId: PARTIDO_CAPTURA_ACTUAL});
  if(data===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }
  CAPTURA_DATA = data;
  ACCION_SELECCIONADA = null;
  renderCapturaPartido(cont);
}

function renderCapturaPartido(cont){
  document.body.classList.add('modo-captura');
  const d = CAPTURA_DATA;
  const p = d.partido;
  cont.innerHTML = `
    <div class="cap-salir">
      <button class="sm" onclick="cambiarPartidoCaptura()">✕ Salir</button>
      <span style="color:var(--chalk-dim);flex:1">${esc(p.alias||'Partido')}</span>
      <button class="sm" onclick="mostrarCapturaPartido(document.getElementById('pantallasContainer'))">🔄</button>
    </div>

    <div class="cap-marcador">
      <div class="equipo"><div class="etq">Nuestro equipo</div><div class="pts" id="capMarcadorPropio">${p.marcador_propio||0}</div></div>
      <div style="color:var(--chalk-dim)">VS</div>
      <div class="equipo"><div class="etq">${esc(p.rival_nombre||'Rival')}</div><div class="pts" id="capMarcadorRival" style="color:var(--chalk)">${p.marcador_rival||0}</div></div>
    </div>

    <div class="cap-grid">
      <div class="cap-panel">
        <div class="cap-panel-title">1. Toca la acción</div>
        <div class="cap-acciones" id="capAccionesGrid">
          ${d.tipos.map(t=>{
            const esFalta = /falta/i.test(t.nombre);
            const clase = esFalta ? 'falta' : (t.puntos>0 ? 'puntos' : '');
            return `<button class="cap-btn-accion ${clase}" data-tipo="${t.id}" onclick="seleccionarAccionCaptura(${t.id}, ${t.puntos}, '${esc(t.nombre)}', this)">${esc(t.nombre)}${t.puntos>0 ? ' +'+t.puntos : ''}</button>`;
          }).join('')}
          <div class="cap-btn-rival">
            <button onclick="registrarPuntosRival(1)">+1 Rival</button>
            <button onclick="registrarPuntosRival(2)">+2 Rival</button>
            <button onclick="registrarPuntosRival(3)">+3 Rival</button>
          </div>
        </div>
      </div>

      <div class="cap-panel">
        <div class="cap-panel-title">2. Toca a la jugadora</div>
        <div class="cap-jugadoras" id="capJugadorasGrid">
          ${d.jugadores.map(j=>`
            <button class="cap-btn-jugadora" onclick='registrarAccionJugadora(${j.id}, ${JSON.stringify(j.nombres).replace(/"/g,"&quot;")})'>
              <span class="num">#${esc(j.numeroCamiseta||'—')}</span><span class="nom">${esc(j.nombreCorto)}</span>
            </button>
          `).join('')}
        </div>
        ${d.jugadores.length===0 ? '<p style="color:var(--chalk-dim);font-size:12px">Nadie ha confirmado asistencia todavía.</p>' : ''}
      </div>
    </div>

    <div class="cap-panel" style="margin-top:8px">
      <div class="cap-panel-title">Últimos eventos</div>
      <div id="capLog" class="cap-log">
        ${renderLogCapturaHtml(d.log)}
      </div>
    </div>
  `;
}

function renderLogCapturaHtml(log){
  if(log.length===0) return '<div class="cap-log-item"><span style="color:var(--chalk-dim)">Sistema listo. Selecciona una acción.</span></div>';
  return log.map(item=>`
    <div class="cap-log-item" ${item.esRival ? '' : `style="cursor:pointer" onclick="abrirEditarEventoCaptura(${item.id})"`}>
      <span style="color:var(--chalk-dim)">${new Date(item.creadoEn).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>
      <span style="flex:1;margin:0 8px">${item.esRival ? 'Rival (+'+item.puntos+')' : esc(item.jugadorNombre)+' → '+esc(item.tipoNombre)+(item.puntos>0?' (+'+item.puntos+')':'')}</span>
      <button style="background:none;border:none;color:var(--red);cursor:pointer;font-size:14px" onclick="event.stopPropagation(); borrarEventoCaptura(${item.id})">🗑️</button>
    </div>
  `).join('');
}

function abrirEditarEventoCaptura(logId){
  const item = CAPTURA_DATA.log.find(l=>l.id===logId);
  if(!item) return;
  const d = CAPTURA_DATA;
  const html = `
    <div class="sheet-head"><h2>Corregir registro</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <label>Jugadora</label>
    <select id="editLogJugador">
      ${d.jugadores.map(j=>`<option value="${j.id}" ${j.id===item.jugadorId?'selected':''}>#${esc(j.numeroCamiseta||'—')} ${esc(j.nombres)}</option>`).join('')}
    </select>
    <label>Acción</label>
    <select id="editLogTipo">
      ${d.tipos.map(t=>`<option value="${t.id}" ${t.id===item.tipoEstadisticaId?'selected':''}>${esc(t.nombre)}${t.puntos>0?' +'+t.puntos:''}</option>`).join('')}
    </select>
    <button class="primary block" style="margin-top:16px" onclick="guardarEditarEventoCaptura(${logId})">Guardar corrección</button>
  `;
  abrirSheet(html);
}

async function guardarEditarEventoCaptura(logId){
  const jugadorId = parseInt(document.getElementById('editLogJugador').value);
  const tipoEstadisticaId = parseInt(document.getElementById('editLogTipo').value);
  const res = await apiPlan('editar_evento_partido_planillero', {logId, jugadorId, tipoEstadisticaId});
  if(res===null) return;

  const item = CAPTURA_DATA.log.find(l=>l.id===logId);
  item.jugadorId = jugadorId;
  item.tipoEstadisticaId = tipoEstadisticaId;
  item.puntos = res.puntos;
  item.jugadorNombre = res.jugadorNombre;
  item.tipoNombre = res.tipoNombre;
  CAPTURA_DATA.partido.marcador_propio = res.marcadorPropio;
  document.getElementById('capMarcadorPropio').textContent = res.marcadorPropio;
  document.getElementById('capLog').innerHTML = renderLogCapturaHtml(CAPTURA_DATA.log);
  cerrarSheet();
  toast('Registro corregido');
}

function seleccionarAccionCaptura(tipoId, puntos, nombre, btnEl){
  ACCION_SELECCIONADA = { tipoId, puntos, nombre };
  document.querySelectorAll('#capAccionesGrid button').forEach(b=>b.classList.remove('activa'));
  btnEl.classList.add('activa');
}

async function registrarAccionJugadora(jugadorId, nombreJugadora){
  if(!ACCION_SELECCIONADA){
    toast('Primero toca una acción (arriba) y luego a la jugadora', true);
    return;
  }
  const res = await apiPlan('registrar_evento_partido_planillero', {
    partidoId: PARTIDO_CAPTURA_ACTUAL, jugadorId,
    tipoEstadisticaId: ACCION_SELECCIONADA.tipoId, esRival: false, puntos: ACCION_SELECCIONADA.puntos,
  });
  if(res===null) return;
  CAPTURA_DATA.log.unshift({
    id: res.id, jugadorId, tipoEstadisticaId: ACCION_SELECCIONADA.tipoId, esRival: false,
    puntos: ACCION_SELECCIONADA.puntos, creadoEn: res.creadoEn, jugadorNombre: nombreJugadora, tipoNombre: ACCION_SELECCIONADA.nombre,
  });
  if(ACCION_SELECCIONADA.puntos>0){
    CAPTURA_DATA.partido.marcador_propio = (CAPTURA_DATA.partido.marcador_propio||0) + ACCION_SELECCIONADA.puntos;
    document.getElementById('capMarcadorPropio').textContent = CAPTURA_DATA.partido.marcador_propio;
  }
  document.getElementById('capLog').innerHTML = renderLogCapturaHtml(CAPTURA_DATA.log);
  document.querySelectorAll('#capAccionesGrid button').forEach(b=>b.classList.remove('activa'));
  ACCION_SELECCIONADA = null;
}

async function registrarPuntosRival(puntos){
  const res = await apiPlan('registrar_evento_partido_planillero', {
    partidoId: PARTIDO_CAPTURA_ACTUAL, esRival: true, puntos,
  });
  if(res===null) return;
  CAPTURA_DATA.log.unshift({ id: res.id, esRival: true, puntos, creadoEn: res.creadoEn });
  CAPTURA_DATA.partido.marcador_rival = (CAPTURA_DATA.partido.marcador_rival||0) + puntos;
  document.getElementById('capMarcadorRival').textContent = CAPTURA_DATA.partido.marcador_rival;
  document.getElementById('capLog').innerHTML = renderLogCapturaHtml(CAPTURA_DATA.log);
}

async function borrarEventoCaptura(logId){
  if(!confirm('¿Borrar este evento? Esto ajusta el marcador si corresponde.')) return;
  const item = CAPTURA_DATA.log.find(l=>l.id===logId);
  const res = await apiPlan('eliminar_evento_partido_planillero', {logId});
  if(res===null) return;
  if(item){
    if(item.esRival){
      CAPTURA_DATA.partido.marcador_rival = Math.max(0, (CAPTURA_DATA.partido.marcador_rival||0) - item.puntos);
      document.getElementById('capMarcadorRival').textContent = CAPTURA_DATA.partido.marcador_rival;
    } else if(item.puntos>0){
      CAPTURA_DATA.partido.marcador_propio = Math.max(0, (CAPTURA_DATA.partido.marcador_propio||0) - item.puntos);
      document.getElementById('capMarcadorPropio').textContent = CAPTURA_DATA.partido.marcador_propio;
    }
  }
  CAPTURA_DATA.log = CAPTURA_DATA.log.filter(l=>l.id!==logId);
  document.getElementById('capLog').innerHTML = renderLogCapturaHtml(CAPTURA_DATA.log);
  toast('Evento borrado');
}

function cambiarPartidoCaptura(){
  safeSet('planillero_partido_actual', '');
  PARTIDO_CAPTURA_ACTUAL = null;
  cambiarPantalla('captura_estadisticas_planillero');
}

/* ---------- Entrenador: Horario semanal y Calendario ---------- */
const DIAS_SEMANA_ENT = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAS_CORTO_ENT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
let DIA_SELECCIONADO_HORARIO = new Date().getDay();

async function cargarPantallaHorarioEntrenador(cont){
  cont.innerHTML = '<div class="spinner"></div>';
  const data = await apiEnt('listar_horario_semanal_entrenador');
  if(data===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }
  window._horarioEntData = data;
  renderPantallaHorarioEntrenador(cont);
}

function renderPantallaHorarioEntrenador(cont){
  const data = window._horarioEntData;
  const horariosDelDia = data.horarios.filter(h=>h.diaSemana===DIA_SELECCIONADO_HORARIO);
  cont.innerHTML = `
    <div class="row-actions tabbar-scroll" style="margin-bottom:10px">
      ${DIAS_CORTO_ENT.map((d,i)=>`<button class="sm ${i===DIA_SELECCIONADO_HORARIO?'primary':''}" onclick="seleccionarDiaHorarioEnt(${i})">${d}</button>`).join('')}
    </div>
    ${horariosDelDia.length===0 ? '<div class="empty"><span class="ic">📅</span>Sin entrenamientos programados este día.</div>' : horariosDelDia.map(h=>{
      const asis = data.asistencias[h.grupoId];
      return `
        <div class="card">
          <div class="card-title"><h3>${esc(h.grupoNombre)}</h3></div>
          <div class="meta">🕐 ${h.horaInicio ? h.horaInicio.slice(0,5) : ''}${h.horaFin ? ' - '+h.horaFin.slice(0,5) : ''} · 📍 ${esc(h.lugar||'—')}</div>
          ${asis ? `<div class="ok-card" style="margin-top:8px">Última sesión (${fechaCorta(asis.fecha)}): ${asis.asistieron}/${asis.total} asistieron</div>` : '<p style="color:var(--chalk-dim);font-size:12px;margin-top:8px">Sin sesiones registradas todavía.</p>'}
        </div>
      `;
    }).join('')}
  `;
}

function seleccionarDiaHorarioEnt(dia){
  DIA_SELECCIONADO_HORARIO = dia;
  renderPantallaHorarioEntrenador(document.getElementById('pantallasContainer'));
}

/* ---------- Calendario ---------- */
let CALENDARIO_ENT_ANIO = new Date().getFullYear();
let CALENDARIO_ENT_MES = new Date().getMonth() + 1; // 1-12
let CALENDARIO_ENT_DIA_SEL = null;

async function cargarPantallaCalendarioEntrenador(cont){
  cont.innerHTML = '<div class="spinner"></div>';
  await cargarMesCalendarioEnt(cont);
}

async function cargarMesCalendarioEnt(cont){
  const data = await apiEnt('listar_calendario_mes_entrenador', {anio: CALENDARIO_ENT_ANIO, mes: CALENDARIO_ENT_MES});
  if(data===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }
  window._calendarioEntData = data;
  CALENDARIO_ENT_DIA_SEL = null;
  renderCalendarioEntrenador(cont);
}

function renderCalendarioEntrenador(cont){
  const data = window._calendarioEntData;
  const diasConPartido = new Set();
  const diasConEntreno = new Set();
  data.sesiones.forEach(s=>diasConEntreno.add(new Date(s.fecha).getUTCDate()));
  data.partidos.forEach(p=>diasConPartido.add(new Date(p.fecha).getUTCDate()));
  (data.horarios||[]).forEach(h=>diasConEntreno.add(new Date(h.fecha).getUTCDate()));

  const primerDia = new Date(Date.UTC(CALENDARIO_ENT_ANIO, CALENDARIO_ENT_MES-1, 1));
  const diasEnMes = new Date(Date.UTC(CALENDARIO_ENT_ANIO, CALENDARIO_ENT_MES, 0)).getUTCDate();
  const offsetInicio = primerDia.getUTCDay();
  const nombreMes = primerDia.toLocaleDateString('es-EC', {month:'long', year:'numeric', timeZone:'UTC'});

  let celdas = '';
  for(let i=0;i<offsetInicio;i++) celdas += '<div></div>';
  for(let d=1; d<=diasEnMes; d++){
    const tienePartido = diasConPartido.has(d);
    const tieneEntreno = diasConEntreno.has(d);
    const seleccionado = d===CALENDARIO_ENT_DIA_SEL;
    let punto = '';
    if(!seleccionado){
      if(tienePartido) punto = '<div style="width:7px;height:7px;border-radius:50%;background:var(--red);margin:2px auto 0;box-shadow:0 0 4px var(--red)"></div>';
      else if(tieneEntreno) punto = '<div style="width:5px;height:5px;border-radius:50%;background:var(--gold);margin:2px auto 0"></div>';
    }
    celdas += `<div onclick="seleccionarDiaCalendarioEnt(${d})" style="text-align:center;padding:8px 2px;border-radius:8px;cursor:pointer;${seleccionado?'background:var(--gold);color:var(--on-accent);font-weight:700;':''}">
      ${d}${punto}
    </div>`;
  }

  cont.innerHTML = `
    <div class="row-actions" style="justify-content:space-between;margin-bottom:10px">
      <button class="sm" onclick="cambiarMesCalendarioEnt(-1)">← </button>
      <div style="font-weight:700;text-transform:capitalize">${nombreMes}</div>
      <button class="sm" onclick="cambiarMesCalendarioEnt(1)">→</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:13px">
      ${DIAS_CORTO_ENT.map(d=>`<div style="text-align:center;color:var(--chalk-dim);font-size:11px">${d}</div>`).join('')}
      ${celdas}
    </div>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:11px;color:var(--chalk-dim)">
      <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:4px"></span>Partido</span>
      <span><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:4px"></span>Entreno</span>
    </div>
    <div id="calendarioEntDetalle" style="margin-top:14px">${renderDetalleDiaCalendarioEnt()}</div>
  `;
}

function renderDetalleDiaCalendarioEnt(){
  if(!CALENDARIO_ENT_DIA_SEL) return '<p style="color:var(--chalk-dim);font-size:13px">Toca un día con punto para ver el detalle.</p>';
  const data = window._calendarioEntData;
  const sesionesDia = data.sesiones.filter(s=>new Date(s.fecha).getUTCDate()===CALENDARIO_ENT_DIA_SEL);
  const partidosDia = data.partidos.filter(p=>new Date(p.fecha).getUTCDate()===CALENDARIO_ENT_DIA_SEL);
  // Solo se muestra el horario recurrente si ese grupo NO tiene ya una
  // sesion puntual registrada ese mismo dia (para no duplicar la info).
  const gruposConSesion = new Set(sesionesDia.map(s=>s.grupo));
  const horariosDia = (data.horarios||[]).filter(h=>new Date(h.fecha).getUTCDate()===CALENDARIO_ENT_DIA_SEL && !gruposConSesion.has(h.grupo));
  if(sesionesDia.length===0 && partidosDia.length===0 && horariosDia.length===0) return '<p style="color:var(--chalk-dim);font-size:13px">Sin actividad este día.</p>';
  return `
    <div class="card">
      ${sesionesDia.map(s=>`<div class="field-line"><div class="fl-value">🏋️ ${esc(s.grupo)}</div><div class="fl-label">${esc(s.detalle||'Entrenamiento')}</div></div>`).join('')}
      ${horariosDia.map(h=>`<div class="field-line"><div class="fl-value">📅 ${esc(h.grupo)}</div><div class="fl-label">${h.hora?h.hora.slice(0,5)+' · ':''}📍 ${esc(h.detalle||'—')} (horario habitual)</div></div>`).join('')}
      ${partidosDia.map(p=>`<div class="field-line"><div class="fl-value">⚽ ${esc(p.alias||'Partido')}</div><div class="fl-label">${p.hora?p.hora.slice(0,5)+' · ':''}📍 ${esc(p.detalle||'—')}</div></div>`).join('')}
    </div>
  `;
}

function seleccionarDiaCalendarioEnt(dia){
  CALENDARIO_ENT_DIA_SEL = dia;
  renderCalendarioEntrenador(document.getElementById('pantallasContainer'));
}

function cambiarMesCalendarioEnt(delta){
  CALENDARIO_ENT_MES += delta;
  if(CALENDARIO_ENT_MES > 12){ CALENDARIO_ENT_MES = 1; CALENDARIO_ENT_ANIO++; }
  if(CALENDARIO_ENT_MES < 1){ CALENDARIO_ENT_MES = 12; CALENDARIO_ENT_ANIO--; }
  cargarMesCalendarioEnt(document.getElementById('pantallasContainer'));
}
