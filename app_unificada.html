<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mi Club</title>
<meta name="theme-color" content="#14231A">
<link rel="icon" href="/api/logo" type="image/png">
<link rel="apple-touch-icon" href="/api/logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script>
window._configClubPromise = fetch('/api/config').then(r=>r.json()).catch(()=>({onesignalAppId:null, iconoDeporte:'⚽'}));
window._iconoDeporteActual = '⚽';
window._configClubPromise.then(cfg => {
  window._iconoDeporteActual = cfg.iconoDeporte || '⚽';
  document.querySelectorAll('.ic-deporte').forEach(el => el.textContent = window._iconoDeporteActual);
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/OneSignalSDKWorker.js').catch(e => console.error('No se pudo registrar el Service Worker:', e));
}
</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    try {
      const cfg = await window._configClubPromise;
      if (cfg.onesignalAppId) await OneSignal.init({ appId: cfg.onesignalAppId });
    } catch (e) {
      console.error('No se pudo inicializar OneSignal:', e);
    }
  });
</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-0:#0E1712; --pitch-1:#14231A; --pitch-2:#1C2E20; --pitch-3:#28402F;
    --line:#33502F; --chalk:#E9EEE3; --chalk-dim:#9FB09A; --gold:#FFD23F; --gold-dim:#8C7A2A;
    --red:#E85D4C; --green-ok:#6FCF97; --radius:14px;
  }
  [data-theme="light"]{
    --pitch-0:#F7F9F5; --pitch-1:#FFFFFF; --pitch-2:#EEF2EA; --pitch-3:#E0E8DA;
    --line:#C9D6C2; --chalk:#16241A; --chalk-dim:#5A6B54; --gold:#C9971F; --gold-dim:#8C7A2A;
    --red:#C0392B; --green-ok:#2E9E5B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:radial-gradient(1200px 600px at 50% -10%, #1A2C1F 0%, var(--pitch-1) 55%), var(--pitch-1);
    color:var(--chalk); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    height:100vh; height:100dvh; overflow:hidden;
  }
  #appRoot{ display:none; flex-direction:column; height:100vh; height:100dvh; }
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  header.top{ flex-shrink:0; background:linear-gradient(180deg, var(--pitch-1) 70%, transparent); padding:18px 20px 14px; border-bottom:1px solid var(--line); }
  header.top h1{font-size:20px;margin:0;font-weight:600;color:var(--chalk);}
  header.top .sub{font-size:12px;color:var(--chalk-dim);margin-top:2px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;}
  .centerline{height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px, transparent 10px 18px);margin-top:12px;border-radius:2px;}
  main{flex:1;overflow-y:auto;padding:16px 16px 90px;-webkit-overflow-scrolling:touch;}
  .screen{display:none;animation:fade .25s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .card{background:var(--pitch-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .card-title h3{margin:0;font-size:18px;color:var(--chalk);}
  .meta{font-size:13px;color:var(--chalk-dim);line-height:1.6;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .tabbar-scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
  .tabbar-scroll::-webkit-scrollbar{display:none;}
  .tabbar-scroll button{flex-shrink:0;}
  button{font-family:inherit;cursor:pointer;}
  button.block{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-weight:600;font-size:14px;}
  button.primary{background:var(--gold);border-color:var(--gold);color:#1A2A1D;}
  button.danger{background:rgba(232,93,76,.12);border-color:rgba(232,93,76,.35);color:var(--red);}
  button.sm{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-size:13px;font-weight:600;flex-shrink:0;}
  button.sm.primary{background:var(--gold);border-color:var(--gold);color:#1A2A1D;}
  input,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-size:15px;margin-bottom:12px;font-family:inherit;}
  label{display:block;font-size:12px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;font-weight:600;}
  nav.tabs{ flex-shrink:0; display:flex; background:var(--pitch-1); border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom)); position:fixed; bottom:0; left:0; right:0; }
  nav.tabs button{ flex:1;background:none;border:none;color:var(--chalk-dim); display:flex;flex-direction:column;align-items:center;gap:3px; font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em; padding:6px 0;border-radius:10px; }
  nav.tabs button .ic{font-size:20px;}
  nav.tabs button.active{color:var(--gold);background:rgba(255,210,63,.08);}
  .empty{text-align:center;padding:48px 16px;color:var(--chalk-dim);}
  .empty .ic{font-size:40px;display:block;margin-bottom:10px;}
  .toast{ position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px); background:var(--pitch-3);border:1px solid var(--line);color:var(--chalk); padding:12px 18px;border-radius:12px;font-size:14px;z-index:100; opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center; }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:rgba(232,93,76,.9);border-color:var(--red);color:#fff;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;animation:fadeOv .2s ease;}
  @keyframes fadeOv{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--pitch-1);width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .sheet-head h2{margin:0;font-size:20px;}
  .sheet-close{background:none;border:none;color:var(--chalk-dim);font-size:22px;padding:4px 8px;}
  .field-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .field-line:last-child{border-bottom:none;}
  .field-line .fl-label{font-size:14px;color:var(--chalk-dim);}
  .field-line .fl-value{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--chalk);}
  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .login-card{max-width:400px;margin:15vh auto 0;padding:0 24px;text-align:center;}
  .login-card .mark{font-size:48px;margin-bottom:10px;}
  .login-card h1{font-size:26px;margin:0 0 4px;}
  .login-card p{color:var(--chalk-dim);font-size:14px;margin-bottom:20px;}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="loginScreen">
  <div class="login-card">
    <div class="mark">🏟️</div>
    <h1>Mi Club</h1>
    <div id="loginCardContent">
      <p id="loginSubtitle">Ingresa tu cédula</p>
      <input type="tel" id="loginCedula" placeholder="Tu cédula" inputmode="numeric">
      <button class="primary block" onclick="intentarLogin()">Ingresar</button>
    </div>
  </div>
</div>

<div id="appRoot">
  <header class="top">
    <img src="/api/logo" alt="" style="width:28px;height:28px;border-radius:7px;vertical-align:middle;margin-right:8px" onerror="this.style.display='none'"><h1 id="saludoHeader" style="display:inline">Hola 👋</h1>
    <div class="sub" id="rolesHeader">CARGANDO...</div>
    <div class="centerline"></div>
  </header>

  <main>
    <div id="pantallasContainer"></div>
  </main>

  <nav class="tabs" id="navTabs"></nav>
</div>

<script>
function safeGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

let TOKEN = safeGet('app_token');
let SESION = null; // {roles, jugadorId, representanteId, entrenadorId, nombres, menu}
let pantallaActual = null;
const MAX_TABS_VISIBLES = 3; // el resto se agrupa en "Mas", igual que en Admin

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(()=>{ t.className='toast'; }, 2600);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function abrirSheet(html){
  cerrarSheet();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'sheetOverlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) cerrarSheet(); };
  overlay.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(overlay);
}
function cerrarSheet(){
  const el = document.getElementById('sheetOverlay');
  if(el) el.remove();
}

async function api(accion, extra){
  const body = Object.assign({ token: TOKEN, accion }, extra || {});
  try{
    const res = await fetch('/api/app_unificada', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!data.success){ toast(data.error || 'Error', true); return null; }
    return data.data !== undefined ? data.data : true;
  }catch(e){
    toast('No se pudo conectar. Revisa tu internet.', true);
    return null;
  }
}

/* ---------- Login (cedula + clave, un solo flujo para cualquier rol) ---------- */
let cedulaLoginPendiente = '';
let claveTemporalPendiente = '';

async function intentarLogin(){
  const cedula = document.getElementById('loginCedula').value.trim();
  if(!cedula){ toast('Ingresa tu cédula', true); return; }
  const res = await api('login_unificado', { cedula });
  if(res===null) return;
  if(!res.registrado){
    toast('No encontramos esa cédula en el club. Consulta con el Admin.', true);
    return;
  }
  cedulaLoginPendiente = cedula;
  if(res.tieneClave) mostrarPantallaIngresarClave();
  else mostrarPantallaCrearClave();
}

function mostrarPantallaIngresarClave(){
  document.getElementById('loginCardContent').innerHTML = `
    <p>Ingresa tu clave de seguridad</p>
    <input type="password" id="loginClave" placeholder="Clave de 6 dígitos" inputmode="numeric" maxlength="6">
    <button class="primary block" onclick="verificarClaveLogin()">Ingresar</button>
    <button class="block" style="margin-top:8px" onclick="volverAIngresarCedula()">← Usar otra cédula</button>
  `;
}
function mostrarPantallaCrearClave(){
  document.getElementById('loginCardContent').innerHTML = `
    <p>Es tu primera vez aquí. Crea una clave de seguridad de 6 números — te va a servir para cualquiera de tus roles en el club.</p>
    <input type="password" id="loginClaveNueva" placeholder="Crea tu clave (6 dígitos)" inputmode="numeric" maxlength="6">
    <input type="password" id="loginClaveNuevaConfirmar" placeholder="Repite la clave" inputmode="numeric" maxlength="6">
    <button class="primary block" onclick="crearClaveLogin()">Crear clave y entrar</button>
    <button class="block" style="margin-top:8px" onclick="volverAIngresarCedula()">← Usar otra cédula</button>
  `;
}
function volverAIngresarCedula(){
  cedulaLoginPendiente = '';
  document.getElementById('loginCardContent').innerHTML = `
    <p id="loginSubtitle">Ingresa tu cédula</p>
    <input type="tel" id="loginCedula" placeholder="Tu cédula" inputmode="numeric">
    <button class="primary block" onclick="intentarLogin()">Ingresar</button>
  `;
}
async function crearClaveLogin(){
  const clave = document.getElementById('loginClaveNueva').value.trim();
  const confirmar = document.getElementById('loginClaveNuevaConfirmar').value.trim();
  if(!/^\d{6}$/.test(clave)){ toast('La clave debe ser de 6 números', true); return; }
  if(clave !== confirmar){ toast('Las claves no coinciden', true); return; }
  const res = await api('crear_clave_unificada', { cedula: cedulaLoginPendiente, clave });
  if(res===null) return;
  TOKEN = res.token;
  safeSet('app_token', TOKEN);
  await entrarApp(res.nombres);
}
async function verificarClaveLogin(){
  const clave = document.getElementById('loginClave').value.trim();
  if(!/^\d{6}$/.test(clave)){ toast('Ingresa los 6 dígitos de tu clave', true); return; }
  const res = await api('verificar_clave_unificada', { cedula: cedulaLoginPendiente, clave });
  if(res===null) return;
  if(res.debeCambiarClave){
    claveTemporalPendiente = clave;
    mostrarPantallaCambiarClaveObligatorio();
    return;
  }
  TOKEN = res.token;
  safeSet('app_token', TOKEN);
  await entrarApp(res.nombres);
}
function mostrarPantallaCambiarClaveObligatorio(){
  document.getElementById('loginCardContent').innerHTML = `
    <p>Esa era tu clave temporal. Ahora crea tu clave definitiva (6 números).</p>
    <input type="password" id="loginClaveDefinitiva" placeholder="Nueva clave (6 dígitos)" inputmode="numeric" maxlength="6">
    <input type="password" id="loginClaveDefinitivaConfirmar" placeholder="Repite la clave" inputmode="numeric" maxlength="6">
    <button class="primary block" onclick="confirmarCambioClaveObligatorio()">Guardar y entrar</button>
  `;
}
async function confirmarCambioClaveObligatorio(){
  const claveNueva = document.getElementById('loginClaveDefinitiva').value.trim();
  const confirmar = document.getElementById('loginClaveDefinitivaConfirmar').value.trim();
  if(!/^\d{6}$/.test(claveNueva)){ toast('La clave debe ser de 6 números', true); return; }
  if(claveNueva !== confirmar){ toast('Las claves no coinciden', true); return; }
  const login = await api('verificar_clave_unificada', { cedula: cedulaLoginPendiente, clave: claveTemporalPendiente });
  if(login===null) return;
  TOKEN = login.token;
  safeSet('app_token', TOKEN);
  const res = await api('cambiar_clave_unificada', { claveActual: claveTemporalPendiente, claveNueva });
  if(res===null) return;
  toast('¡Clave actualizada!');
  await entrarApp(login.nombres);
}

if(TOKEN){
  api('obtener_sesion_y_menu').then(res=>{
    if(res!==null && res.roles.length>0){ entrarApp(res.nombres, res); }
    else if(res!==null){ safeSet('app_token',''); TOKEN=''; }
  });
}
</script>
<script>
const ETIQUETAS_ROL_HEADER = {jugador:'Jugador', representante:'Representante', entrenador:'Entrenador', director:'Director'};

async function entrarApp(nombresLogin, sesionPrecargada){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appRoot').style.display='flex';
  if(nombresLogin) document.getElementById('saludoHeader').textContent = 'Hola, ' + nombresLogin.split(' ')[0] + ' 👋';

  const data = sesionPrecargada || await api('obtener_sesion_y_menu');
  if(data===null) return;
  SESION = data;

  document.getElementById('rolesHeader').textContent = data.roles.map(r=>ETIQUETAS_ROL_HEADER[r]||r).join(' · ');

  // OneSignal: un tag por cada rol que la persona tenga -- todos en
  // la MISMA suscripcion, porque ahora es una sola app instalada.
  if(window.OneSignalDeferred){
    OneSignalDeferred.push(async function(OneSignal){
      try{
        const tags = {};
        if(data.jugadorId) tags.jugador_id = String(data.jugadorId);
        if(data.representanteId) tags.representante_id = String(data.representanteId);
        if(data.entrenadorId) tags.entrenador_id = String(data.entrenadorId);
        if(Object.keys(tags).length>0) await OneSignal.User.addTag(Object.keys(tags)[0], tags[Object.keys(tags)[0]]);
        for(const k of Object.keys(tags)) await OneSignal.User.addTag(k, tags[k]);
        const yaSuscrito = await (async()=>{
          try{ if(OneSignal.User.PushSubscription.optedIn===true) return true; }catch(e){}
          try{ const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); return !!sub; }catch(e){ return false; }
        })();
        if(!yaSuscrito && typeof Notification !== 'undefined' && Notification.permission === 'granted'){
          await OneSignal.User.PushSubscription.optIn();
        }
      }catch(e){}
    });
  }

  construirMenu(data.menu);
  if(data.menu.length>0) cambiarPantalla(data.menu[0].clave);
}

function construirMenu(menu){
  const nav = document.getElementById('navTabs');
  const principales = menu.slice(0, MAX_TABS_VISIBLES);
  const enMas = menu.slice(MAX_TABS_VISIBLES);

  let html = principales.map(p=>`
    <button data-clave="${p.clave}" onclick="cambiarPantalla('${p.clave}')"><span class="ic">${p.icono}</span>${esc(p.etiqueta)}</button>
  `).join('');

  if(enMas.length>0){
    html += `<button id="btnTabMas" onclick="abrirMenuMas(${JSON.stringify(enMas).replace(/"/g,'&quot;')})"><span class="ic">⋯</span>Más</button>`;
  }
  nav.innerHTML = html;
}

function abrirMenuMas(items){
  const html = `
    <div class="sheet-head"><h2>Más opciones</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    ${items.map(p=>`
      <button class="block" style="text-align:left;margin-bottom:8px" onclick="cerrarSheet(); cambiarPantalla('${p.clave}')">${p.icono} ${esc(p.etiqueta)}</button>
    `).join('')}
  `;
  abrirSheet(html);
}

function cambiarPantalla(clave){
  pantallaActual = clave;
  document.querySelectorAll('nav.tabs button[data-clave]').forEach(b=>b.classList.toggle('active', b.dataset.clave===clave));
  const enMas = SESION.menu.slice(MAX_TABS_VISIBLES).some(p=>p.clave===clave);
  const btnMas = document.getElementById('btnTabMas');
  if(btnMas) btnMas.classList.toggle('active', enMas);

  const cont = document.getElementById('pantallasContainer');
  cont.innerHTML = '<div class="spinner"></div>';

  // Router: cada clave del catalogo tiene su propia funcion de carga.
  // Si todavia no esta implementada, se avisa claramente en vez de
  // fallar en silencio -- asi queda listo para irse llenando pantalla
  // por pantalla sin tocar el resto del sistema.
  const renderizadores = {
    'perfil': cargarPantallaPerfil,
  };
  const fn = renderizadores[clave];
  if(fn) fn(cont);
  else cont.innerHTML = `<div class="empty"><span class="ic">🚧</span>Esta pantalla ("${esc(clave)}") todavía no se portó a la app unificada.<br><br>Sigue funcionando con normalidad en su app original mientras se completa la migración.</div>`;
}
</script>
<script>
/* ---------- Perfil (unica pantalla compartida entre roles) ---------- */
async function cargarPantallaPerfil(cont){
  const perfil = await api('obtener_perfil_unificado');
  if(perfil===null) return;
  cont.innerHTML = `
    <div class="card">
      <div class="card-title"><h3>Mis datos</h3></div>
      <label>Cédula</label>
      <input value="${esc(perfil.cedula)}" disabled style="opacity:.6">
      <label>Nombres</label>
      <input id="perfilNombres" value="${esc(perfil.nombres||'')}">
      <label>Apellidos</label>
      <input id="perfilApellidos" value="${esc(perfil.apellidos||'')}">
      <label>Teléfono</label>
      <input id="perfilTelefono" type="tel" value="${esc(perfil.telefono||'')}">
      <button class="primary block" style="margin-top:10px" onclick="guardarPerfil()">Guardar</button>
    </div>
    <div class="card">
      <div class="card-title"><h3>Tus roles en el club</h3></div>
      <div class="meta">${perfil.roles.map(r=>ETIQUETAS_ROL_HEADER[r]||r).join(' · ')}</div>
    </div>
    <button class="block" onclick="abrirSelectorTema()">🎨 Estilo de la app</button>
    <button class="block" onclick="abrirCambiarClave()">🔒 Cambiar mi clave de seguridad</button>
    <button class="block danger" onclick="cerrarSesionApp()">Cerrar sesión en este dispositivo</button>
  `;
}

async function guardarPerfil(){
  const nombres = document.getElementById('perfilNombres').value.trim();
  const apellidos = document.getElementById('perfilApellidos').value.trim();
  const telefono = document.getElementById('perfilTelefono').value.trim();
  if(!nombres || !apellidos){ toast('Completa nombres y apellidos', true); return; }
  const res = await api('actualizar_perfil_unificado', {nombres, apellidos, telefono});
  if(res===null) return;
  toast('Datos actualizados');
}

function abrirCambiarClave(){
  const html = `
    <div class="sheet-head"><h2>Cambiar mi clave</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <label>Clave actual</label>
    <input type="password" id="claveActualApp" inputmode="numeric" maxlength="6">
    <label>Clave nueva (6 dígitos)</label>
    <input type="password" id="claveNuevaApp" inputmode="numeric" maxlength="6">
    <label>Repite la clave nueva</label>
    <input type="password" id="claveNuevaConfirmarApp" inputmode="numeric" maxlength="6">
    <button class="primary block" style="margin-top:12px" onclick="guardarCambioClave()">Guardar</button>
  `;
  abrirSheet(html);
}
async function guardarCambioClave(){
  const claveActual = document.getElementById('claveActualApp').value.trim();
  const claveNueva = document.getElementById('claveNuevaApp').value.trim();
  const confirmar = document.getElementById('claveNuevaConfirmarApp').value.trim();
  if(!/^\d{6}$/.test(claveNueva)){ toast('La clave nueva debe ser de 6 números', true); return; }
  if(claveNueva !== confirmar){ toast('Las claves no coinciden', true); return; }
  const res = await api('cambiar_clave_unificada', { claveActual, claveNueva });
  if(res===null) return;
  toast('Clave actualizada');
  cerrarSheet();
}

function cerrarSesionApp(){
  if(!confirm('¿Cerrar sesión en este dispositivo?')) return;
  safeSet('app_token', '');
  location.reload();
}

function abrirSelectorTema(){
  const actual = safeGet('temaApp') || 'dark';
  const html = `
    <div class="sheet-head"><h2>Estilo de la app</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <div class="field-line" style="cursor:pointer" onclick="cambiarTemaApp('dark')"><div class="fl-value">🌙 Oscuro</div>${actual==='dark'?'<span class="badge" style="background:rgba(111,207,151,.15);color:var(--green-ok)">Activo</span>':''}</div>
    <div class="field-line" style="cursor:pointer" onclick="cambiarTemaApp('light')"><div class="fl-value">☀️ Claro</div>${actual==='light'?'<span class="badge" style="background:rgba(111,207,151,.15);color:var(--green-ok)">Activo</span>':''}</div>
  `;
  abrirSheet(html);
}
function cambiarTemaApp(tema){
  document.documentElement.setAttribute('data-theme', tema);
  safeSet('temaApp', tema);
  cerrarSheet();
}
(function aplicarTemaGuardado(){
  document.documentElement.setAttribute('data-theme', safeGet('temaApp') || 'dark');
})();
</script>
</body>
</html>
