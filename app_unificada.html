<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mi Club</title>
<meta name="theme-color" content="#14231A">
<link rel="icon" href="/api/logo" type="image/png">
<link rel="apple-touch-icon" href="/api/logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script>
window._configClubPromise = fetch('/api/config').then(r=>r.json()).catch(()=>({onesignalAppId:null, iconoDeporte:'⚽'}));
window._iconoDeporteActual = '⚽';
window._configClubPromise.then(cfg => {
  window._iconoDeporteActual = cfg.iconoDeporte || '⚽';
  document.querySelectorAll('.ic-deporte').forEach(el => el.textContent = window._iconoDeporteActual);
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/OneSignalSDKWorker.js').catch(e => console.error('No se pudo registrar el Service Worker:', e));
}
</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    try {
      const cfg = await window._configClubPromise;
      if (cfg.onesignalAppId) await OneSignal.init({ appId: cfg.onesignalAppId });
    } catch (e) {
      console.error('No se pudo inicializar OneSignal:', e);
    }
  });
</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-0:#0E1712; --pitch-1:#14231A; --pitch-2:#1C2E20; --pitch-3:#28402F;
    --line:#33502F; --chalk:#E9EEE3; --chalk-dim:#9FB09A; --gold:#FFD23F; --gold-dim:#8C7A2A;
    --red:#E85D4C; --green-ok:#6FCF97; --radius:14px; --glow:#1A2C1F; --on-accent:#1A2A1D;
  }
  [data-theme="light"]{
    --pitch-0:#F7F9F5; --pitch-1:#FFFFFF; --pitch-2:#EEF2EA; --pitch-3:#E0E8DA;
    --line:#C9D6C2; --chalk:#16241A; --chalk-dim:#5A6B54; --gold:#C9971F; --gold-dim:#8C7A2A;
    --red:#C0392B; --green-ok:#2E9E5B; --glow:#E8ECE2; --on-accent:#FFFFFF;
  }
  /* Estilos del club (logo: azul, rojo, negro, blanco dominante) --
     se reutilizan las MISMAS variables de siempre (--gold sigue siendo
     "el color de acento"), solo cambia que color llevan en cada uno. */
  [data-theme="club-oscuro"]{
    --pitch-0:#0A0E18; --pitch-1:#10162A; --pitch-2:#171F38; --pitch-3:#212C4A;
    --line:#2E3B5C; --chalk:#F5F6FA; --chalk-dim:#A7AFC7; --gold:#D93A2E; --gold-dim:#8C2A22;
    --red:#E8453C; --green-ok:#4FBE82; --glow:#1C2748; --on-accent:#FFFFFF;
  }
  [data-theme="club-claro"]{
    --pitch-0:#FFFFFF; --pitch-1:#FFFFFF; --pitch-2:#F2F4F9; --pitch-3:#E4E9F4;
    --line:#CCD5E8; --chalk:#0E1730; --chalk-dim:#556085; --gold:#1B3F8B; --gold-dim:#122b60;
    --red:#C0392B; --green-ok:#2E9E5B; --glow:#E4E9F4; --on-accent:#FFFFFF;
  }
  [data-theme="club-contraste"]{
    --pitch-0:#0A0E18; --pitch-1:#10162A; --pitch-2:#171F38; --pitch-3:#212C4A;
    --line:#2E3B5C; --chalk:#F5F6FA; --chalk-dim:#A7AFC7; --gold:#2F5FD6; --gold-dim:#1E3E8C;
    --red:#E8453C; --green-ok:#4FBE82; --glow:#1C2748; --on-accent:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:radial-gradient(1200px 600px at 50% -10%, var(--glow) 0%, var(--pitch-1) 55%), var(--pitch-1);
    color:var(--chalk); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    height:100vh; height:100dvh; overflow:hidden;
  }
  #appRoot{ display:none; flex-direction:column; height:100vh; height:100dvh; }
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  header.top{ position:relative; flex-shrink:0; background:linear-gradient(180deg, var(--pitch-1) 70%, transparent); padding:18px 20px 14px; border-bottom:1px solid var(--line); }
  .btn-cambiar-contexto{ position:absolute; top:16px; right:16px; background:var(--pitch-3); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:12px; font-weight:600; color:var(--gold); cursor:pointer; }
  header.top h1{font-size:20px;margin:0;font-weight:600;color:var(--chalk);}
  header.top .sub{font-size:12px;color:var(--chalk-dim);margin-top:2px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;}
  .centerline{height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px, transparent 10px 18px);margin-top:12px;border-radius:2px;}
  main{flex:1;overflow-y:auto;padding:16px 16px 90px;-webkit-overflow-scrolling:touch;}
  .screen{display:none;animation:fade .25s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .card{background:var(--pitch-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .card-title h3{margin:0;font-size:18px;color:var(--chalk);}
  .meta{font-size:13px;color:var(--chalk-dim);line-height:1.6;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .badge.confirmando{background:rgba(111,207,151,.15);color:var(--green-ok);border:1px solid rgba(111,207,151,.3);}
  .badge.cancelado{background:rgba(232,93,76,.15);color:var(--red);border:1px solid rgba(232,93,76,.3);}
  .badge.finalizado{background:rgba(159,176,154,.15);color:var(--chalk-dim);border:1px solid var(--line);}
  .jugador-card,.grupo-card{background:var(--pitch-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;cursor:pointer;text-align:left;width:100%;}
  .ok-card{background:rgba(111,207,151,.12);border:1px solid rgba(111,207,151,.35);border-radius:14px;padding:14px;margin-bottom:12px;color:var(--green-ok);font-size:14px;}
  .alert-card{background:rgba(232,93,76,.12);border:1px solid rgba(232,93,76,.35);border-radius:14px;padding:14px;margin-bottom:12px;color:var(--red);font-size:14px;}
  .mens-card{border-radius:16px;padding:16px;margin-bottom:12px;border-width:2px;border-style:solid;}
  .mens-card .mens-icono{font-size:26px;line-height:1;}
  .mens-card .mens-titulo{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:4px 0 2px;}
  .mens-card .mens-detalle{font-size:13px;opacity:.9;}
  .mens-verde{background:rgba(79,190,130,.16);border-color:var(--green-ok);color:var(--green-ok);}
  .mens-amarilla{background:rgba(255,196,0,.16);border-color:#FFC400;color:#B58900;}
  [data-theme="dark"] .mens-amarilla, [data-theme="club-oscuro"] .mens-amarilla, [data-theme="club-contraste"] .mens-amarilla{color:#FFD54A;}
  .mens-roja{background:rgba(232,93,76,.18);border-color:var(--red);color:var(--red);}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .tabbar-scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
  .tabbar-scroll::-webkit-scrollbar{display:none;}
  .tabbar-scroll button{flex-shrink:0;}
  button{font-family:inherit;cursor:pointer;}
  button.block{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-weight:600;font-size:14px;}
  button.primary{background:var(--gold);border-color:var(--gold);color:var(--on-accent);}
  button.danger{background:rgba(232,93,76,.12);border-color:rgba(232,93,76,.35);color:var(--red);}
  button.danger-solido{background:var(--red);border-color:var(--red);color:#fff;}
  button.sm{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-size:13px;font-weight:600;flex-shrink:0;}
  button.sm.primary{background:var(--gold);border-color:var(--gold);color:var(--on-accent);}
  input,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-size:15px;margin-bottom:12px;font-family:inherit;}
  label{display:block;font-size:12px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;font-weight:600;}
  nav.tabs{ flex-shrink:0; display:flex; background:var(--pitch-1); border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom)); position:fixed; bottom:0; left:0; right:0; }
  nav.tabs button{ flex:1;background:none;border:none;color:var(--chalk-dim); display:flex;flex-direction:column;align-items:center;gap:3px; font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em; padding:6px 0;border-radius:10px; }
  nav.tabs button .ic{font-size:20px;}
  nav.tabs button.active{color:var(--gold);background:rgba(255,210,63,.08);}
  .empty{text-align:center;padding:48px 16px;color:var(--chalk-dim);}
  .empty .ic{font-size:40px;display:block;margin-bottom:10px;}
  .toast{ position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px); background:var(--pitch-3);border:1px solid var(--line);color:var(--chalk); padding:12px 18px;border-radius:12px;font-size:14px;z-index:100; opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center; }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:rgba(232,93,76,.9);border-color:var(--red);color:#fff;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;animation:fadeOv .2s ease;}
  @keyframes fadeOv{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--pitch-1);width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
  @media (min-width:900px){ .finanzas-grid-morosos{grid-template-columns:repeat(3,1fr) !important;} }
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .sheet-head h2{margin:0;font-size:20px;}
  .sheet-close{background:none;border:none;color:var(--chalk-dim);font-size:22px;padding:4px 8px;}
  .field-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .field-line:last-child{border-bottom:none;}
  .field-line .fl-label{font-size:14px;color:var(--chalk-dim);}
  .field-line .fl-value{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--chalk);}
  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .login-card{max-width:400px;margin:15vh auto 0;padding:0 24px;text-align:center;}
  .login-card .mark{font-size:48px;margin-bottom:10px;}

  /* Modo pantalla completa para la captura en vivo -- oculta encabezado
     y menu inferior para aprovechar cada pixel en el telefono. */
  body.modo-captura header.top, body.modo-captura nav.tabs{display:none;}
  body.modo-captura main{padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
  .cap-salir{position:sticky;top:0;z-index:5;background:var(--pitch-1);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}

  .cap-marcador{display:flex;justify-content:space-around;align-items:center;background:var(--pitch-2);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;}
  .cap-marcador .equipo{text-align:center;}
  .cap-marcador .equipo .etq{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;}
  .cap-marcador .equipo .pts{font-size:28px;font-weight:700;color:var(--gold);font-family:'Oswald',sans-serif;}

  .cap-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media (max-width:640px) and (orientation:portrait){ .cap-grid{grid-template-columns:1fr;} }

  .cap-panel{background:var(--pitch-2);border:1px solid var(--line);border-radius:10px;padding:8px;}
  .cap-panel-title{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}

  .cap-acciones{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .cap-btn-accion{background:var(--pitch-3);border:2px solid var(--line);border-radius:8px;color:var(--chalk);font-weight:700;font-size:14px;padding:12px 4px;text-align:center;}
  .cap-btn-accion.puntos{border-color:var(--green-ok);}
  .cap-btn-accion.falta{border-color:var(--red);color:var(--red);}
  .cap-btn-accion.activa{border-color:var(--gold);background:rgba(255,210,63,.12);color:var(--gold);}
  .cap-btn-rival{grid-column:span 2;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:2px;}
  .cap-btn-rival button{background:rgba(232,93,76,.12);border:2px solid rgba(232,93,76,.35);color:var(--red);border-radius:8px;font-weight:700;font-size:13px;padding:10px 2px;}

  .cap-jugadoras{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .cap-btn-jugadora{background:var(--pitch-3);border:2px solid var(--line);border-radius:8px;padding:8px 2px;text-align:center;}
  .cap-btn-jugadora .num{font-size:18px;font-weight:700;color:var(--gold);display:block;}

  /* Pantallas grandes (tablet/laptop): todo se agranda para aprovechar
     el espacio -- el esquema de celular (arriba) queda intacto como
     base, esto solo suma reglas por encima cuando hay lugar de sobra. */
  @media (min-width:900px){
    body.modo-captura main{max-width:1400px;margin:0 auto;padding-left:16px;padding-right:16px;}
    .cap-marcador{padding:16px;}
    .cap-marcador .equipo .etq{font-size:14px;}
    .cap-marcador .equipo .pts{font-size:44px;}
    .cap-panel{padding:16px;}
    .cap-panel-title{font-size:14px;margin-bottom:12px;}
    .cap-acciones{gap:10px;}
    .cap-btn-accion{font-size:20px;padding:24px 8px;border-radius:12px;}
    .cap-btn-rival{gap:10px;}
    .cap-btn-rival button{font-size:18px;padding:20px 4px;border-radius:12px;}
    .cap-jugadoras{grid-template-columns:repeat(4,1fr);gap:10px;}
    .cap-btn-jugadora{padding:18px 4px;border-radius:12px;}
    .cap-btn-jugadora .num{font-size:30px;}
    .cap-btn-jugadora .nom{font-size:14px;}
    .cap-log{font-size:14px;max-height:220px;}
  }
  @media (min-width:1300px){
    .cap-jugadoras{grid-template-columns:repeat(5,1fr);}
    .cap-btn-accion{font-size:22px;padding:28px 8px;}
    .cap-btn-jugadora .num{font-size:34px;}
  }
  .cap-btn-jugadora .nom{font-size:10px;color:var(--chalk-dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .cap-log{max-height:160px;overflow-y:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .cap-log-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);}
  .login-card h1{font-size:26px;margin:0 0 4px;}
  .login-card p{color:var(--chalk-dim);font-size:14px;margin-bottom:20px;}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="loginScreen">
  <div class="login-card">
    <div class="mark">🏟️</div>
    <h1>Mi Club</h1>
    <div id="loginCardContent">
      <p id="loginSubtitle">Ingresa tu cédula</p>
      <input type="tel" id="loginCedula" placeholder="Tu cédula" inputmode="numeric">
      <button class="primary block" onclick="intentarLogin()">Ingresar</button>
    </div>
  </div>
</div>

<div id="appRoot">
  <header class="top">
    <img src="/api/logo" alt="" style="width:28px;height:28px;border-radius:7px;vertical-align:middle;margin-right:8px" onerror="this.style.display='none'"><h1 id="saludoHeader" style="display:inline">Hola 👋</h1>
    <div class="sub" id="rolesHeader" onclick="abrirSelectorContextual()" style="cursor:pointer">CARGANDO...</div>
    <button class="btn-cambiar-contexto" id="btnCambiarContexto" style="display:none" onclick="abrirSelectorContextual()">Cambiar</button>
    <div class="centerline"></div>
  </header>

  <main>
    <div id="pantallasContainer"></div>
  </main>

  <nav class="tabs" id="navTabs"></nav>
</div>

<script>
function safeGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

let TOKEN = safeGet('app_token');
let SESION = null; // {roles, jugadorId, representanteId, entrenadorId, nombres, menu}
let pantallaActual = null;
const MAX_TABS_VISIBLES = 3; // el resto se agrupa en "Mas", igual que en Admin

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(()=>{ t.className='toast'; }, 2600);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Tarjeta de estado de mensualidad, mas dramatica segun el atraso:
// verde al dia, amarillo con 1 mes, rojo con 2 o mas.
function renderTarjetaMensualidad(mesesAtraso, deuda){
  if(mesesAtraso <= 0){
    return `<div class="mens-card mens-verde"><div class="mens-icono">✓</div><div class="mens-titulo">Al día</div><div class="mens-detalle">Tu mensualidad está al día.</div></div>`;
  }
  if(mesesAtraso === 1){
    return `<div class="mens-card mens-amarilla"><div class="mens-icono">⚠️</div><div class="mens-titulo">1 mes de atraso</div><div class="mens-detalle">Debes $${Number(deuda).toFixed(2)} de mensualidad.</div></div>`;
  }
  return `<div class="mens-card mens-roja"><div class="mens-icono">🚨</div><div class="mens-titulo">${mesesAtraso} meses de atraso</div><div class="mens-detalle">Debes $${Number(deuda).toFixed(2)} de mensualidad.</div></div>`;
}
function fechaCorta(f){
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const d = new Date(f);
  return dias[d.getUTCDay()]+' '+String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();
}
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const maxDim = 1280;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.65).split(',')[1]);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Version minima -- para comprobantes que solo son respaldo (no se
// necesita calidad de foto, solo que los numeros se puedan leer si
// hace falta revisar despues).
function fileToBase64Minimo(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const maxDim = 640;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.4).split(',')[1]);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function abrirSheet(html){
  cerrarSheet();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'sheetOverlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) cerrarSheet(); };
  overlay.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(overlay);
}
function cerrarSheet(){
  const el = document.getElementById('sheetOverlay');
  if(el) el.remove();
}

async function api(accion, extra){
  const body = Object.assign({ token: TOKEN, accion }, extra || {});
  try{
    const res = await fetch('/api/app_unificada', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });

    if(!data.success){ toast(data.error || 'Error', true); return null; }
    return data.data !== undefined ? data.data : true;
  }catch(e){
    toast('No se pudo conectar. Revisa tu internet.', true);
    return null;
  }
}

/* ---------- Login (cedula + clave, un solo flujo para cualquier rol) ---------- */
let cedulaLoginPendiente = '';
let claveTemporalPendiente = '';

async function intentarLogin(){
  const cedula = document.getElementById('loginCedula').value.trim();
  if(!cedula){ toast('Ingresa tu cédula', true); return; }
  const res = await api('login_unificado', { cedula });
  if(res===null) return;
  if(!res.registrado){
    toast('No encontramos esa cédula en el club. Consulta con el Admin.', true);
    return;
  }
  cedulaLoginPendiente = cedula;
  if(res.tieneClave) mostrarPantallaIngresarClave();
  else mostrarPantallaCrearClave();
}

function mostrarPantallaIngresarClave(){
  document.getElementById('loginCardContent').innerHTML = `
    <p>Ingresa tu clave de seguridad</p>
    <input type="password" id="loginClave" placeholder="Clave de 6 dígitos" inputmode="numeric" maxlength="6">
    <button class="primary block" onclick="verificarClaveLogin()">Ingresar</button>
    <button class="block" style="margin-top:8px" onclick="volverAIngresarCedula()">← Usar otra cédula</button>
  `;
}
function mostrarPantallaCrearClave(){
  document.getElementById('loginCardContent').innerHTML = `
    <p>Es tu primera vez aquí. Crea una clave de seguridad de 6 números — te va a servir para cualquiera de tus roles en el club.</p>
    <input type="password" id="loginClaveNueva" placeholder="Crea tu clave (6 dígitos)" inputmode="numeric" maxlength="6">
    <input type="password" id="loginClaveNuevaConfirmar" placeholder="Repite la clave" inputmode="numeric" maxlength="6">
    <button class="primary block" onclick="crearClaveLogin()">Crear clave y entrar</button>
    <button class="block" style="margin-top:8px" onclick="volverAIngresarCedula()">← Usar otra cédula</button>
  `;
}
function volverAIngresarCedula(){
  cedulaLoginPendiente = '';
  document.getElementById('loginCardContent').innerHTML = `
    <p id="loginSubtitle">Ingresa tu cédula</p>
    <input type="tel" id="loginCedula" placeholder="Tu cédula" inputmode="numeric">
    <button class="primary block" onclick="intentarLogin()">Ingresar</button>
  `;
}
async function crearClaveLogin(){
  const clave = document.getElementById('loginClaveNueva').value.trim();
  const confirmar = document.getElementById('loginClaveNuevaConfirmar').value.trim();
  if(!/^\d{6}$/.test(clave)){ toast('La clave debe ser de 6 números', true); return; }
  if(clave !== confirmar){ toast('Las claves no coinciden', true); return; }
  const res = await api('crear_clave_unificada', { cedula: cedulaLoginPendiente, clave });
  if(res===null) return;
  TOKEN = res.token;
  safeSet('app_token', TOKEN);
  await entrarApp(res.nombres);
}
async function verificarClaveLogin(){
  const clave = document.getElementById('loginClave').value.trim();
  if(!/^\d{6}$/.test(clave)){ toast('Ingresa los 6 dígitos de tu clave', true); return; }
  const res = await api('verificar_clave_unificada', { cedula: cedulaLoginPendiente, clave });
  if(res===null) return;
  if(res.debeCambiarClave){
    claveTemporalPendiente = clave;
    mostrarPantallaCambiarClaveObligatorio();
    return;
  }
  TOKEN = res.token;
  safeSet('app_token', TOKEN);
  await entrarApp(res.nombres);
}
function mostrarPantallaCambiarClaveObligatorio(){
  document.getElementById('loginCardContent').innerHTML = `
    <p>Esa era tu clave temporal. Ahora crea tu clave definitiva (6 números).</p>
    <input type="password" id="loginClaveDefinitiva" placeholder="Nueva clave (6 dígitos)" inputmode="numeric" maxlength="6">
    <input type="password" id="loginClaveDefinitivaConfirmar" placeholder="Repite la clave" inputmode="numeric" maxlength="6">
    <button class="primary block" onclick="confirmarCambioClaveObligatorio()">Guardar y entrar</button>
  `;
}
async function confirmarCambioClaveObligatorio(){
  const claveNueva = document.getElementById('loginClaveDefinitiva').value.trim();
  const confirmar = document.getElementById('loginClaveDefinitivaConfirmar').value.trim();
  if(!/^\d{6}$/.test(claveNueva)){ toast('La clave debe ser de 6 números', true); return; }
  if(claveNueva !== confirmar){ toast('Las claves no coinciden', true); return; }
  const login = await api('verificar_clave_unificada', { cedula: cedulaLoginPendiente, clave: claveTemporalPendiente });
  if(login===null) return;
  TOKEN = login.token;
  safeSet('app_token', TOKEN);
  const res = await api('cambiar_clave_unificada', { claveActual: claveTemporalPendiente, claveNueva });
  if(res===null) return;
  toast('¡Clave actualizada!');
  await entrarApp(login.nombres);
}

// Si el navegador restaura la pagina desde su cache interno (al usar
// "atras" del telefono), event.persisted viene en true -- en ese caso
// se recarga la pantalla actual para no mostrar datos congelados de
// antes de guardar algun cambio.
window.addEventListener('pageshow', function(event){

    cambiarPantalla(pantallaActual);
  }
});

if(TOKEN){
  api('obtener_sesion_y_menu').then(res=>{
    if(res!==null && res.roles.length>0){ entrarApp(res.nombres, res); }
    else if(res!==null){ safeSet('app_token',''); TOKEN=''; }
  });
}

<script>
const ETIQUETAS_ROL_HEADER = {jugador:'Jugador', representante:'Representante', entrenador:'Entrenador', director:'Director'};

async function entrarApp(nombresLogin, sesionPrecargada){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appRoot').style.display='flex';
  if(nombresLogin) document.getElementById('saludoHeader').textContent = 'Hola, ' + nombresLogin.split(' ')[0] + ' 👋';

  const data = sesionPrecargada || await api('obtener_sesion_y_menu');
  if(data===null) return;
  SESION = data;
  if(data.jugadorToken) safeSet('rt_jugador', data.jugadorToken);
  if(data.representanteToken) safeSet('rt_representante', data.representanteToken);
  if(data.entrenadorToken) safeSet('rt_entrenador', data.entrenadorToken);

  document.getElementById('rolesHeader').textContent = data.roles.map(r=>ETIQUETAS_ROL_HEADER[r]||r).join(' · ');

  // OneSignal: un tag por cada rol que la persona tenga -- todos en
  // la MISMA suscripcion, porque ahora es una sola app instalada.
  if(window.OneSignalDeferred){
    OneSignalDeferred.push(async function(OneSignal){
      try{
        const tags = {};
        if(data.jugadorId) tags.jugador_id = String(data.jugadorId);
        if(data.representanteId) tags.representante_id = String(data.representanteId);
        if(data.entrenadorId) tags.entrenador_id = String(data.entrenadorId);
        if(data.planilleroId) tags.planillero_id = String(data.planilleroId);
        if(data.financieroId) tags.financiero_id = String(data.financieroId);
        for(const k of Object.keys(tags)) await OneSignal.User.addTag(k, tags[k]);
        const yaSuscrito = await yaHaySuscripcionRealApp(OneSignal);
        if(!yaSuscrito && typeof Notification !== 'undefined' && Notification.permission === 'granted'){
          await OneSignal.User.PushSubscription.optIn();
        }
      }catch(e){}
    });
  }

  construirMenu(data.menu);

  // Si se llego con un enlace directo desde el Admin (?partido=123)
  // para tomar estadisticas, y la persona tiene el rol adecuado, se
  // salta directo a la captura de ese partido.
  const params = new URLSearchParams(location.search);
  const partidoLink = params.get('partido');
  if(partidoLink && data.roles.some(r=>r==='planillero' || r==='director')){
    safeSet('planillero_partido_actual', partidoLink);
    cambiarPantalla('captura_estadisticas_planillero');
    return;
  }

  if(data.menu.length>0) cambiarPantalla(data.menu[0].clave);
}

function construirMenu(menu){
  const nav = document.getElementById('navTabs');
  const principales = menu.slice(0, MAX_TABS_VISIBLES);
  const enMas = menu.slice(MAX_TABS_VISIBLES);

  let html = principales.map(p=>`
    <button data-clave="${p.clave}" onclick="cambiarPantalla('${p.clave}')"><span class="ic">${p.icono}</span>${esc(p.etiqueta)}</button>
  `).join('');

  if(enMas.length>0){
    html += `<button id="btnTabMas" onclick="abrirMenuMas(${JSON.stringify(enMas).replace(/"/g,'&quot;')})"><span class="ic">⋯</span>Más</button>`;
  }
  nav.innerHTML = html;
}

function abrirMenuMas(items){
  const html = `
    <div class="sheet-head"><h2>Más opciones</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    ${items.map(p=>`
      <button class="block" style="text-align:left;margin-bottom:8px" onclick="cerrarSheet(); cambiarPantalla('${p.clave}')">${p.icono} ${esc(p.etiqueta)}</button>
    `).join('')}
  `;
  abrirSheet(html);
}

// Llamadas a los backends ORIGINALES de cada app, reutilizando su
// logica completa via el token de rol generado en el login unificado.
async function apiRol(endpoint, tokenKey, accion, extra){
  const body = Object.assign({ token: safeGet(tokenKey), accion }, extra || {});
  try{
    const res = await fetch('/api/'+endpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if(!data.success){ toast(data.error || 'Error', true); return null; }
    return data.data !== undefined ? data.data : true;
  }catch(e){
    toast('No se pudo conectar. Revisa tu internet.', true);
    return null;
  }
}
const apiEnt = (accion, extra) => apiRol('entrenador', 'rt_entrenador', accion, extra);
const apiJug = (accion, extra) => apiRol('jugador', 'rt_jugador', accion, extra);
const apiRep = (accion, extra) => {
  const body = Object.assign({}, extra || {});
  if(JUGADOR_ACTUAL && !('jugadorId' in body)) body.jugadorId = JUGADOR_ACTUAL.id;
  return apiRol('representante', 'rt_representante', accion, body);
};

function cambiarPantalla(clave){
  pantallaActual = clave;
  document.body.classList.remove('modo-captura');
  document.querySelectorAll('nav.tabs button[data-clave]').forEach(b=>b.classList.toggle('active', b.dataset.clave===clave));
  const enMas = SESION.menu.slice(MAX_TABS_VISIBLES).some(p=>p.clave===clave);
  const btnMas = document.getElementById('btnTabMas');
  if(btnMas) btnMas.classList.toggle('active', enMas);

  const cont = document.getElementById('pantallasContainer');
  cont.innerHTML = '<div class="spinner"></div>';

  // Router: cada clave del catalogo tiene su propia funcion de carga.
  // Si todavia no esta implementada, se avisa claramente en vez de
  // fallar en silencio -- asi queda listo para irse llenando pantalla
  // por pantalla sin tocar el resto del sistema.
  const renderizadores = {
    'perfil': cargarPantallaPerfil,
    'mi_grupo_entrenador': cargarPantallaMiGrupo,
    'indicadores_director': cargarPantallaIndicadores,
    'partidos_representante': cargarPantallaPartidosRep,
    'cuenta_representante': cargarPantallaCuentaRep,
    'eventos_representante': cargarPantallaEventosRep,
    'novedades_representante': cargarPantallaNovedadesRep,
    'editar_representado_representante': cargarPantallaEditarRepresentado,
    'mis_partidos_jugador': cargarPantallaPartidosJug,
    'mi_cuenta_jugador': cargarPantallaCuentaJug,
    'eventos_jugador': cargarPantallaEventosJug,
    'captura_estadisticas_planillero': cargarPantallaCapturaPlanillero,
    'dashboard_financiero': cargarPantallaDashboardFinanciero,
    'movimientos_financiero': cargarPantallaMovimientosFinanciero,
    'rubros_financiero': cargarPantallaRubrosFinanciero,
    'horario_entrenador': cargarPantallaHorarioEntrenador,
    'calendario_entrenador': cargarPantallaCalendarioEntrenador,
  };
  const fn = renderizadores[clave];
  if(fn) fn(cont);
  else cont.innerHTML = `<div class="empty"><span class="ic">🚧</span>Esta pantalla ("${esc(clave)}") todavía no se portó a la app unificada.<br><br>Sigue funcionando con normalidad en su app original mientras se completa la migración.</div>`;
}
</script>
<script>
/* ---------- Perfil (unica pantalla compartida entre roles) ---------- */
async function cargarPantallaPerfil(cont){
  const perfil = await api('obtener_perfil_unificado');
  if(perfil===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }

      <div class="card-title"><h3>Mis datos</h3></div>

      <label>Apellidos</label>
      <input id="perfilApellidos" value="${esc(perfil.apellidos||'')}">
      <label>Teléfono</label>
      <input id="perfilTelefono" type="tel" value="${esc(perfil.telefono||'')}">
      <button class="primary block" style="margin-top:10px" onclick="guardarPerfil()">Guardar</button>
    </div>
    <div class="card">
      <div class="card-title"><h3>Tus roles en el club</h3></div>
      <div class="meta">${perfil.roles.map(r=>ETIQUETAS_ROL_HEADER[r]||r).join(' · ')}</div>
    </div>
    ${perfil.roles.includes('jugador') && perfil.representantesHabilitado ? '<button class="block" onclick="abrirMisRepresentantesApp()">📇 Mis representantes</button>' : ''}
    <div class="card" id="pushCardApp">
      <div class="card-title"><h3>🔔 Notificaciones</h3></div>
      <p class="meta" id="pushEstadoTextoApp">Revisando el estado...</p>
      <button class="primary block" id="pushBtnApp" style="margin-top:10px;display:none" onclick="activarNotificacionesApp()">Activar notificaciones</button>
    </div>
    <button class="block" onclick="abrirSelectorTema()">🎨 Estilo de la app</button>
    <button class="block" onclick="abrirCambiarClave()">🔒 Cambiar mi clave de seguridad</button>
    <button class="block danger" onclick="cerrarSesionApp()">Cerrar sesión en este dispositivo</button>
  `;
  actualizarEstadoPushApp();
}

/* ---------- Notificaciones push (OneSignal) -- portado de las apps originales ---------- */
function esInstaladaComoAppUnif(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function esIOSUnif(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}
async function yaHaySuscripcionRealApp(OneSignal){
  try{ if(OneSignal.User.PushSubscription.optedIn === true) return true; }catch(e){}
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    return !!sub;
  }catch(e){ return false; }
}

function tagsDeMisRoles(){
  const tags = {};
  if(SESION.jugadorId) tags.jugador_id = String(SESION.jugadorId);
  if(SESION.representanteId) tags.representante_id = String(SESION.representanteId);
  if(SESION.entrenadorId) tags.entrenador_id = String(SESION.entrenadorId);
  if(SESION.planilleroId) tags.planillero_id = String(SESION.planilleroId);
  if(SESION.financieroId) tags.financiero_id = String(SESION.financieroId);
  return tags;
}

async function actualizarEstadoPushApp(){
  const textoEl = document.getElementById('pushEstadoTextoApp');
  const btnEl = document.getElementById('pushBtnApp');
  if(!textoEl) return;

  if(esIOSUnif() && !esInstaladaComoAppUnif()){
    textoEl.innerHTML = '📲 En iPhone, primero debes agregar esta página a tu pantalla de inicio para poder recibir notificaciones: toca el botón <b>Compartir</b> en Safari y luego <b>"Agregar a inicio"</b>. Después, abre la app desde ese ícono y vuelve aquí.';
    btnEl.style.display = 'none';
    return;
  }
  if(!('Notification' in window)){
    textoEl.textContent = 'Tu navegador no soporta notificaciones push.';
    btnEl.style.display = 'none';
    return;
  }
  if(Notification.permission === 'denied'){
    textoEl.textContent = '🚫 Bloqueaste las notificaciones para esta app. Para activarlas, entra a la configuración de tu navegador para este sitio y permite las notificaciones.';
    btnEl.style.display = 'none';
    return;
  }
  if(Notification.permission !== 'granted'){
    textoEl.textContent = 'Activa las notificaciones para enterarte al instante de pagos, novedades y confirmaciones, sin tener que estar revisando la app.';
    btnEl.style.display = 'block';
    btnEl.textContent = 'Activar notificaciones';
    return;
  }
  if(window.OneSignalDeferred){
    OneSignalDeferred.push(async function(OneSignal){
      if(!OneSignal.User){
        textoEl.textContent = '⚠️ No se pudo conectar con el sistema de notificaciones. Avísale al administrador del club.';
        btnEl.style.display = 'none';
        return;
      }
      const optedIn = await yaHaySuscripcionRealApp(OneSignal);
      if(optedIn){
        textoEl.textContent = '✓ Las notificaciones están activadas.';
        btnEl.style.display = 'none';
      } else {
        textoEl.textContent = '⚠️ Tu navegador permite notificaciones, pero la suscripción todavía no quedó activa del lado del servidor. Toca el botón para completarla.';
        btnEl.style.display = 'block';
        btnEl.textContent = 'Reactivar notificaciones';
      }
    });
  }
}

async function activarNotificacionesApp(){
  if(typeof Notification === 'undefined'){ toast('Tu navegador no soporta notificaciones', true); return; }
  const permiso = await Notification.requestPermission();
  if(permiso !== 'granted'){
    toast('Permiso denegado por el navegador', true);
    actualizarEstadoPushApp();
    return;
  }
  if(!window.OneSignalDeferred){ toast('No se pudo cargar el sistema', true); return; }
  OneSignalDeferred.push(async function(OneSignal){
    if(!OneSignal.User){
      toast('No se pudo conectar con el sistema de notificaciones. Avísale al administrador del club.', true);
      return;
    }
    try{
      const tags = tagsDeMisRoles();
      for(const k of Object.keys(tags)) await OneSignal.User.addTag(k, tags[k]);
      // A diferencia del registro automatico al entrar, aqui la persona
      // pidio activar explicitamente -- se fuerza optIn() siempre, sin
      // preguntar antes si "ya hay suscripcion", porque justo en la
      // transicion navegador->PWA instalada el navegador puede reportar
      // una suscripcion vieja que OneSignal ya invalido de su lado,
      // haciendo que el chequeo previo diera un falso positivo y nunca
      // se llamara a optIn() de verdad. optIn() no hace dano si ya
      // estaba suscrito, asi que aqui siempre se llama.
      await OneSignal.User.PushSubscription.optIn();
      toast('¡Notificaciones activadas correctamente!');
      actualizarEstadoPushApp();
    }catch(e){
      console.error('Detalle completo del error:', e);
      toast('No se pudo completar. Avísale al administrador del club.', true);
      actualizarEstadoPushApp();
    }
  });
}

async function diagnosticoOneSignalApp(){
  const lineas = [];
  lineas.push('Notification.permission: ' + (typeof Notification !== 'undefined' ? Notification.permission : 'API no disponible'));
  try{
    const regs = await navigator.serviceWorker.getRegistrations();
    lineas.push('Service Workers registrados: ' + regs.length);
    regs.forEach((r,i)=>{ lineas.push(`  [${i}] scope=${r.scope} script=${r.active ? r.active.scriptURL : '(sin worker activo)'}`); });
  }catch(e){ lineas.push('Error leyendo Service Workers: ' + e.message); }

  if(!window.OneSignalDeferred){
    lineas.push('window.OneSignalDeferred NO existe (el script de OneSignal no cargó).');
    mostrarDiagnosticoApp(lineas);
    return;
  }
  OneSignalDeferred.push(async function(OneSignal){
    lineas.push('OneSignal.User existe: ' + (!!OneSignal.User));
    if(OneSignal.User){
      try{ lineas.push('OneSignal.User.onesignalId: ' + OneSignal.User.onesignalId); }catch(e){ lineas.push('onesignalId: error ' + e.message); }
      try{ lineas.push('OneSignal.User.externalId: ' + (OneSignal.User.externalId || '(vacío)')); }catch(e){ lineas.push('externalId: error ' + e.message); }
      try{ lineas.push('PushSubscription.id: ' + (OneSignal.User.PushSubscription.id || '(sin ID)')); }catch(e){ lineas.push('Subscription.id: error ' + e.message); }
      try{ lineas.push('PushSubscription.token: ' + (OneSignal.User.PushSubscription.token ? 'presente (' + OneSignal.User.PushSubscription.token.slice(0,20) + '...)' : '(sin token)')); }catch(e){ lineas.push('Subscription.token: error ' + e.message); }
      try{ lineas.push('PushSubscription.optedIn: ' + OneSignal.User.PushSubscription.optedIn); }catch(e){ lineas.push('optedIn: error ' + e.message); }
    }
    lineas.push('Tags esperados por mis roles: ' + JSON.stringify(tagsDeMisRoles()));
    mostrarDiagnosticoApp(lineas);
  });
}

function mostrarDiagnosticoApp(lineas){
  const html = `
    <div class="sheet-head"><h2>Diagnóstico OneSignal</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;white-space:pre-wrap;background:var(--pitch-2);border-radius:10px;padding:12px;line-height:1.6">${esc(lineas.join('\n'))}</div>
    <button class="block" style="margin-top:12px" onclick="copiarDiagnosticoApp(this)">📋 Copiar todo</button>
  `;
  abrirSheet(html);
  window._diagnosticoTextoApp = lineas.join('\n');
}

function copiarDiagnosticoApp(btn){
  navigator.clipboard.writeText(window._diagnosticoTextoApp || '').then(()=>{ btn.textContent = '✓ Copiado'; }).catch(()=>{ toast('No se pudo copiar', true); });
}

        </div>

async function guardarPerfil(){

function actualizarHeaderGrupo(){
  if(!GRUPO_ACTUAL) return;

  const data = await apiEnt('listar_mis_grupos_entrenador');
  if(data===null) return;
  MIS_GRUPOS = data.grupos;

          <div class="fl-label">${h.horaInicio ? h.horaInicio.slice(0,5) : '—'}${h.horaFin ? ' - '+h.horaFin.slice(0,5) : ''} ${h.lugar ? '· 📍 '+esc(h.lugar) : ''}</div>

      <div class="card-title"><h3>👤 Jugadores (${data.jugadores.length})</h3></div>
      ${data.jugadores.length===0 ? '<p style="color:var(--chalk-dim);font-size:13px">Sin jugadores en este grupo todavía.</p>' : data.jugadores.map(j=>`
        <div class="field-line" style="cursor:pointer" onclick="verHistorialJugador(${j.id}, ${JSON.stringify(j.nombres+' '+j.apellidos).replace(/"/g,'&quot;')})">

/* ---------- Asistencia y rutina ---------- */
let sesionActual = null;
let fechaSesionActual = '';

function hoyIso(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function abrirTomarAsistencia(fecha){
  fechaSesionActual = fecha || hoyIso();
  const data = await apiEnt('obtener_o_crear_sesion_dia_entrenador', {grupoId: GRUPO_ACTUAL.id, fecha: fechaSesionActual});
  if(data===null) return;
  sesionActual = data.sesion;
  mostrarTomarAsistencia(data.jugadores);
}

function mostrarTomarAsistencia(jugadores){
  const html = `
    <div class="sheet-head"><h2>Asistencia</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <label>Fecha</label>
    <input type="date" id="asistenciaFecha" value="${fechaSesionActual}" onchange="cambiarFechaAsistencia()">
    <div class="card">
      <div class="card-title"><h3>Jugadores</h3></div>
      ${jugadores.map(j=>`
        <div class="field-line">
          <div class="fl-value">${esc(j.nombres)} ${esc(j.apellidos)}</div>
          <div style="display:flex;gap:6px">
            <button class="sm ${j.asistio===true?'primary':''}" data-jugador="${j.id}" data-valor="true" onclick="marcarAsistencia(${j.id}, true, this)">✓ Vino</button>
            <button class="sm ${j.asistio===false?'danger-solido':''}" data-jugador="${j.id}" data-valor="false" onclick="marcarAsistencia(${j.id}, false, this)">✕ Faltó</button>
          </div>
        </div>
      `).join('')}
    </div>
    <label>Rutina de hoy</label>
    <textarea id="sesionRutina" rows="3" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-family:inherit;font-size:14px">${esc(sesionActual.rutina||'')}</textarea>
    <label style="margin-top:10px">Notas (opcional)</label>
    <textarea id="sesionNotas" rows="2" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-family:inherit;font-size:14px">${esc(sesionActual.notas||'')}</textarea>
    <button class="primary block" id="btnGuardarSesion" style="margin-top:14px" onclick="guardarAsistenciaYRutina()">Guardar</button>
  `;
  abrirSheet(html);
  window._asistenciaTemp = {};
  jugadores.forEach(j => { window._asistenciaTemp[j.id] = { asistio: j.asistio, justificacion: j.justificacion }; });
}

function marcarAsistencia(jugadorId, valor, btnEl){
  window._asistenciaTemp[jugadorId] = window._asistenciaTemp[jugadorId] || {};
  const actual = window._asistenciaTemp[jugadorId].asistio;
  // Tocar el mismo boton que ya estaba marcado lo desmarca (por si hace
  // falta dar mas tiempo de llegada, o corregir una seleccion sin
  // tener que forzar la otra opcion).
  const nuevoValor = (actual === valor) ? null : valor;
  window._asistenciaTemp[jugadorId].asistio = nuevoValor;
  const fila = btnEl.parentElement;
  fila.querySelectorAll('button').forEach(b=>{
    b.classList.remove('primary','danger-solido');
    if(b.dataset.valor==='true' && nuevoValor===true) b.classList.add('primary');
    if(b.dataset.valor==='false' && nuevoValor===false) b.classList.add('danger-solido');
  });
}

async function cambiarFechaAsistencia(){
  const nuevaFecha = document.getElementById('asistenciaFecha').value;
  if(!nuevaFecha) return;
  await abrirTomarAsistencia(nuevaFecha);
}

async function guardarAsistenciaYRutina(){
  const btn = document.getElementById('btnGuardarSesion');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  const rutina = document.getElementById('sesionRutina').value.trim();
  const notas = document.getElementById('sesionNotas').value.trim();
  const asistencias = Object.entries(window._asistenciaTemp)
    .filter(([jugadorId, v]) => v.asistio === true || v.asistio === false)
    .map(([jugadorId, v])=>({
      jugadorId: parseInt(jugadorId), asistio: v.asistio, justificacion: v.justificacion || null,
    }));
  const res = await apiEnt('guardar_sesion_entrenamiento_entrenador', {sesionId: sesionActual.id, rutina, notas, asistencias});
  if(res===null){ btn.disabled = false; btn.textContent = 'Guardar'; return; }
  toast('Asistencia guardada');
  cerrarSheet();
}

      <div class="row-actions" style="margin-bottom:12px">
        ${p.tieneFotoEquipo ? `<button class="sm" onclick="verFotoPartidoEnt(${p.id}, 'equipo')">📷 Foto del equipo</button>` : ''}
        ${p.tieneFotoPlanilla ? `<button class="sm" onclick="verFotoPartidoEnt(${p.id}, 'planilla')">📋 Planilla de control</button>` : ''}
      </div>
    ` : ''}
    ${equipoStats.length>0 ? `
      <div class="card">
        <div class="card-title"><h3>Estadísticas del equipo</h3></div>
        ${equipoStats.map(v=>`<div class="field-line"><div class="fl-label">${esc(v.nombre)}</div><div class="fl-value">${v.valor}</div></div>`).join('')}
      </div>
    ` : ''}
    ${jugadorStats.length>0 ? `
      <div class="card">
        <div class="card-title"><h3>Estadísticas por jugador</h3></div>
        ${jugadorStats.map(([nombre, stats])=>`
          <div style="padding:8px 0;border-bottom:1px solid var(--line)">
            <div class="fl-value" style="margin-bottom:4px">${esc(nombre)}</div>
            <div style="color:var(--chalk-dim);font-size:13px">${stats.map(s=>esc(s.nombre)+': '+s.valor).join(' · ')}</div>
          </div>
        `).join('')}
      </div>
    ` : ''}
    ${p.notas ? `<div class="card"><div class="card-title"><h3>Notas</h3></div><p style="font-size:14px;color:var(--chalk-dim);white-space:pre-wrap">${esc(p.notas)}</p></div>` : ''}
    ${equipoStats.length===0 && jugadorStats.length===0 && p.marcador_propio===null ? '<p style="color:var(--chalk-dim);font-size:13px">Todavía no hay estadísticas cargadas para este partido.</p>' : ''}
  `;
  abrirSheet(html);
}

async function verFotoPartidoEnt(partidoId, tipo){
  const res = await apiEnt('ver_foto_partido_entrenador', {partidoId, tipo});
  if(res===null) return;
  if(!res.foto){ toast('No hay foto', true); return; }
  const html = `
    <div class="sheet-head"><h2>${tipo==='planilla'?'Planilla de control':'Foto del equipo'}</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <img src="data:image/jpeg;base64,${res.foto}" style="width:100%;border-radius:12px">
  `;
  abrirSheet(html);
}

async function cargarPantallaIndicadores(cont){
  cont.innerHTML = '<div class="spinner"></div>';
  const data = await apiEnt('obtener_indicadores_generales_entrenador');
  if(data===null){ cont.innerHTML = '<div class="empty">❌ No se pudo cargar. Desliza para reintentar.</div>'; return; }
  const pctMorosos = data.totalJugadoresClub>0 ? Math.round(data.totalMorososClub/data.totalJugadoresClub*100) : 0;
  cont.innerHTML = `
    <div class="card">
      <div class="card-title"><h3>Club completo</h3></div>
      <div class="field-line"><div class="fl-label">Jugadores activos</div><div class="fl-value">${data.totalJugadoresClub}</div></div>
      <div class="field-line"><div class="fl-label">Morosos</div><div class="fl-value" style="color:${data.totalMorososClub>0?'var(--red)':'var(--green-ok)'}">${data.totalMorososClub} (${pctMorosos}%)</div></div>
    </div>
    <p style="color:var(--chalk-dim);font-size:13px;margin:14px 0 6px">Por grupo</p>
    ${data.grupos.map(g=>{
      const pctG = g.totalJugadores>0 ? Math.round(g.morosos/g.totalJugadores*100) : 0;
      return `
      <div class="card">
        <div class="card-title"><h3>${esc(g.nombre)}</h3></div>
        <div class="field-line"><div class="fl-label">Jugadores</div><div class="fl-value">${g.totalJugadores}</div></div>
        <div class="field-line"><div class="fl-label">Morosos</div><div class="fl-value" style="color:${g.morosos>0?'var(--red)':'var(--green-ok)'}">${g.morosos} (${pctG}%)</div></div>
        <div class="field-line"><div class="fl-label">Asistencia este mes</div><div class="fl-value">${g.asistenciaPromedioMes!==null ? g.asistenciaPromedioMes+'%' : '—'}</div></div>
      </div>
    `;}).join('')}
  `;
}


/* ---------- Representante: Partidos, Cuenta, Eventos, Novedades (portado de representante/index.html) ---------- */
let MIS_JUGADORES = [];
let JUGADOR_ACTUAL = null;
let MIS_JUGADORES_CARGADOS = false;

async function cargarJugadoresRepApp(){
  const data = await apiRep('listar_mis_jugadores_representante');
  if(data===null) return;
  MIS_JUGADORES = data;
  MIS_JUGADORES_CARGADOS = true;
  if(MIS_JUGADORES.length>0){
    const ultimoId = parseInt(safeGet('representante_jugador_actual') || '0');
    JUGADOR_ACTUAL = MIS_JUGADORES.find(j=>j.id===ultimoId) || MIS_JUGADORES[0];
  }
}

function actualizarHeaderJugador(){
  if(!JUGADOR_ACTUAL) return;
  const el = document.getElementById('rolesHeader');
  if(el) el.textContent = SESION.roles.map(r=>({jugador:'Jugador',representante:'Representante',entrenador:'Entrenador',director:'Director'}[r]||r)).join(' · ') + ' · Viendo: ' + JUGADOR_ACTUAL.nombres.toUpperCase();
  const btn = document.getElementById('btnCambiarContexto');
  if(btn) btn.style.display = MIS_JUGADORES.length>1 ? 'block' : 'none';
}

function abrirSelectorContextual(){
  // El encabezado es clickeable y decide que selector abrir segun el
  // contexto: si hay mas de un jugador vinculado (representante) o mas
  // de un grupo asignado (entrenador). Si no aplica ninguno, no hace nada.
  if(MIS_JUGADORES_CARGADOS && MIS_JUGADORES.length>1){ abrirSelectorJugador(false); return; }
  if(typeof MIS_GRUPOS_CARGADOS !== 'undefined' && MIS_GRUPOS_CARGADOS && MIS_GRUPOS.length>1){ abrirSelectorGrupo(false); return; }
}

function abrirSelectorJugador(primeraVez){
  const html = `
    <div class="sheet-head"><h2>${primeraVez ? '¿A quién quieres ver?' : 'Cambiar de jugador'}</h2>${primeraVez ? '' : '<button class="sheet-close" onclick="cerrarSheet()">✕</button>'}</div>
    ${MIS_JUGADORES.map(j=>`
      <button class="jugador-card" onclick="seleccionarJugador(${j.id})">
        <div style="font-weight:700;font-size:16px">${esc(j.nombres)} ${esc(j.apellidos)}</div>
        <div style="color:var(--chalk-dim);font-size:13px;margin-top:2px">${j.descripcion ? esc(j.descripcion) + ' · ' : ''}${j.estado==='activo' ? 'Activo' : esc(j.estado)}</div>
      </button>
    `).join('')}
  `;
  abrirSheet(html);
}

function seleccionarJugador(jugadorId){
  JUGADOR_ACTUAL = MIS_JUGADORES.find(j=>j.id===jugadorId);
  safeSet('representante_jugador_actual', String(jugadorId));
  actualizarHeaderJugador();
  cerrarSheet();
  // Recargar la pestaña activa con los datos del jugador nuevo.
  cambiarPantalla(pantallaActual);
}
