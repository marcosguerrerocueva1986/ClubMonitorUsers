<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mi Club - Entrenadores</title>
<meta name="theme-color" content="#14231A">
<link rel="manifest" href="/entrenador-manifest.json">
<link rel="icon" href="/api/logo?badge=entrenador" type="image/png">
<link rel="apple-touch-icon" href="/api/logo?badge=entrenador">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script>
window._configClubPromise = fetch('/api/config').then(r=>r.json()).catch(()=>({iconoDeporte:'⚽'}));
window._iconoDeporteActual = '⚽';
window._configClubPromise.then(cfg => {
  window._iconoDeporteActual = cfg.iconoDeporte || '⚽';
  document.querySelectorAll('.ic-deporte').forEach(el => el.textContent = window._iconoDeporteActual);
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/OneSignalSDKWorker.js').catch(e => console.error('No se pudo registrar el Service Worker:', e));
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-0:#0E1712; --pitch-1:#14231A; --pitch-2:#1C2E20; --pitch-3:#28402F;
    --line:#33502F; --chalk:#E9EEE3; --chalk-dim:#9FB09A; --gold:#FFD23F; --gold-dim:#8C7A2A;
    --red:#E85D4C; --green-ok:#6FCF97; --radius:14px;
  }
  [data-theme="light"]{
    --pitch-0:#F7F9F5; --pitch-1:#FFFFFF; --pitch-2:#EEF2EA; --pitch-3:#E0E8DA;
    --line:#C9D6C2; --chalk:#16241A; --chalk-dim:#5A6B54; --gold:#C9971F; --gold-dim:#8C7A2A;
    --red:#C0392B; --green-ok:#2E9E5B;
  }
  [data-theme="light"] body{ background: var(--pitch-0); }
  [data-theme="dark"] body, :root:not([data-theme]) body{ background:radial-gradient(1200px 600px at 50% -10%, #1A2C1F 0%, var(--pitch-1) 55%), var(--pitch-1); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:radial-gradient(1200px 600px at 50% -10%, #1A2C1F 0%, var(--pitch-1) 55%), var(--pitch-1);
    color:var(--chalk); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    height:100vh; height:100dvh; overflow:hidden;
  }
  #appRoot{ display:none; flex-direction:column; height:100vh; height:100dvh; }
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header.top{ flex-shrink:0; background:linear-gradient(180deg, var(--pitch-1) 70%, transparent); padding:18px 20px 14px; border-bottom:1px solid var(--line); }
  header.top h1{font-size:20px;margin:0;font-weight:600;color:var(--chalk);}
  header.top .sub{font-size:12px;color:var(--chalk-dim);margin-top:2px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;cursor:pointer;}
  .centerline{height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px, transparent 10px 18px);margin-top:12px;border-radius:2px;}
  main{flex:1;overflow-y:auto;padding:16px 16px 90px;-webkit-overflow-scrolling:touch;}
  .screen{display:none;animation:fade .25s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .card{background:var(--pitch-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .card-title h3{margin:0;font-size:18px;color:var(--chalk);}
  .meta{font-size:13px;color:var(--chalk-dim);line-height:1.6;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .badge.confirmando{background:rgba(111,207,151,.15);color:var(--green-ok);border:1px solid rgba(111,207,151,.3);}
  .badge.cancelado{background:rgba(232,93,76,.15);color:var(--red);border:1px solid rgba(232,93,76,.3);}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .tabbar-scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
  .tabbar-scroll::-webkit-scrollbar{display:none;}
  .tabbar-scroll button{flex-shrink:0;}
  button{font-family:inherit;cursor:pointer;}
  button.block{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-weight:600;font-size:14px;}
  button.primary{background:var(--gold);border-color:var(--gold);color:#1A2A1D;}
  button.danger{background:rgba(232,93,76,.12);border-color:rgba(232,93,76,.35);color:var(--red);}
  button.sm{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-size:13px;font-weight:600;flex-shrink:0;}
  button.sm.primary{background:var(--gold);border-color:var(--gold);color:#1A2A1D;}
  button.sm.danger{background:rgba(232,93,76,.12);border-color:rgba(232,93,76,.35);color:var(--red);}
  input,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-size:15px;margin-bottom:12px;font-family:inherit;}
  label{display:block;font-size:12px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;font-weight:600;}
  nav.tabs{ flex-shrink:0; display:flex; background:var(--pitch-1); border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom)); position:fixed; bottom:0; left:0; right:0; }
  nav.tabs button{ flex:1;background:none;border:none;color:var(--chalk-dim); display:flex;flex-direction:column;align-items:center;gap:3px; font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em; padding:6px 0;border-radius:10px; }
  nav.tabs button .ic{font-size:20px;}
  nav.tabs button.active{color:var(--gold);background:rgba(255,210,63,.08);}
  .empty{text-align:center;padding:48px 16px;color:var(--chalk-dim);}
  .empty .ic{font-size:40px;display:block;margin-bottom:10px;}
  .toast{ position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px); background:var(--pitch-3);border:1px solid var(--line);color:var(--chalk); padding:12px 18px;border-radius:12px;font-size:14px;z-index:100; opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center; }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:rgba(232,93,76,.9);border-color:var(--red);color:#fff;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;animation:fadeOv .2s ease;}
  @keyframes fadeOv{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--pitch-1);width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .sheet-head h2{margin:0;font-size:20px;}
  .sheet-close{background:none;border:none;color:var(--chalk-dim);font-size:22px;padding:4px 8px;}
  .field-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .field-line:last-child{border-bottom:none;}
  .field-line .fl-label{font-size:14px;color:var(--chalk-dim);}
  .field-line .fl-value{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--chalk);}
  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .login-card{max-width:400px;margin:15vh auto 0;padding:0 24px;text-align:center;}
  .login-card .mark{font-size:48px;margin-bottom:10px;}
  .login-card h1{font-size:26px;margin:0 0 4px;}
  .login-card p{color:var(--chalk-dim);font-size:14px;margin-bottom:20px;}
  .grupo-card{background:var(--pitch-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;cursor:pointer;text-align:left;width:100%;}
  .grupo-card:active{background:var(--pitch-3);}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="loginScreen">
  <div class="login-card">
    <div class="mark">🧑‍🏫</div>
    <h1>Mi Club</h1>
    <div id="loginCardContent">
      <p id="loginSubtitle">Ingresa tu cédula</p>
      <input type="tel" id="loginCedula" placeholder="Tu cédula" inputmode="numeric">
      <button class="primary block" onclick="intentarLoginEntrenador()">Ingresar</button>
    </div>
  </div>
</div>

<div id="appRoot">
  <header class="top">
    <img src="/api/logo?badge=entrenador" alt="" style="width:28px;height:28px;border-radius:7px;vertical-align:middle;margin-right:8px" onerror="this.style.display='none'"><h1 id="saludoHeaderEnt" style="display:inline">Hola 👋</h1>
    <div class="sub" id="verGrupoHeader" onclick="abrirSelectorGrupo()">CARGANDO...</div>
    <div class="centerline"></div>
  </header>

  <main>
    <div class="screen active" id="screen-grupoEnt">
      <div id="grupoEntContent"><div class="spinner"></div></div>
    </div>
    <div class="screen" id="screen-perfilEnt">
      <div id="perfilEntContent"><div class="spinner"></div></div>
    </div>
  </main>

  <nav class="tabs">
    <button class="active" data-tab="grupoEnt" onclick="cambiarTabEnt('grupoEnt')"><span class="ic">🏋️</span>Mi Grupo</button>
    <button data-tab="perfilEnt" onclick="cambiarTabEnt('perfilEnt')"><span class="ic">👤</span>Perfil</button>
  </nav>
</div>

<script>
(function aplicarTemaGuardadoAlInicio(){
  const t = safeGetEnt('temaAppEnt') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  if(t === 'club'){
    const colores = safeGetEnt('temaClubColoresEnt');
    if(colores){
      try {
        const c = JSON.parse(colores);
        document.documentElement.style.setProperty('--gold', c.principal);
        document.documentElement.style.setProperty('--green-ok', c.secundario);
      } catch(e){}
    }
  }
})();
function safeGetEnt(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function safeSetEnt(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

let TOKEN = safeGetEnt('entrenador_token');
let MIS_GRUPOS = [];
let ES_DIRECTOR = false;
let GRUPO_ACTUAL = null;
let currentTabEnt = 'grupoEnt';

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(()=>{ t.className='toast'; }, 2600);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function abrirSheet(html){
  cerrarSheet();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'sheetOverlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) cerrarSheet(); };
  overlay.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(overlay);
}
function cerrarSheet(){
  const el = document.getElementById('sheetOverlay');
  if(el) el.remove();
}

async function api(accion, extra){
  const body = Object.assign({ token: TOKEN, accion }, extra || {});
  try{
    const res = await fetch('/api/entrenador', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!data.success){ toast(data.error || 'Error', true); return null; }
    return data.data !== undefined ? data.data : true;
  }catch(e){
    toast('No se pudo conectar. Revisa tu internet.', true);
    return null;
  }
}

/* ---------- Login (mismo flujo que representante) ---------- */
let cedulaLoginPendiente = '';
let claveTemporalPendiente = '';

async function intentarLoginEntrenador(){
  const cedula = document.getElementById('loginCedula').value.trim();
  if(!cedula){ toast('Ingresa tu cédula', true); return; }
  const res = await api('login_entrenador', { cedula });
  if(res===null) return;
  if(!res.registrado){
    toast('No encontramos esa cédula. Consulta con el Admin del club.', true);
    return;
  }
  cedulaLoginPendiente = cedula;
  if(res.tieneClave){
    mostrarPantallaIngresarClave();
  } else {
    mostrarPantallaCrearClave();
  }
}

function mostrarPantallaIngresarClave(){
  document.getElementById('loginCardContent').innerHTML = `
    <p>Ingresa tu clave de seguridad</p>
    <input type="password" id="loginClave" placeholder="Clave de 6 dígitos" inputmode="numeric" maxlength="6">
    <button class="primary block" onclick="verificarClaveLogin()">Ingresar</button>
    <button class="block" style="margin-top:8px" onclick="volverAIngresarCedula()">← Usar otra cédula</button>
  `;
}

function mostrarPantallaCrearClave(){
  document.getElementById('loginCardContent').innerHTML = `
    <p>Es tu primera vez aquí. Crea una clave de seguridad de 6 números.</p>
    <input type="password" id="loginClaveNueva" placeholder="Crea tu clave (6 dígitos)" inputmode="numeric" maxlength="6">
    <input type="password" id="loginClaveNuevaConfirmar" placeholder="Repite la clave" inputmode="numeric" maxlength="6">
    <button class="primary block" onclick="crearClaveLogin()">Crear clave y entrar</button>
    <button class="block" style="margin-top:8px" onclick="volverAIngresarCedula()">← Usar otra cédula</button>
  `;
}

function volverAIngresarCedula(){
  cedulaLoginPendiente = '';
  document.getElementById('loginCardContent').innerHTML = `
    <p id="loginSubtitle">Ingresa tu cédula</p>
    <input type="tel" id="loginCedula" placeholder="Tu cédula" inputmode="numeric">
    <button class="primary block" onclick="intentarLoginEntrenador()">Ingresar</button>
  `;
}

async function crearClaveLogin(){
  const clave = document.getElementById('loginClaveNueva').value.trim();
  const confirmar = document.getElementById('loginClaveNuevaConfirmar').value.trim();
  if(!/^\d{6}$/.test(clave)){ toast('La clave debe ser de 6 números', true); return; }
  if(clave !== confirmar){ toast('Las claves no coinciden', true); return; }
  const res = await api('crear_clave_entrenador', { cedula: cedulaLoginPendiente, clave });
  if(res===null) return;
  TOKEN = res.token;
  safeSetEnt('entrenador_token', TOKEN);
  await entrarAppEntrenador(res.nombres);
}

async function verificarClaveLogin(){
  const clave = document.getElementById('loginClave').value.trim();
  if(!/^\d{6}$/.test(clave)){ toast('Ingresa los 6 dígitos de tu clave', true); return; }
  const res = await api('verificar_clave_entrenador', { cedula: cedulaLoginPendiente, clave });
  if(res===null) return;
  if(res.debeCambiarClave){
    claveTemporalPendiente = clave;
    mostrarPantallaCambiarClaveObligatorio();
    return;
  }
  TOKEN = res.token;
  safeSetEnt('entrenador_token', TOKEN);
  await entrarAppEntrenador(res.nombres);
}

function mostrarPantallaCambiarClaveObligatorio(){
  document.getElementById('loginCardContent').innerHTML = `
    <p>Esa era tu clave temporal. Ahora crea tu clave definitiva (6 números).</p>
    <input type="password" id="loginClaveDefinitiva" placeholder="Nueva clave (6 dígitos)" inputmode="numeric" maxlength="6">
    <input type="password" id="loginClaveDefinitivaConfirmar" placeholder="Repite la clave" inputmode="numeric" maxlength="6">
    <button class="primary block" onclick="confirmarCambioClaveObligatorio()">Guardar y entrar</button>
  `;
}

async function confirmarCambioClaveObligatorio(){
  const claveNueva = document.getElementById('loginClaveDefinitiva').value.trim();
  const confirmar = document.getElementById('loginClaveDefinitivaConfirmar').value.trim();
  if(!/^\d{6}$/.test(claveNueva)){ toast('La clave debe ser de 6 números', true); return; }
  if(claveNueva !== confirmar){ toast('Las claves no coinciden', true); return; }
  const login = await api('verificar_clave_entrenador', { cedula: cedulaLoginPendiente, clave: claveTemporalPendiente });
  if(login===null) return;
  TOKEN = login.token;
  safeSetEnt('entrenador_token', TOKEN);
  const res = await api('cambiar_clave_entrenador', { claveActual: claveTemporalPendiente, claveNueva });
  if(res===null) return;
  toast('¡Clave actualizada!');
  await entrarAppEntrenador(login.nombres);
}

if(TOKEN){
  api('listar_mis_grupos_entrenador').then(res=>{
    if(res!==null && res.grupos.length>0){ entrarAppEntrenador(null, res); }
    else if(res!==null){ safeSetEnt('entrenador_token',''); TOKEN=''; }
  });
}

async function entrarAppEntrenador(nombresLogin, gruposPrecargados){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appRoot').style.display='flex';
  if(nombresLogin) document.getElementById('saludoHeaderEnt').textContent = 'Hola, ' + nombresLogin.split(' ')[0] + ' 👋';

  const data = gruposPrecargados || await api('listar_mis_grupos_entrenador');
  if(data===null) return;
  MIS_GRUPOS = data.grupos;
  ES_DIRECTOR = data.esDirector;

  if(MIS_GRUPOS.length===0){
    document.getElementById('verGrupoHeader').textContent = 'SIN GRUPOS ASIGNADOS';
    document.getElementById('grupoEntContent').innerHTML = '<div class="empty"><span class="ic">🏋️</span>Todavía no tienes ningún grupo asignado. Consulta con el Admin del club.</div>';
    return;
  }

  const ultimoId = parseInt(safeGetEnt('entrenador_grupo_actual') || '0');
  GRUPO_ACTUAL = MIS_GRUPOS.find(g=>g.id===ultimoId) || MIS_GRUPOS[0];

  if(MIS_GRUPOS.length > 1){
    abrirSelectorGrupo(true);
  } else {
    actualizarHeaderGrupo();
    cargarMiGrupo();
  }
}

function actualizarHeaderGrupo(){
  document.getElementById('verGrupoHeader').textContent = (ES_DIRECTOR ? 'DIRECTOR · ' : '') + 'VIENDO: ' + (GRUPO_ACTUAL ? GRUPO_ACTUAL.nombre.toUpperCase() : '—');
}

function abrirSelectorGrupo(primeraVez){
  const html = `
    <div class="sheet-head"><h2>${primeraVez ? '¿Qué grupo quieres ver?' : 'Cambiar de grupo'}</h2>${primeraVez ? '' : '<button class="sheet-close" onclick="cerrarSheet()">✕</button>'}</div>
    ${MIS_GRUPOS.map(g=>`
      <button class="grupo-card" onclick="seleccionarGrupo(${g.id})">
        <div style="font-weight:700;font-size:16px">${esc(g.nombre)}</div>
        <div style="color:var(--chalk-dim);font-size:13px;margin-top:2px">${esc(g.descripcion||'')} · ${g.totalJugadores} jugador(es)</div>
      </button>
    `).join('')}
  `;
  abrirSheet(html);
}

function seleccionarGrupo(grupoId){
  GRUPO_ACTUAL = MIS_GRUPOS.find(g=>g.id===grupoId);
  safeSetEnt('entrenador_grupo_actual', String(grupoId));
  actualizarHeaderGrupo();
  cerrarSheet();
  cargarMiGrupo();
}

function cambiarTabEnt(tab){
  currentTabEnt = tab;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  if(tab==='grupoEnt') cargarMiGrupo();
  if(tab==='perfilEnt') cargarPerfilEnt();
}
</script>
<script>
const DIAS_SEMANA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

async function cargarMiGrupo(){
  if(!GRUPO_ACTUAL) return;
  const cont = document.getElementById('grupoEntContent');
  cont.innerHTML = '<div class="spinner"></div>';
  const data = await api('ver_detalle_grupo_entrenador', {grupoId: GRUPO_ACTUAL.id});
  if(data===null) return;
  cont.innerHTML = `
    <div class="card">
      <div class="card-title"><h3>${esc(data.grupo.nombre)}</h3></div>
      <div class="meta">${esc(data.grupo.descripcion||'')}</div>
    </div>
    <div class="card">
      <div class="card-title"><h3>📅 Horario semanal</h3></div>
      ${data.horarios.length===0 ? '<p style="color:var(--chalk-dim);font-size:13px">Sin horario definido todavía.</p>' : data.horarios.map(h=>`
        <div class="field-line">
          <div class="fl-value">${DIAS_SEMANA[h.diaSemana]}</div>
          <div class="fl-label">${h.horaInicio.slice(0,5)}${h.horaFin ? ' - '+h.horaFin.slice(0,5) : ''} ${h.lugar ? '· 📍 '+esc(h.lugar) : ''}</div>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <div class="card-title"><h3>👤 Jugadores (${data.jugadores.length})</h3></div>
      ${data.jugadores.length===0 ? '<p style="color:var(--chalk-dim);font-size:13px">Sin jugadores en este grupo todavía.</p>' : data.jugadores.map(j=>`
        <div class="field-line" style="cursor:pointer" onclick="verHistorialJugador(${j.id}, ${JSON.stringify(j.nombres+' '+j.apellidos).replace(/"/g,'&quot;')})">
          <div class="fl-value">${esc(j.nombres)} ${esc(j.apellidos)}</div>
        </div>
      `).join('')}
    </div>
    <div class="row-actions">
      <button class="sm primary" onclick="abrirTomarAsistencia()">📋 Tomar asistencia de hoy</button>
      <button class="sm" onclick="abrirHistorialSesiones()">📊 Ver historial</button>
    </div>
  `;
}

/* ---------- Asistencia y rutina ---------- */
let sesionActual = null;
let fechaSesionActual = '';

function hoyIso(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function abrirTomarAsistencia(fecha){
  fechaSesionActual = fecha || hoyIso();
  const data = await api('obtener_o_crear_sesion_dia_entrenador', {grupoId: GRUPO_ACTUAL.id, fecha: fechaSesionActual});
  if(data===null) return;
  sesionActual = data.sesion;
  mostrarTomarAsistencia(data.jugadores);
}

function mostrarTomarAsistencia(jugadores){
  const html = `
    <div class="sheet-head"><h2>Asistencia</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <label>Fecha</label>
    <input type="date" id="asistenciaFecha" value="${fechaSesionActual}" onchange="cambiarFechaAsistencia()">
    <div class="card">
      <div class="card-title"><h3>Jugadores</h3></div>
      ${jugadores.map(j=>`
        <div class="field-line">
          <div class="fl-value">${esc(j.nombres)} ${esc(j.apellidos)}</div>
          <div style="display:flex;gap:6px">
            <button class="sm ${j.asistio===true?'primary':''}" data-jugador="${j.id}" data-valor="true" onclick="marcarAsistencia(${j.id}, true, this)">✓ Vino</button>
            <button class="sm ${j.asistio===false?'danger':''}" data-jugador="${j.id}" data-valor="false" onclick="marcarAsistencia(${j.id}, false, this)">✕ Faltó</button>
          </div>
        </div>
      `).join('')}
    </div>
    <label>Rutina de hoy</label>
    <textarea id="sesionRutina" rows="3" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-family:inherit;font-size:14px">${esc(sesionActual.rutina||'')}</textarea>
    <label style="margin-top:10px">Notas (opcional)</label>
    <textarea id="sesionNotas" rows="2" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--pitch-2);color:var(--chalk);font-family:inherit;font-size:14px">${esc(sesionActual.notas||'')}</textarea>
    <button class="primary block" id="btnGuardarSesion" style="margin-top:14px" onclick="guardarAsistenciaYRutina()">Guardar</button>
  `;
  abrirSheet(html);
  window._asistenciaTemp = {};
  jugadores.forEach(j => { window._asistenciaTemp[j.id] = { asistio: j.asistio, justificacion: j.justificacion }; });
}

function marcarAsistencia(jugadorId, valor, btnEl){
  window._asistenciaTemp[jugadorId] = window._asistenciaTemp[jugadorId] || {};
  window._asistenciaTemp[jugadorId].asistio = valor;
  const fila = btnEl.parentElement;
  fila.querySelectorAll('button').forEach(b=>{
    b.classList.remove('primary','danger');
    if(b.dataset.valor==='true' && valor===true) b.classList.add('primary');
    if(b.dataset.valor==='false' && valor===false) b.classList.add('danger');
  });
}

async function cambiarFechaAsistencia(){
  const nuevaFecha = document.getElementById('asistenciaFecha').value;
  if(!nuevaFecha) return;
  await abrirTomarAsistencia(nuevaFecha);
}

async function guardarAsistenciaYRutina(){
  const btn = document.getElementById('btnGuardarSesion');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  const rutina = document.getElementById('sesionRutina').value.trim();
  const notas = document.getElementById('sesionNotas').value.trim();
  const asistencias = Object.entries(window._asistenciaTemp).map(([jugadorId, v])=>({
    jugadorId: parseInt(jugadorId), asistio: !!v.asistio, justificacion: v.justificacion || null,
  }));
  const res = await api('guardar_sesion_entrenamiento_entrenador', {sesionId: sesionActual.id, rutina, notas, asistencias});
  if(res===null){ btn.disabled = false; btn.textContent = 'Guardar'; return; }
  toast('Asistencia guardada');
  cerrarSheet();
}

async function abrirHistorialSesiones(){
  const data = await api('listar_historial_sesiones_entrenador', {grupoId: GRUPO_ACTUAL.id});
  if(data===null) return;
  const html = `
    <div class="sheet-head"><h2>Historial de sesiones</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    ${data.length===0 ? '<p style="color:var(--chalk-dim);font-size:14px">Sin sesiones registradas todavía.</p>' : data.map(s=>`
      <div class="field-line" style="cursor:pointer" onclick="cerrarSheet(); abrirTomarAsistencia('${s.fecha.slice(0,10)}')">
        <div>
          <div class="fl-value">${fechaCortaEnt(s.fecha)}</div>
          <div class="fl-label">${esc(s.rutina || 'Sin rutina registrada')}</div>
        </div>
        <div class="fl-value">${s.totalAsistieron}/${s.totalJugadores}</div>
      </div>
    `).join('')}
  `;
  abrirSheet(html);
}

function fechaCortaEnt(f){
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const d = new Date(f);
  return dias[d.getUTCDay()]+' '+String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();
}

async function verHistorialJugador(jugadorId, nombre){
  const data = await api('ver_historial_asistencia_jugador_entrenador', {jugadorId, grupoId: GRUPO_ACTUAL.id});
  if(data===null) return;
  const html = `
    <div class="sheet-head"><h2>${esc(nombre)}</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    ${data.porcentaje!==null ? `<div class="card" style="text-align:center"><div class="fl-label">ASISTENCIA</div><div style="font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:var(--gold)">${data.porcentaje}%</div><div class="fl-label">${data.asistio} de ${data.total} sesiones</div></div>` : '<p style="color:var(--chalk-dim);font-size:13px">Sin historial de asistencia todavía.</p>'}
    ${data.historial.map(h=>`
      <div class="field-line">
        <div class="fl-value">${fechaCortaEnt(h.fecha)}</div>
        <span class="badge ${h.asistio?'confirmando':'cancelado'}">${h.asistio?'Asistió':'Faltó'}</span>
      </div>
    `).join('')}
  `;
  abrirSheet(html);
}

async function cargarPerfilEnt(){
  const cont = document.getElementById('perfilEntContent');
  cont.innerHTML = '<div class="spinner"></div>';
  const perfil = await api('obtener_perfil_entrenador');
  if(perfil===null) return;
  cont.innerHTML = `
    <div class="card">
      <div class="card-title"><h3>Mis datos</h3></div>
      <label>Nombres</label>
      <input id="entPerfilNombres" value="${esc(perfil.nombres||'')}">
      <label>Apellidos</label>
      <input id="entPerfilApellidos" value="${esc(perfil.apellidos||'')}">
      <label>Cédula</label>
      <input value="${esc(perfil.cedula||'')}" disabled style="opacity:.6">
      <label>Teléfono</label>
      <input id="entPerfilTelefono" value="${esc(perfil.telefono||'')}" type="tel">
      <label>Rol</label>
      <input value="${perfil.rol==='director' ? 'Director' : 'Entrenador'}" disabled style="opacity:.6">
      <button class="primary block" style="margin-top:10px" onclick="guardarPerfilEnt()">Guardar</button>
    </div>
    <button class="block" onclick="abrirSelectorTemaEnt()">🎨 Estilo de la app</button>
    <button class="block" onclick="abrirCambiarClaveEnt()">🔒 Cambiar mi clave de seguridad</button>
    <button class="block danger" onclick="cerrarSesionEnt()">Cerrar sesión en este dispositivo</button>
  `;
}

async function guardarPerfilEnt(){
  const nombres = document.getElementById('entPerfilNombres').value.trim();
  const apellidos = document.getElementById('entPerfilApellidos').value.trim();
  const telefono = document.getElementById('entPerfilTelefono').value.trim();
  if(!nombres || !apellidos){ toast('Completa nombres y apellidos', true); return; }
  const res = await api('actualizar_perfil_entrenador', {nombres, apellidos, telefono});
  if(res===null) return;
  toast('Datos actualizados');
}

function abrirCambiarClaveEnt(){
  const html = `
    <div class="sheet-head"><h2>Cambiar mi clave</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <label>Clave actual</label>
    <input type="password" id="claveActualEnt" inputmode="numeric" maxlength="6">
    <label>Clave nueva (6 dígitos)</label>
    <input type="password" id="claveNuevaEnt" inputmode="numeric" maxlength="6">
    <label>Repite la clave nueva</label>
    <input type="password" id="claveNuevaConfirmarEnt" inputmode="numeric" maxlength="6">
    <button class="primary block" style="margin-top:12px" onclick="guardarCambioClaveEnt()">Guardar</button>
  `;
  abrirSheet(html);
}

async function guardarCambioClaveEnt(){
  const claveActual = document.getElementById('claveActualEnt').value.trim();
  const claveNueva = document.getElementById('claveNuevaEnt').value.trim();
  const confirmar = document.getElementById('claveNuevaConfirmarEnt').value.trim();
  if(!/^\d{6}$/.test(claveNueva)){ toast('La clave nueva debe ser de 6 números', true); return; }
  if(claveNueva !== confirmar){ toast('Las claves no coinciden', true); return; }
  const res = await api('cambiar_clave_entrenador', { claveActual, claveNueva });
  if(res===null) return;
  toast('Clave actualizada');
  cerrarSheet();
}

function cerrarSesionEnt(){
  if(!confirm('¿Cerrar sesión en este dispositivo?')) return;
  safeSetEnt('entrenador_token', '');
  location.reload();
}

function extraerColoresDelLogoEnt(){
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const size = 64;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0,0,size,size).data;
        const buckets = {};
        for(let i=0;i<data.length;i+=4){
          const r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];
          if(a<200) continue;
          const max=Math.max(r,g,b), min=Math.min(r,g,b);
          const sat = max===0?0:(max-min)/max;
          const lum = (r+g+b)/3;
          if(sat<0.25 || lum>235 || lum<25) continue;
          const key = [Math.round(r/24)*24, Math.round(g/24)*24, Math.round(b/24)*24].join(',');
          buckets[key] = (buckets[key]||0)+1;
        }
        const ordenado = Object.entries(buckets).sort((a,b)=>b[1]-a[1]);
        if(ordenado.length===0){ resolve(null); return; }
        const [r,g,b] = ordenado[0][0].split(',').map(Number);
        let r2=r,g2=g,b2=b;
        for(const [k] of ordenado.slice(1)){
          const [rr,gg,bb] = k.split(',').map(Number);
          if(Math.abs(rr-r)+Math.abs(gg-g)+Math.abs(bb-b) > 60){ r2=rr;g2=gg;b2=bb; break; }
        }
        resolve({ principal: `rgb(${r},${g},${b})`, secundario: `rgb(${r2},${g2},${b2})` });
      } catch(e){ resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = '/api/logo';
  });
}

async function cambiarTemaEnt(tema){
  document.documentElement.setAttribute('data-theme', tema);
  safeSetEnt('temaAppEnt', tema);
  document.documentElement.style.removeProperty('--gold');
  document.documentElement.style.removeProperty('--green-ok');
  if(tema === 'club'){
    let colores = null;
    try { colores = JSON.parse(safeGetEnt('temaClubColoresEnt') || 'null'); } catch(e){}
    if(!colores){
      colores = await extraerColoresDelLogoEnt();
      if(colores) safeSetEnt('temaClubColoresEnt', JSON.stringify(colores));
    }
    if(colores){
      document.documentElement.style.setProperty('--gold', colores.principal);
      document.documentElement.style.setProperty('--green-ok', colores.secundario);
    } else {
      toast('No se pudo leer el logo todavía', true);
    }
  }
  cerrarSheet();
}

function abrirSelectorTemaEnt(){
  const actual = safeGetEnt('temaAppEnt') || 'dark';
  const html = `
    <div class="sheet-head"><h2>Estilo de la app</h2><button class="sheet-close" onclick="cerrarSheet()">✕</button></div>
    <div class="field-line" style="cursor:pointer" onclick="cambiarTemaEnt('dark')"><div><div class="fl-value">🌙 Oscuro</div></div>${actual==='dark'?'<span class="badge confirmando">Activo</span>':''}</div>
    <div class="field-line" style="cursor:pointer" onclick="cambiarTemaEnt('light')"><div><div class="fl-value">☀️ Claro</div></div>${actual==='light'?'<span class="badge confirmando">Activo</span>':''}</div>
    <div class="field-line" style="cursor:pointer" onclick="cambiarTemaEnt('club')"><div><div class="fl-value">🎨 Del club</div></div>${actual==='club'?'<span class="badge confirmando">Activo</span>':''}</div>
  `;
  abrirSheet(html);
}
